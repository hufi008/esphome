# akkubox/hardware.yaml

substitutions:
  # Pin assignment
  bat_adc_pin: "GPIO13"
  board_rgb_pin: "GPIO48"

  # I2S MAX98357
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO9
  i2s_din_pin: GPIO8

  # Akku-Spannungsmessung
  battery_analog_pin: GPIO13

  # SSD1306 OLED
  i2c_sda_pin: GPIO6
  i2c_scl_pin: GPIO7
  # Display OLED SSD1306
  ssd_addr:      "0x3C"

  # KY-040 Rotary Encoder
  encoder_sw_pin: GPIO3
  encoder_dt_pin: GPIO4
  encoder_clk_pin: GPIO5

  # Clean battery voltage configuration (in Volts)
  bat_min_voltage: "3.75"             # starts deep_sleep
  bat_max_voltage: "4.23"             # Real maximum voltage under load

deep_sleep:
  id: deep_sleep_control
  wakeup_pin:
    ignore_strapping_warning: true
    number: ${encoder_sw_pin}
    allow_other_uses: true
    inverted: true
    mode:
      input: true

button:
  - platform: restart
    name: "Restart"

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    channel_colors: RGB
    pin: ${board_rgb_pin}
    num_leds: 1
    name: "Status LED"
    id: onboard_rgb

# region Sensors
text_sensor:
  # Wifi Informationen
  - platform: wifi_info
    id: wifi_info
    ip_address:
      name: "IP"
      icon: "mdi:wifi"
    ssid:
      name: "SSID"
      icon: "mdi:wifi"
    bssid:
      name: "BSSID"
      icon: "mdi:wifi"
    mac_address:
      name: "Mac"
      icon: "mdi:wifi"
    dns_address:
      name: "DNS"
      icon: "mdi:wifi"
    power_save_mode:
      name: "Power Save"
      icon: "mdi:wifi"



sensor:
  # Wifi Informationen
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal dB"
    update_interval: 30s
  - platform: template
    id: wifi_channel
    name: "Channel"
    icon: "mdi:wifi-marker"
    entity_category: diagnostic
    lambda: |-
      if (id(wifi_id).is_connected())
        return id(wifi_id).get_wifi_channel();
      return NAN;    
    update_interval: 30s      

  # 1. Pure analog measurement via GPIO13 (with 1:1 voltage divider)
  - platform: adc
    pin: ${bat_adc_pin}
    id: battery_voltage_raw
    attenuation: 12db
    update_interval: 5s
    internal: true
    filters:
      - multiply: 2.149

  # 2. Output of the real battery voltage to Home Assistant
  - platform: template
    name: "Akkuspannung"
    id: battery_voltage
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    device_class: power
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      return id(battery_voltage_raw).state;

  # 3. State of charge in percent based on real cell limits
  - platform: template
    name: "Akku Ladestand"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: power
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float voltage = id(battery_voltage_raw).state; 
      if (std::isnan(voltage)) return NAN; 
      
      float percentage = (voltage - ${bat_min_voltage}) / (${bat_max_voltage} - ${bat_min_voltage}) * 100.0f;
      return std::clamp(percentage, 0.0f, 100.0f);
    # GLÄTTUNG HIER EINGEBAUT:
    filters:
      - sliding_window_moving_average:
          window_size: 12  # 12 Werte * 5s Intervall = Glättung über die letzte Minute
          send_every: 1    # Aktualisiert den Sensorwert bei jeder Messung

    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;

            // Wenn der geglättete Wert 5% erreicht
            if (x < 5.0f) {
              ESP_LOGW(
                "power",
                "Battery low: %.2f V",
                id(battery_voltage_raw).state
              );
            }

            // Wenn der geglättete Wert 0% erreicht
            if (x <= 0.0f) {
              ESP_LOGE(
                "power",
                "Battery smoothed level is 0%%. Entering deep sleep."
              );
              id(start_shutdown).execute();
            }
  - platform: template
    name: "Akku wird geladen"
    id: is_charging
    device_class: power
    update_interval: 5s
    lambda: |-
      float raw = id(battery_voltage_raw).state;
      float level = id(battery_level).state; // Nutzen wir zur Validierung

      if (std::isnan(raw) || std::isnan(level)) return {};

      static float last_stable_v = 0.0f;

      // Erstanlauf des ESPs absichern
      if (last_stable_v == 0.0f) {
        last_stable_v = raw;
        return false;
      }

      // Berechnung des Unterschieds zur letzten stabilen Phase
      float delta_u = raw - last_stable_v;

      // 0.06V Schwelle filtert das ADC-Rauschen des S3 SuperMini sicher aus.
      // Ein USB-Anschluss zieht die Kurve sofort deutlicher hoch.
      if (delta_u > 0.06f) {
        last_stable_v = raw; // Neuen oberen Pegel merken
        return true;
      } 
      // Wenn das Kabel abgezogen wird, bricht die Spannung schlagartig ein
      else if (delta_u < -0.06f) {
        last_stable_v = raw; // Neuen unteren Pegel merken
        return false;
      }

      // Innerhalb des Rauschbandes behalten wir den alten Zustand bei
      return id(is_charging).state;


  - platform: rotary_encoder
    id: my_encoder_pulse
    pin_a:
      number: ${encoder_clk_pin}
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoder_dt_pin}
      mode: INPUT_PULLUP
    resolution: 1
    publish_initial_value: true
    filters:
      - debounce: 50ms
      - throttle: 50ms

binary_sensor:
  - platform: gpio
    id: my_encoder_button
    pin:
      ignore_strapping_warning: true
      number: ${encoder_sw_pin}
      inverted: true
      allow_other_uses: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 20ms
# endregion

# region Audio
# -------------------------------------------------------------------
# Audio
# -------------------------------------------------------------------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: my_speaker
    dac_type: external
    i2s_dout_pin: ${i2s_din_pin}
    i2s_audio_id: i2s_out
    sample_rate: 48000
    channel: mono
    timeout: never
    buffer_duration: 100ms

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_source:
  - platform: sendspin
    id: sendspin_media_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: 500000
    fixed_delay: 500us
    initial_static_delay: 500ms
    static_delay_adjustable: true

  - platform: audio_http
    id: audio_http_source
    task_stack_in_psram: true
    buffer_size: 50000

media_player:
  - platform: sendspin
    id: sendspin_player
    name: "Group"
    on_state: 
      then:
        - logger.log:
            level: DEBUG
            format: "sendspin onState - Neuer Zustand: %s"
            args: [ "esphome::media_player::media_player_state_to_string(id(sendspin_player).state)" ]

  - platform: speaker_source
    id: audio_player
    name: "Audio Player"
    media_pipeline:
      speaker: my_speaker
      sources:
        - sendspin_media_source
        - audio_http_source
    on_volume: 
      then:
        - lambda: 'ESP_LOGD(__FILE__, "speaker on_volume");'
        - script.execute: show_volume
# endregion

i2c:
  - id: i2c_bus
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    scan: true
    frequency: 400kHz

