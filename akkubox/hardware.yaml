# region Scripts
script:
  - id: start_shutdown
    mode: single
    then: 
      - media_player.stop: sendspin_player
      - light.turn_off: onboard_rgb
      - lambda: 'id(my_display).turn_off();'
      - wait_until:
          and:
            - light.is_off: onboard_rgb
            - binary_sensor.is_off: my_encoder_button
      - safe_mode.mark_successful:       
      - delay: 200ms          
      - logger.log:
          level: INFO
          format: "Going to bed..."
      - deep_sleep.enter: deep_sleep_control

# endregion