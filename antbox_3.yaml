# Saurons Eye s3 2.yaml

substitutions:
  device_name: "esphome-web-d4af14"
  friendly_name: "Antbox 3"


packages:
  base: !include common/base-s3_supermini.yaml

logger:
  level: DEBUG

esphome:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
    # scan_results:
    #   name: Latest Scan Results
    power_save_mode:
      name: Wifi Power Save Mode


sensor:
  # Wifi Informationen
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal dB"
    update_interval: 2s
  - platform: template
    id: wifi_channel
    name: "Channel"
    icon: "mdi:wifi-marker"
    entity_category: diagnostic
    lambda: |-
      if (id(wifi_id).is_connected())
        return id(wifi_id).get_wifi_channel();
      return -1;    
    update_interval: 60s
