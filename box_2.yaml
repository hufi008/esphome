substitutions:
  device_name: "esphome-web-675044"
  friendly_name: "MusicBox_2"
  media_player_entity_id: "media_player.${ friendly_name | lower | replace(' ', '_') }_audio_player"
  
  # Pin assignment
  bat_adc_pin: "GPIO13"
  board_rgb_pin: "GPIO48"

  # I2S MAX98357
  i2s_lrc_pin: GPIO10
  i2s_bclk_pin: GPIO9
  i2s_din_pin: GPIO8

  # Akku-Spannungsmessung
  battery_analog_pin: GPIO13

  # SSD1306 OLED
  oled_sda_pin: GPIO6
  oled_scl_pin: GPIO7

  # KY-040 Rotary Encoder
  encoder_sw_pin: GPIO3
  # ignore_strapping_warning: true
  encoder_dt_pin: GPIO4
  encoder_clk_pin: GPIO5

  # Clean battery voltage configuration (in Volts)
  bat_min_voltage: "3.31"             # Calibrated from your real shutdown
  bat_max_voltage: "4.23"             # Real maximum voltage under load
  bat_shutdown_voltage: "3.35"        # Forces safe infinite deep sleep to protect hardware
  bat_recover_voltage: "3.40"  

logger:
  level: DEBUG

packages:
  base: !include common/base-s3_devkitc_1.yaml

esphome:
  project:
    name: "hufi.musicbox"
    version: "0.1.5"
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI(__FILE__, "Starting up...");
        - light.turn_on:
            id: onboard_rgb
            effect: "Rainbow Effect"

globals:
  - id: low_battery_count
    type: int
    restore_value: no
    initial_value: '0'

deep_sleep:
  id: deep_sleep_control
  wakeup_pin:
    number: ${encoder_sw_pin}
    inverted: true
    mode:
      input: true

button:
  - platform: restart
    name: "Restart"

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: RGB
    pin: ${board_rgb_pin}
    num_leds: 1
    name: "Status LED"
    id: onboard_rgb
    effects:
      - addressable_rainbow:
          name: "Rainbow Effect"
          speed: 5
          width: 50

text_sensor:
  # Wifi Informationen
  - platform: wifi_info
    id: wifi_info
    ip_address:
      name: "IP"
      icon: "mdi:wifi"
    ssid:
      name: "SSID"
      icon: "mdi:wifi"
    bssid:
      name: "BSSID"
      icon: "mdi:wifi"
    mac_address:
      name: "Mac"
      icon: "mdi:wifi"
    dns_address:
      name: "DNS"
      icon: "mdi:wifi"
    power_save_mode:
      name: "Power Save"
      icon: "mdi:wifi"

sensor:
  # Wifi Informationen
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal dB"
    update_interval: 30s
  - platform: template
    id: wifi_channel
    name: "Channel"
    icon: "mdi:wifi-marker"
    entity_category: diagnostic
    lambda: |-
      if (id(wifi_id).is_connected())
        return id(wifi_id).get_wifi_channel();
      return -1;    
    update_interval: 30s      

  # 1. Pure analog measurement via GPIO13 (with 1:1 voltage divider)
  - platform: adc
    pin: ${bat_adc_pin}
    id: battery_voltage_raw
    attenuation: 12db
    update_interval: 5s
    internal: true
    filters:
      - multiply: 2.149

  # 2. Output of the real battery voltage to Home Assistant
  - platform: template
    name: "Akkuspannung"
    id: battery_voltage
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      return id(battery_voltage_raw).state;

  # 3. State of charge in percent based on real cell limits
  - platform: template
    name: "Akku Ladestand"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float voltage = id(battery_voltage_raw).state; 
      if (std::isnan(voltage)) return NAN; 
      
      // Calculate pure percentage
      float percentage = (voltage - ${bat_min_voltage}) / (${bat_max_voltage} - ${bat_min_voltage}) * 100.0f;
      
      // Clean C++ clamping between 0.0 and 100.0
      return std::clamp(percentage, 0.0f, 100.0f);
    on_value:
      then:
        - lambda: |-
            float voltage = id(battery_voltage_raw).state;

            if (std::isnan(voltage)) {
              return;
            }

            // Unterhalb der Abschaltschwelle:
            // Fehlerzähler erhöhen
            if (voltage < ${bat_shutdown_voltage}) {
              id(low_battery_count)++;

              ESP_LOGW(
                "power",
                "Battery low: %.2f V (%d/3)",
                voltage,
                id(low_battery_count)
              );
            }

            // Erst oberhalb der Recover-Schwelle
            // wird der Zähler wieder zurückgesetzt
            else if (voltage > ${bat_recover_voltage}) {
              if (id(low_battery_count) != 0) {
                ESP_LOGI(
                  "power",
                  "Battery recovered: %.2f V - counter reset",
                  voltage
                );
              }

              id(low_battery_count) = 0;
            }

            // Zwischen shutdown und recover
            // bleibt der aktuelle Zählerstand erhalten

            if (id(low_battery_count) >= 3) {
              ESP_LOGE(
                "power",
                "Battery critical: %.2f V. Entering deep sleep.",
                voltage
              );

              id(deep_sleep_control).begin_sleep();
            }