substitutions:
  cover_image_dimension: 112x112
  font_size_small: 16
  font_size_medium: 20
  font_size_large: 24
  font_size_huge: 32
  font_size_giant: 45


# -------------------------------------------------------------------
# Display und Touch
# -------------------------------------------------------------------
spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}

display:
  - platform: mipi_spi
    model: ILI9341
    id: my_display
    spi_mode: MODE0
    data_rate: 40MHz
    cs_pin: ${pin_display_cs}
    dc_pin: ${pin_display_dc}
    reset_pin: ${pin_display_reset}
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    dimensions:
      height: 240
      width: 320

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: ${pin_touch_cs}
    interrupt_pin: ${pin_touch_irq}
    update_interval: never
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 240
      x_max: 3850
      y_min: 350
      y_max: 3900
