# common/base-s3_supermini.yaml

packages:
- !include base-esp32.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240mhz
  flash_mode: dio
  # partitions: partitions_4MB.csv
  framework:
    type: esp-idf

      
wifi:
  power_save_mode: NONE
  fast_connect: true
  output_power: 11dB

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

psram:
  mode: quad
  speed: 80MHz


