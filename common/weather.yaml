  includes:
    - "<sstream>"
  on_boot:
    - priority: 250
      then:
      - lambda: |-
          ESP_LOGI(__FILE__, "Register Updater Scripts");
          // id(idle_updater_scripts).push_back([]() { id(update_weather_dayly).execute(); });
          id(idle_updater_scripts).push_back([]() { id(update_weather_hourly).execute(); });

