  - id: update_weather_hourly
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: weather.forecast_home
            type: hourly  # Auf stündliche Vorhersage umgestellt
          capture_response: true
          response_template: >-
            [
              {% for h in response['weather.forecast_home']['forecast'] %}
                {
                  "datetime": "{{ h.datetime }}",
                  "condition": "{{ h.condition }}",
                  "temperature": {{ h.temperature | default(0) }},
                  "precipitation_probability": {{ h.precipitation_probability | default(0) }}
                }{% if not loop.last %},{% endif %}
              {% endfor %}
            ]
          on_success:
            - lambda: |-
                ESP_LOGI(__FILE__, "update_weather_hourly");

                static const char* weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
                static const std::map<std::string, esphome::image::Image*> weather_icon_map = {
                  {"sunny",           id(icon_weather_sunny)},
                  {"clear-night",     id(icon_weather_clear_night)},
                  {"partlycloudy",    id(icon_weather_partlycloudy)},
                  {"cloudy",          id(icon_weather_cloudy)},
                  {"fog",             id(icon_weather_fog)},
                  {"pouring",         id(icon_weather_pouring)},
                  {"rainy",           id(icon_weather_rainy)},
                  {"hail",            id(icon_weather_hail)},
                  {"snowy",           id(icon_weather_snowy)},
                  {"snowy-rainy",     id(icon_weather_snowy_rainy)},
                  {"lightning",       id(icon_weather_lightning)},
                  {"lightning-rainy", id(icon_weather_lightning_rainy)},
                  {"windy",           id(icon_weather_windy)},
                  {"windy-variant",   id(icon_weather_windy)}
                };
                
                static size_t current_day_index = 0;

                // Durch unser response_template liegt hier jetzt ein sauberes, schlankes Array
                if (!response["response"].is<JsonArrayConst>()) {
                  id(idle_message1) = str_sprintf("Warte auf Daten...");
                  return;
                }

                JsonArrayConst forecast = response["response"].as<JsonArrayConst>();
                size_t total_hours = forecast.size();
                ESP_LOGI(__FILE__, "recieved forecast for %d hours", total_hours);

                if (total_hours == 0) {
                  id(idle_message1) = str_sprintf("Keine Vorhersage");
                  return;
                }

                if (current_day_index >= total_hours) {
                  current_day_index = 0;
                }

                JsonObjectConst day_data = forecast[current_day_index].as<JsonObjectConst>();
                std::string day_label = "";
                std::string output;
                serializeJson(day_data, output);                
                ESP_LOGI(__FILE__, "day_data[%d] %s", current_day_index, output.c_str() );

                if (day_data["datetime"].is<std::string>()) {
                  std::string dt_str = day_data["datetime"].as<std::string>();
                  int year = 0, month = 0, day = 0, hour = 0, min = 0;
                  int parsed = sscanf(dt_str.c_str(), "%d-%d-%dT%d:%d", &year, &month, &day, &hour, &min);

                  if (parsed >= 5) {
                    struct tm forecast_tm = {0};
                    forecast_tm.tm_year = year - 1900;
                    forecast_tm.tm_mon = month - 1;
                    forecast_tm.tm_mday = day;
                    forecast_tm.tm_hour = hour;
                    forecast_tm.tm_min = min;
                    time_t forecast_time = mktime(&forecast_tm);

                    auto now = id(esptime).now();
                    if (now.is_valid()) {
                      struct tm current_tm = {0};
                      current_tm.tm_year = now.year - 1900;
                      current_tm.tm_mon = now.month - 1;
                      current_tm.tm_mday = now.day_of_month;
                      time_t current_time = mktime(&current_tm);

                      double diff_seconds = difftime(forecast_time, current_time);
                      int diff_days = std::floor(diff_seconds / 86400.0);

                      if (diff_days == 0) {
                        day_label = str_sprintf("Heute %02d:%02d", hour, min);
                      } else if (diff_days == 1) {
                        day_label = str_sprintf("Morgen %02d:%02d", hour, min);
                      } else if (diff_days > 1 && forecast_tm.tm_wday >= 0 && forecast_tm.tm_wday <= 6) {
                        day_label = str_sprintf("%s %02d:%02d", weekdays[forecast_tm.tm_wday], hour, min);
                      }
                    }
                  }
                }

                if (day_label.empty()) {
                  day_label = str_sprintf("+%dh", current_day_index);
                }

                // Icon zuweisen
                if (day_data["condition"].is<std::string>()) {
                  auto it = weather_icon_map.find(day_data["condition"].as<std::string>());
                  id(image_icon) = (it != weather_icon_map.end()) ? it->second : id(icon_weather_exceptional);
                }

                // Werte auslesen
                float temp = day_data["temperature"].is<float>() ? day_data["temperature"].as<float>() : 0.0;
                float pop  = day_data["precipitation_probability"].is<float>() ? day_data["precipitation_probability"].as<float>() : 0.0;

                // Ausgabe an das Display
                id(idle_message1) = str_sprintf("%s", day_label.c_str());
                id(idle_message2) = str_sprintf("%.1f°C | %.0f%%", temp, pop);

                current_day_index++;
