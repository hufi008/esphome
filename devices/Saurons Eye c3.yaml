# devices/Saurons Eye c3.yaml

substitutions:
  device_name: "esphome-web-d3bc3c"
  friendly_name: "Saurons Eye c3"

  # GC9A01
  pin_display_reset: GPIO0
  pin_display_cs:    GPIO1
  pin_display_dc:    GPIO2
  pin_spi_mosi:      GPIO3
  pin_spi_clk:       GPIO4

  # Saurons Eye – geräteabhängige Animationsparameter
  eye_update_interval: "100ms"
  eye_drain_time: "8000"
  eye_fire_width: "160"
  eye_offset_y: "40"
  eye_rx: "119.0"
  eye_ry: "49.0"
  eye_pupil_width_initial: "6"
  eye_pupil_width_base: "4"
  eye_pupil_top: "91"
  eye_pupil_height: "58"

packages:
  base: !include ../common/base-c3_supermini.yaml
  display: !include ../common/GC9A01.yaml
  hardware: !include ../saurons_eye/hardware.yaml
  functions: !include ../saurons_eye/main.yaml

logger:
  level: DEBUG
