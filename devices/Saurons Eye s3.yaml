# devices/Saurons Eye s3.yaml

substitutions:
  device_name: "esphome-web-e8b9b0"
  friendly_name: "Saurons Eye s3"

  # GC9A01
  pin_display_reset: GPIO09
  pin_display_cs:    GPIO10
  pin_display_dc:    GPIO11
  pin_spi_mosi:      GPIO12
  pin_spi_clk:       GPIO13

  # Saurons Eye – geräteabhängige Animationsparameter
  eye_update_interval: "48ms"
  eye_drain_time: "3000"
  eye_fire_width: "200"
  eye_offset_y: "20"
  eye_rx: "119.0"
  eye_ry: "59.0"
  eye_pupil_width_initial: "12"
  eye_pupil_width_base: "8"
  eye_pupil_top: "81"
  eye_pupil_height: "78"

packages:
  base: !include ../common/base-s3_supermini.yaml
  display: !include ../common/GC9A01.yaml
  hardware: !include ../saurons_eye/hardware.yaml
  functions: !include ../saurons_eye/main.yaml

logger:
  level: DEBUG
