# Voice Satellite 1
# Bestehende Hardware und Netzwerkidentität von speaker_2 bleiben erhalten.

substitutions:
  device_name: "esphome-web-f407a0"
  friendly_name: "Voice Satellite 1"

  # OLED SSD1306 am I2C-Bus
  i2c_sda_pin: "GPIO17"
  i2c_scl_pin: "GPIO18"
  ssd_addr: "0x3C"

  # WS2812 LED-Strip
  led_din_pin: "GPIO08"
  led_count: "10"

  # Zwei INMP441 als Stereo-Mikrofon
  mic_ws_pin:   "GPIO06"
  mic_sck_pin:  "GPIO05"
  mic_sd_pin:   "GPIO04"

  # Zwei MAX98357A als Stereo-Ausgang
  spk_lrc_pin:  "GPIO40"
  spk_bclk_pin: "GPIO39"
  spk_din_pin:  "GPIO38"

  # Vier TTP221-Tasten
  btn_1_pin: "GPIO11"
  btn_2_pin: "GPIO12"
  btn_3_pin: "GPIO13"
  btn_4_pin: "GPIO14"

packages:
  main: !include ../voice_satellite/main.yaml
  base: !include ../common/base-s3_devkitc_1.yaml
  hardware: !include ../voice_satellite/hardware.yaml
  ssd1306: !include ../common/SSD1306.yaml
  audio: !include ../voice_satellite/audio.yaml
  assistant: !include ../voice_satellite/assistant.yaml
  buttons: !include ../voice_satellite/buttons.yaml
  display: !include ../voice_satellite/display.yaml
  ledstrip: !include ../voice_satellite/ledstrip.yaml
  modes: !include ../voice_satellite/modes.yaml

  info_time: !include ../voice_satellite/info_time.yaml
  info_date: !include ../voice_satellite/info_date.yaml
  info_weekday: !include ../voice_satellite/info_weekday.yaml

  info_htu21: !include ../voice_satellite/info_htu21.yaml
  info_moonphase: !include ../voice_satellite/info_moonphase.yaml
  info_sun: !include ../voice_satellite/info_sun.yaml
  info_weather: !include ../voice_satellite/info_weather.yaml
  info_timer: !include ../voice_satellite/info_timer.yaml