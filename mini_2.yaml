substitutions:
  device_name: "esphome-web-0dc5df"
  friendly_name: "Mini 1"


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(tare_value) = id(hx711_raw_data).state;
          id(tare_value) = 256890;
          ESP_LOGI("custom", "Automatic tare on boot completed successfully.");

esp8266:
  board: nodemcuv2

api:
  id: api_id
  encryption:
    key: !secret api_encryption_key

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: 
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

logger:


globals:
  - id: tare_value
    type: float
    restore_value: no
    initial_value: '0.0'

sensor:
  - platform: hx711
    id: hx711_raw_data
    dout_pin: GPIO14
    clk_pin: GPIO12
    gain: 128
    update_interval: 1s  # Entlastet den Sensor
    internal: true
    filters:
      # 1. Deine lineare Kalibrierung zuerst
      - calibrate_linear:
          - 256890 -> 0.0
          - 282737 -> 64.0
      # 2. Aktive Glättung über Delta:
      # Ignoriert alle Änderungen, die kleiner als 0.4 Gramm sind (kein Eiern im Stillstand).
      # Sobald die Änderung größer als 0.4g ist (Gewicht aufgelegt), schlägt es sofort ohne Verzögerung an!
      - delta: 0.4

  - platform: template
    name: "Gewicht"
    id: weight_sensor
    unit_of_measurement: "g"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      return id(hx711_raw_data).state - id(tare_value);



button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart
    on_press:
      then:
        - safe_mode.mark_successful
  - platform: factory_reset
    name: "Factory Reset NVS"

  - platform: template
    name: "Waage Nullen (Tara)"
    icon: mdi:scale-balance
    on_press:
      then:
        - lambda: |-
            id(tare_value) = id(hx711_raw_data).state;