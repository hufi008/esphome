# musicbox/hardware.yaml

# -------------------------------------------------------------------
# Virtual
# -------------------------------------------------------------------

time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Berlin"

button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart
    on_press:
      then:
        - safe_mode.mark_successful

number:
  - platform: lvgl
    id: ha_volume_man
    name: "Lautstärke"
    widget: lvgl_slider_volume
    restore_value: true
  - platform: lvgl
    id: ha_backlight_man
    name: "Display Helligkeit"
    widget: lvgl_slider_backlight
    restore_value: true

switch:
  - platform: lvgl
    id: ha_switch_power
    name: "Eingeschaltet"
    icon: mdi:power
    widget: lvgl_button_power
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: lvgl
    id: ha_backlight_auto
    name: "Display Automatik"
    icon: mdi:brightness-auto    
    widget: lvgl_checkbox_backlight_auto
    restore_mode: RESTORE_DEFAULT_OFF

sun:
  latitude: !secret latitude
  longitude: !secret longitude

external_components:
  - source:
      type: local
      path: my_components
    components: 
      - my_moon
      - sendspin
      - color_sensor
      - visualizer

color_sensor:
- platform: sendspin
  id: sendspin_color_primary
  type: primary
- platform: sendspin
  id: sendspin_color_bg_dark
  type: background_dark
- platform: sendspin
  id: sendspin_color_on_dark
  type: on_dark

visualizer:
  - platform: sendspin
    id: test_visualizer
    type: spectrum
    rate_max: 20Hz
    n_disp_bins: 8
    scale: mel
    f_min: 40
    f_max: 16000


    on_spectrum:
      then:
        - lambda: |-
            auto *c = id(lvgl_spectrum_canvas);
            if (!c || x.empty())
              return;

            lv_canvas_fill_bg(c, lv_color_hex(0x000000), LV_OPA_COVER);

            lv_layer_t layer;
            lv_canvas_init_layer(c, &layer);

            lv_draw_rect_dsc_t d;
            lv_draw_rect_dsc_init(&d);
            d.bg_opa = LV_OPA_COVER;

            const int w = lv_obj_get_width(c);
            const int h = lv_obj_get_height(c);
            const int gap = 2;
            const int segments = 20;

            const int sw = (w - (x.size() - 1) * gap) / x.size();
            const int sh = (h - (segments - 1) * gap) / segments;

            for (int i = 0; i < x.size(); i++) {
              const int n = std::min(segments, x[i] * segments / 48000);

              for (int s = 0; s < n; s++) {
                d.bg_color = lv_color_hex(
                    s < 14 ? 0x00D000 :
                    s < 18 ? 0xFFD000 :
                            0xFF2020);

                lv_area_t a{
                  i * (sw + gap),
                  h - (s + 1) * (sh + gap),
                  i * (sw + gap) + sw - 1,
                  h - (s + 1) * (sh + gap) + sh - 1
                };

                lv_draw_rect(&layer, &d, &a);
              }
            }

            lv_canvas_finish_layer(c, &layer);
            lv_obj_invalidate(c);

# -------------------------------------------------------------------
# Sensoren
# -------------------------------------------------------------------
text_sensor:
  # 📡 Spiegelt die Wetter- und Umweltdaten aus deinem Home Assistant
  - platform: homeassistant
    id: ha_weather
    name: "WetterH"
    entity_id: weather.home
  - platform: sun
    id: my_sunrise
    name: "Aufgang"
    type: sunrise
    format: "%H:%M"
  - platform: sun
    id: my_sunset
    name: "Untergang"
    type: sunset
    format: "%H:%M"
  - platform: my_moon
    id: my_moonphase
    name: "MondphaseY"
    update_interval: 10min

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
    # scan_results:
    #   name: Latest Scan Results
    power_save_mode:
      name: Wifi Power Save Mode

sensor:
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_forecast_id}
    attribute: temperature
    unit_of_measurement: "°C"
  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_forecast_id}
    attribute: humidity
    unit_of_measurement: "%"
  - platform: homeassistant
    id: weather_pressure
    entity_id: ${weather_forecast_id}
    attribute: pressure
    unit_of_measurement: "hPa"
  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_speed
    unit_of_measurement: "km/h"
  - platform: homeassistant
    id: weather_wind_bearing
    entity_id: ${weather_forecast_id}
    attribute: wind_bearing
    unit_of_measurement: "°"
  - platform: homeassistant
    id: weather_wind_gust_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_gust_speed
  - platform: homeassistant
    id: weather_uv_index
    entity_id: ${weather_forecast_id}
    attribute: uv_index

  - platform: rotary_encoder
    id: my_encoder_pulse
    pin_a:
      number: ${pin_encoder_clk}
      mode: INPUT_PULLUP
    pin_b:
      number: ${pin_encoder_dt}
      mode: INPUT_PULLUP
    resolution: 1
    publish_initial_value: true
    filters:
      - debounce: 50ms
      - throttle: 50ms

binary_sensor:
  - platform: gpio
    id: my_encoder_button
    pin:
      number: ${pin_encoder_sw}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 20ms

output:
  - platform: ledc
    pin: ${pin_display_led}
    id: backlight_pwm
    min_power: 5%
    max_power: 95%
    frequency: 20000Hz # Angenehme Frequenz, um kein hörbares Spulenfiepen zu erzeugen



