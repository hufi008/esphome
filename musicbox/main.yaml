# musicbox/main.yaml

esphome:
  min_version: 2026.8.1
  project:
    name: "hufi.musicbox"
    version: 0.4.1
  on_boot:
    priority: -100
    then:
      - logger.log: "esphome: on_boot"
      - globals.set:
          id: is_blocked
          value: 'true'
      - lambda: 'ESP_LOGD(__FILE__, "lvgl: disable all indev");'
      - lambda: |-
          lv_indev_t *indev = nullptr;
          while ((indev = lv_indev_get_next(indev)) != nullptr) {
            lv_indev_enable(indev, false); 
          }          
      - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "BOOT");'
      - lvgl.page.show:
          id: lvgl_page_boot

globals:
  - id: is_blocked
    type: bool
    restore_value: no
    initial_value: 'true'

api:
  on_client_connected:
    then:
      - logger.log: "api: on_client_connected"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
      - lvgl.widget.show: lvgl_icon_api
  on_client_disconnected:
    then:
      - logger.log: "api: on_client_disconnected"
      - if:
          condition:
            lambda: 'return (0 == client_info.find("Home Assistant "));'
          then:
            - lvgl.widget.hide: lvgl_icon_api

time:
  - platform: homeassistant
    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "ha_time: on_time_sync");
          id(my_clock).update();
          id(my_date).update();
          id(my_sunrise).update();
          id(my_sunset).update();
      - if:
          condition:
            lambda: 'return id(is_blocked);'
          then:
            - sensor.rotary_encoder.set_value:
                id: my_encoder_pulse
                value: 0
            - globals.set:
                id: is_blocked
                value: 'false'
            - lambda: 'ESP_LOGD(__FILE__, "lvgl: enable all indev");'
            - lambda: |-
                lv_indev_t *indev = nullptr;
                while ((indev = lv_indev_get_next(indev)) != nullptr) {
                  lv_indev_enable(indev, true);
                }          

            - script.execute: update_states
            # - lvgl.widget.focus: lvgl_button_play_stop

  - id: !extend my_time
    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "my_time: on_time_sync");

    on_time:
      - seconds: /1
        then:
          - component.update: my_clock
      - hours: 0
        minutes: 0
        seconds: 1
        then:
          - component.update: my_date

switch:
  - id: !extend ha_switch_power
    
    on_turn_on:
      then:
        - logger.log: "HA: Power ON empfangen"
        - light.turn_on:
            id: onboard_led
            effect: "Rainbow"
        - lvgl.widget.disable: lvgl_button_power
        - lambda: |-
            float ha_brightness = id(display_backlight).remote_values.get_brightness();
            id(backlight_pwm).set_level(ha_brightness);
        - script.execute: update_states

    on_turn_off:
      then:
        - logger.log: "HA: Power OFF empfangen"
        - light.turn_off:
            id: onboard_led
        - lvgl.widget.enable: lvgl_button_power
        - lambda: 'id(backlight_pwm).set_level(0.15f);'
        - script.execute: update_states

light:
# Display Backlight (PWM)
  - id: !extend display_backlight

    on_state:
      then:
        - lvgl.slider.update:
            id: lvgl_slider_brightness
            value: !lambda |-
              // Holt den Helligkeits-Float über .remote_values und rechnet ihn auf die 20er-Skala um
              return (int)(id(display_backlight).remote_values.get_brightness() * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_brightness
            text: !lambda |-
              // Aktualisiert den Text direkt im 100%-Format
              return str_sprintf("Brightness: %0.0f %%", id(display_backlight).remote_values.get_brightness() * 100.0f);

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false
  on_color:
    then:
      - logger.log:
          format: "SendSpin Paletten-Wechsel  BG_Light: %s | On_Light: %s | BG_Dark: %s | On_Dark: %s | Primary: %s | Accent: %s"
          args:
            - x.get_background_light_hex().c_str()
            - x.get_on_light_hex().c_str()
            - x.get_background_dark_hex().c_str()
            - x.get_on_dark_hex().c_str()
            - x.get_primary_hex().c_str()
            - x.get_accent_hex().c_str()
      - light.turn_on:
          id: onboard_led
          effect: None 
          red: !lambda return x.get_primary().r / 255.0f;
          green: !lambda return x.get_primary().g / 255.0f;
          blue: !lambda return x.get_primary().b / 255.0f;
          brightness: 0.25
     
      # # 🔊 Externe Smart Speaker Status-LED in Home Assistant auf die ACCENT-Farbe setzen
      # - homeassistant.service:
      #     service: light.turn_on
      #     data:
      #       entity_id: light.smart_speaker_2_led_status
      #     # Der harte Fakt: Das Template MUSS einen formatierten String zurückgeben!
      #     data_template:
      #       brightness: "64"
      #       rgb_color: !lambda |-
      #         auto ac = x.get_accent();
      #         return esphome::str_snprintf("%d,%d,%d", 15, ac.r, ac.g, ac.b);
                            
      - lvgl.page.update:
          id: lvgl_page_media
          bg_color: !lambda |-
            auto c = x.get_background_dark();
            return lv_color_make(c.r, c.g, c.b);

      - lvgl.label.update:
          id: lvgl_label_media_title
          text_color: !lambda |-
            auto c = x.get_on_dark();
            return lv_color_make(c.r, c.g, c.b);

      - lvgl.label.update:
          id: lvgl_label_media_artist
          text_color: !lambda |-
            auto c = x.get_accent();
            return lv_color_make(c.r, c.g, c.b);

      - lvgl.label.update:
          id: lvgl_label_media_album
          text_color: !lambda |-
            auto c = x.get_accent();
            return lv_color_make(c.r, c.g, c.b);



media_player:
  - id: !extend sendspin_player

    on_state:
      then:
        - logger.log:
            format: "SendSpin Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(sendspin_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "SendSpin: on_play"
        - switch.turn_on: ha_switch_power
    on_pause:
      then:
        - logger.log: "SendSpin: on_pause"
    on_turn_on:
      then:
        - logger.log: "SendSpin: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "SendSpin: on_turn_off"
    on_idle:
      then:
        - logger.log: "SendSpin: on_idle"

  - id: !extend audio_player

    on_state:
      then:
        - logger.log:
            format: "Physischer Audio Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(audio_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "AudioPlayer: on_play"
    on_pause:
      then:
        - logger.log: "AudioPlayer: on_pause"
    on_idle:
      then:
        - logger.log: "AudioPlayer: on_idle"
    on_mute:
      then:
        - logger.log: "AudioPlayer: on_mute"
    on_unmute:
      then:
        - logger.log: "AudioPlayer: on_unmute"
    on_volume:
      then:
        - logger.log: "AudioPlayer: on_volume"
        - lvgl.slider.update:
            id: lvgl_slider_volume
            value: !lambda |-
              return (int)(id(audio_player).volume * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_volume
            text: !lambda |-
              return str_sprintf("Volume: %0.0f %%", id(audio_player).volume * 100.0f);
    on_turn_on:
      then:
        - logger.log: "AudioPlayer: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "AudioPlayer: on_turn_off"
      
# -------------------------------------------------------------------
# Text-Sensoren incl. Sendspin
# -------------------------------------------------------------------
text_sensor:
  - platform: template
    id: my_clock
    update_interval: never
    lambda: |-
      auto t = id(my_time).now();
      if (!t.is_valid()) {
        return std::string("--:--:--");
      }
       return str_sprintf("%02d:%02d:%02d", t.hour, t.minute, t.second);
    on_value:
      - lvgl.label.update:
          id: info_clock
          text: !lambda |-
            return x.c_str();     
  - platform: template
    id: my_date
    update_interval: never
    lambda: |-
      auto t = id(my_time).now();
      if (!t.is_valid()) {
        return std::string("--.--.----");
      }
      const char* weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
      return str_sprintf("%s, %02d.%02d.%04d", weekdays[t.day_of_week % 7], t.day_of_month, t.month, t.year);
    on_value:
      - lvgl.label.update:
          id: info_date
          text: !lambda |-
            return x.c_str();     

  - id: !extend ha_weather
    on_value:
        # WETTER-TEXT AKTUALISIEREN
        - lvgl.label.update:
            id: info_weather
            text: !lambda |-
              std::string w = x;
              if (w == "partlycloudy") return "Leicht bewölkt";
              if (w == "clear_night" || w == "sunny") return "Klar";
              if (w == "cloudy") return "Bewölkt";
              if (w == "rainy") return "Regen";
              if (w == "pouring") return "Starker Regen";
              if (w == "fog") return "Nebel";
              return w;

        # WETTER-ICON AKTUALISIEREN
        - lvgl.image.update:
            id: info_weather_icon
            src: !lambda |-
              static const std::map<std::string, const esphome::image::Image*> weather_icon_map = {
                {"sunny",           id(icon_weather_sunny)},
                {"clear-night",     id(icon_weather_clear_night)},
                {"partlycloudy",    id(icon_weather_partlycloudy)},
                {"cloudy",          id(icon_weather_cloudy)},
                {"fog",             id(icon_weather_fog)},
                {"pouring",         id(icon_weather_pouring)},
                {"rainy",           id(icon_weather_rainy)},
                {"hail",            id(icon_weather_hail)},
                {"snowy",           id(icon_weather_snowy)},
                {"snowy-rainy",     id(icon_weather_snowy_rainy)},
                {"lightning",       id(icon_weather_lightning)},
                {"lightning-rainy", id(icon_weather_lightning_rainy)},
                {"windy",           id(icon_weather_windy)},
                {"windy-variant",   id(icon_weather_windy)}
              };
              std::string current_weather = x;
              auto it = weather_icon_map.find(current_weather);
              if (it != weather_icon_map.end()) {
                  return const_cast<esphome::image::Image*>(it->second);
              }
              return id(icon_weather_exceptional);
  - id: !extend my_sunrise
    on_value:
      - lvgl.label.update:
          id: info_sun
          text: !lambda |-
            std::string sunrise = id(my_sunrise).state;
            std::string sunset = id(my_sunset).state;
            if (sunrise.empty() || sunset.empty()) return "Aufgang: --:--  •  Untergang: --:--";
            return str_sprintf("Sonne %s  •  %s", sunrise.c_str(), sunset.c_str());    
  # - id: !extend ha_sunset    # bereits hier drüber erledigt
  #   on_value:
  - id: !extend my_moonphase
    on_value:
      then:
        # MOND-TEXT AKTUALISIEREN 
        - lvgl.label.update:
            id: info_moon_text
            text: !lambda |-
              static const std::string moon_keys[] = {
                "unknown",
                "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
              };
              static const std::string moon_texts[] = {
                "Unbekannt",
                "Neumond", "1/4 Mond »", "Halbmond »", "3/4 Mond »", "Vollmond", "3/4 Mond «", "Halbmond «", "1/4 Mond «"
              };
              std::string phase = x; // 'x' enthält automatisch den aktuellen Zustand im on_value Trigger
              int index = 0;
              for (int i = 1; i < 9; i++) {
                  if (moon_keys[i] == phase) { index = i; break; }
              }
              return str_sprintf("Mond (%d/8): %s", index, moon_texts[index].c_str());

        # MOND-ICON AKTUALISIEREN
        - lvgl.image.update:
            id: info_moon_icon
            src: !lambda |-
              static const std::string moon_keys[] = {
                "unknown",
                "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
              };
              static const esphome::image::Image* moon_icons[] = {
                id(icon_moon_unknown),
                id(icon_moon_new_moon), id(icon_moon_waxing_crescent), id(icon_moon_first_quarter), id(icon_moon_waxing_gibbous),
                id(icon_moon_full_moon), id(icon_moon_waning_gibbous), id(icon_moon_last_quarter), id(icon_moon_waning_crescent)
              };
              std::string phase = x; // Auch hier nutzen wir direkt das übergebene 'x'
              int index = 0;
              for (int i = 1; i < 9; i++) {
                  if (moon_keys[i] == phase) { index = i; break; }
              }
              return const_cast<esphome::image::Image*>(moon_icons[index]);

  - platform: sendspin
    id: sendspin_title
    type: title
    name: Track Title
    on_value:
      then:
        - logger.log:
            format: "Track Title: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_title
            text: !lambda 'return x;'
  - platform: sendspin
    id: sendspin_artist
    type: artist
    name: Artist
    on_value:
      then:
        - logger.log:
            format: "Artist: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_artist
            text: !lambda 'return x;'
  - platform: sendspin
    id: sendspin_album
    type: album
    name: Album
    on_value:
      then:
        - logger.log:
            format: "Album: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_album
            text: !lambda 'return x;'

# -------------------------------------------------------------------
# Wifi und Sensoren
# -------------------------------------------------------------------
sensor:
  - id: !extend weather_temperature
    on_value:
      then:
        # TEMPERATUR AKTUALISIEREN
        - lvgl.label.update:
            id: info_temperature
            text: !lambda |-
              if (std::isnan(x)) return std::string("---");
              return str_sprintf("%.1f °C", x);
  - id: !extend weather_humidity
    on_value:
      then:
        # LUFTFEUCHTIGKEIT AKTUALISIEREN
        - lvgl.label.update:
            id: info_rain_prob
            text: !lambda |-
              if (std::isnan(x)) return std::string("---");
              return str_sprintf("%.0f%%", x);    
  - id: !extend weather_pressure
    on_value:
      then:
        # LUFTDRUCK AKTUALISIEREN
        - lvgl.label.update:
            id: info_barometer
            text: !lambda |-
              if (std::isnan(x)) return std::string("---");
              return str_sprintf("%.0f hPa", x);        
  - id: !extend weather_wind_speed
    on_value:
      then:
        # WINDGESCHWINDIGKEIT AKTUALISIEREN
        - lvgl.label.update:
            id: info_wind
            text: !lambda |-
              if (std::isnan(x)) return std::string("---");
              return str_sprintf("%.1f km/h", x);

  - id: !extend weather_wind_bearing
  - id: !extend weather_wind_gust_speed
  - id: !extend weather_uv_index

  - platform: sendspin
    type: track_progress
    name: "SendSpin Track Progress"
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGD(__FILE__, "SendSpin Progress: NAN");
              return;
            } 

            int progress = (int)(x / 1000.0f);

            int log_interval = (progress / 30) + 1;

            if (progress % log_interval == 0) {
              ESP_LOGD(__FILE__, "SendSpin Progress: %02d:%02d:%02d", progress / 3600, (progress % 3600) / 60, progress % 60);
            }

            // if (progress <= 1) {
            //   ESP_LOGD(__FILE__,"New Track %d", x);
            //   // Erzwingt das Leeren aller Text-Zustände im ESP32-Speicher
            //   id(sendspin_artist).publish_state("---");
            //   id(sendspin_album).publish_state("---");
            //   id(sendspin_title).publish_state("---");
            // }

        - lvgl.label.update:
            id: lvgl_label_progress
            text: !lambda |-
              if (std::isnan(x)) return "---:--:--";
              int progress = (int)(x / 1000.0f);
              return str_sprintf("%02d:%02d:%02d", progress / 3600, (progress % 3600) / 60, progress % 60);
        - lvgl.bar.update:
            id: track_progress_bar
            value: !lambda 'return x / 2000.0f;'                    
  - platform: sendspin
    type: track_duration
    name: "SendSpin Track Duration"
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGD(__FILE__, "SendSpin Duration: NAN");
              return;
            } 
            int progress = (int)(x / 1000.0f);
            ESP_LOGD(__FILE__, "SendSpin Duration: %02d:%02d:%02d", progress / 3600, (progress % 3600) / 60, progress % 60);
        - lvgl.label.update:
            id: lvgl_label_duration
            text: !lambda |-
              if (std::isnan(x)) return "---:--:--";
              if (x == 0) return "---:--:--";
              int duration = (int)(x / 1000.0f);
              return str_sprintf("%02d:%02d:%02d", duration / 3600, (duration % 3600) / 60, duration % 60);
        - lvgl.bar.update:
            id: track_progress_bar
            min_value: 0
            max_value: !lambda 'return x / 2000.0f;'
  - platform: sendspin
    type: year
    name: "SendSpin Year"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Year: %.0f"
            args: [ 'x' ]
        # - lvgl.label.update:
        #     id: lvgl_label_year
        #     text: !lambda |-
        #       return str_sprintf("%4.0f", x);
  - platform: sendspin
    type: track
    name: "SendSpin Track"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Track: %.0f"
            args: [ 'x' ]
        # - lvgl.label.update:
        #     id: lvgl_label_track
        #     text: !lambda |-
        #       return str_sprintf("Track: %2.0f", x);

  - platform: wifi_signal
    id: wifi_rssi
    name: "Signalstärke"
    update_interval: 15s
    on_value:
      then:
        # Ausgezeichnetes Signal
        - if:
            condition:
              lambda: 'return x >= -50.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_4
                  
        # Gutes Signal
        - if:
            condition:
              lambda: 'return x < -50.0f && x >= -65.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_3

        # Normales Signal
        - if:
            condition:
              lambda: 'return x < -65.0f && x >= -75.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_2

        # Schlechtes Signal
        - if:
            condition:
              lambda: 'return x < -75.0f && x >= -85.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_1

        # Kein/Sehr schlechtes Signal (oder Offline)
        - if:
            condition:
              lambda: 'return x < -85.0f || isnan(x);'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_0
        # Access Point active
        - if:
            condition:
              lambda: 'return id(wifi_id).is_ap_active();'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_ap

  - id: !extend my_encoder_pulse
    on_value:
      - logger.log:
          format: "on_rotary_encoder_pulse %.0f"
          args: [ 'x' ]
    on_clockwise:
      - logger.log: "Turned Clockwise"
      - switch.turn_on: ha_switch_power
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"        
      - switch.turn_on: ha_switch_power


binary_sensor:
  - id: !extend my_encoder_button
    on_press:
      then:
        - logger.log: "on_rotary_encoder_press"
    on_release:
      then:
        - logger.log: "on_rotary_encoder_release"
    on_click:
      then:
        - logger.log: "on_rotary_encoder_click"
        # - switch.turn_on: ha_switch_power
    on_multi_click:
      - timing:    
          - ON for at least 2s
        then:
          - logger.log: "on_rotary_encoder_long_click"
          # - switch.toggle: ha_switch_power
          - lvgl.widget.enable: lvgl_button_power              
          - lvgl.widget.focus: lvgl_button_power
          



