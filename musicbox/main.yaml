      widgets:
        # 🕒 GROSSE DIGITALUHR (Zentriert im oberen Drittel)
        - label:
            id: info_clock
            x: 0
            y: 40
            text: "00:00:00"
            text_font: roboto_32
            text_color: 0x00D2FF
            align: TOP_MID

        # 📅 DATUM & WOCHENTAG
        - label:
            id: info_date
            x: 0
            y: 80
            text: "---"
