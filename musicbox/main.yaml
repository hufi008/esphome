# -------------------------------------------------------------------
# GUI
# -------------------------------------------------------------------
lvgl:
  id: my_lvgl
  displays:
    - my_display
  touchscreens:
    - my_touch


  encoders:
    - sensor: my_encoder_pulse
      enter_button: my_encoder_button
      initial_focus: lvgl_button_play_stop 
      long_press_time: 500ms
      group: encoder_group
  rotary_sensitivity: 128

  on_boot:
    then:
      - logger.log: "lvgl: on_boot"
      - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "BOOT");'
      - lvgl.widget.focus: lvgl_button_play_stop
      # - lvgl.page.show: lvgl_page_boot
      # - lvgl.widget.redraw:
      # - lvgl.pause:
      # - script.execute: update_states

  on_idle:
    timeout: 60s
    then:
      logger.log: "lvgl: on_idle"
      # switch.turn_off: ha_switch_power

  on_pause:
    then:
      logger.log: "lvgl: on_pause"

  on_resume:
    then:
      logger.log: "lvgl: on_resume"


  theme:
    dark_mode: true  

    # 🎛️ Globale Stile für Basis-Container (obj)
    obj:
      main:
        bg_color: 0x141414
        bg_opa: COVER
        border_width: 0
        radius: 8

    label:
      main:
        text_color: 0xFFFFFF
        text_font: roboto_20    # Globaler Standard für Text-Widgets!

    # 🔘 Globale Button-Stile (Gilt für ALLE Buttons)
    button:
      main:
        bg_color: 0x1E1E1E
        bg_opa: COVER
        radius: 6
        border_width: 0
        text_color: 0xFFFFFF
        text_font: roboto_20    # Globaler Standard für die Buttonbeschriftung!

      pressed:
        bg_color: 0x2C3E50  
        bg_opa: COVER
        text_color: 0x3498DB 

      focused:
        border_color: 0xD35400 
        border_opa: COVER   
        text_color: 0x14487B
        border_width: 3     

  # Statusbar
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 100%
          height: 30
          bg_color: 0x222222
          border_width: 0
          text_color: 0xFFFF00
          text_font: roboto_20
          
          # Die eigentlichen Elemente werden JETZT als Kinder in den Balken gelegt:
          widgets:
            - label:
                id: lvgl_label_status_title
                text: "TITLE"
                text_color: 0xFFFF00
                align: LEFT_MID
                x: 10
                y: 0 

            - image:
                id: lvgl_icon_wifi
                src: img_wifi_0
                align: RIGHT_MID
                x: -10
                y: 0 
                recolor: "0xFFFFFF"
                recolor_opa: 100% 

  # Die GUI-Elemente
  pages:
    - id: lvgl_page_boot
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "BOOTING..."

      widgets:
