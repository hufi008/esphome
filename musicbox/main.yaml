# -------------------------------------------------------------------
# GUI
# -------------------------------------------------------------------
lvgl:
  id: my_lvgl
  buffer_size: 100%
  displays:
    - my_display
  # touchscreens:
  #   - my_touch


  encoders:
    - sensor: my_encoder_pulse
      enter_button: my_encoder_button
      # initial_focus: lvgl_button_play_stop
      group: encoder_group
  rotary_sensitivity: 128

  on_boot:
    then:
      - logger.log: "lvgl: on_boot"
      # - lvgl.widget.focus: lvgl_button_play_stop

  on_idle:
    timeout: 60s
    then:
      logger.log: "lvgl: on_idle"
      # switch.turn_off: ha_switch_power

  on_pause:
    then:
      logger.log: "lvgl: on_pause"

  on_resume:
    then:
      logger.log: "lvgl: on_resume"

  theme:
    dark_mode: true  

    # 🎛️ Globale Stile für Basis-Container (obj)
    obj:
      bg_color: 0x303000
      bg_opa: COVER
      border_width: 0
      radius: 8
      scrollable: false        

    label:
      text_color: 0xFFFFFF
      text_font: roboto_20    # Globaler Standard für Text-Widgets!

    # 🔘 Globale Button-Stile (Gilt für ALLE Buttons)
    button:
      bg_color: 0x1E1E1E
      bg_opa: COVER
      radius: 6
      border_width: 0
      text_color: 0xFFFFFF
      text_font: roboto_20    # Globaler Standard für die Buttonbeschriftung!

      pressed:
        bg_color: 0x2C3E50  
        bg_opa: COVER
        text_color: 0x3498DB 

      focused:
        border_color: 0xFFFF00
        border_opa: COVER   
        text_color: 0x0000FF
        border_width: 2
    slider:
      pressed:
        border_color: 0xCCCC00
        border_opa: COVER
        border_width: 2

      focused:
        border_color: 0xFFFF00
        border_opa: COVER   
        border_width: 2

  # Statusbar
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 100%
          height: 30
          bg_color: 0x606060
          border_width: 0
          text_color: 0xFFFF00
          text_font: roboto_20
          scrollable: false        
          
          # Die eigentlichen Elemente werden JETZT als Kinder in den Balken gelegt:
          widgets:
            - label:
                id: lvgl_label_status_title
                text: "TITLE"
                text_color: 0xFFFF00
                align: LEFT_MID
                x: 10
                y: 0 

            - image:
                id: lvgl_icon_api
                src: img_api
                align: RIGHT_MID
                x: -45
                y: 0 
                recolor: "0xFFFF00"
                recolor_opa: 100%
                hidden: true

            - image:
                id: lvgl_icon_wifi
                src: img_wifi_0
                align: RIGHT_MID
                x: -10
                y: 0 
                recolor: "0xFFFF00"
                recolor_opa: 100% 

  # Die GUI-Elemente
  pages:
    - id: lvgl_page_boot
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "BOOTING..."

      widgets:
        - label:
            x: 0
            y: 40
            text: "Musicbox"
            text_font: roboto_24
            text_color: 0x00D2FF
            align: TOP_MID

        - spinner:
            x: 0
            y: 0
            width: 120
            height: 120
            arc_length: 60deg
            arc_width: 4
            indicator:
              arc_color: 0x0000ff
              arc_width: 4
            align: CENTER

        - image:
            x: 0
            y: 0
            width: 64
            height: 64
            src: img_boot_logo
            align: CENTER
            recolor: 0x0000FF
            recolor_opa: 100% 

        - label:          
            x: 0
            y: -20
            text_font: roboto_12
            text_color: 0x00D2FF
            align: BOTTOM_MID
            text: !lambda |-
              return str_sprintf("PROJ %s | IDF: %s | ESP: %s", 
                ESPHOME_PROJECT_VERSION, 
                esp_get_idf_version(),                //IDF_VER
                ESPHOME_VERSION
              );

    - id: lvgl_page_info
      on_press:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "lvgl_page_info: on_press"
        - lvgl.page.show:
            id: lvgl_page_media
            animation: move_top
            time: 300ms
        - switch.turn_on: ha_switch_power
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "INFO"

      widgets:
        - button:
            id: lvgl_button_power
            align: TOP_LEFT
            x: 2%
            y: 15%
            width: 40
            height: 40
            widgets:
              - image:
                  src: img_power
                  recolor: "0xFFFF00"
                  recolor_opa: 100%
                  align: CENTER              
            group: encoder_group                  
            on_focus:
              then:
                - lambda: 'ESP_LOGD(__FILE__, "POWER: on_focus");'
                - script.execute:
                    id: show_page
                    page: lvgl_page_info
            on_click:
              then:
                - logger.log: "power via GUI"
                - switch.toggle: ha_switch_power

        # 🕒 GROSSE DIGITALUHR (Zentriert im oberen Drittel)
        - label:
            id: info_clock
            x: 0
            y: 40
            text: "00:00:00"
            text_font: roboto_32
            text_color: 0x00D2FF
            align: TOP_MID

        # 📅 DATUM & WOCHENTAG
        - label:
            id: info_date
            x: 0
            y: 80
            text: "---"
            text_font: roboto_16
            text_color: 0xAAAAAA
            align: TOP_MID

        # 🌤️ WETTER COMPONENTEN (Icon links, Text daneben)
        - image:
            id: info_weather_icon
            x: 5%
            y: 44%
            src: icon_weather_exceptional
            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        - label:
            id: info_weather
            x: 14%
            y: 45%
            text: "Wetter: Lade..."
            text_font: roboto_16

        - label:
            id: info_temperature
            x: 55%
            y: 45%
            text: "--.- °C"
            text_font: roboto_16
            text_color: 0xFF9800 

        # 🧪 Luftdruck 
        - label:
            id: info_barometer
            x: 5%
            y: 58%
            text: "Luft: ---- hPa"
            text_font: roboto_16    # Kleinere Schriftart für die Statusleiste
            text_color: 0xc0c0c0

        # 💧 Regenwahrscheinlichkeit
        - label:
            id: info_rain_prob
            x: 38%
            y: 58%
            text: "Regen: --%"
            text_font: roboto_16
            text_color: 0x3498DB   # Dezentes Blau für Regen

        # 💨 Windgeschwindigkeit 
        - label:
            id: info_wind
            x: 68%
            y: 58%
            text: "Wind: -- km/h"
            text_font: roboto_16
            text_color: 0x2ECC71   # Dezentes Grün für Wind

        # ☀️ SONNENZEITEN (Unter dem Wetter)
        - image:
            id: info_sun_icon
            x: 5%
            y: 72%
            src: icon_sun
            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        - label:
            id: info_sun
            x: 14%
            y: 73%
            text: "Auf: --:--  •  Unter: --:--"
            text_font: roboto_16
            text_color: 0xa0a0a0

        # 🌙 MONDPHASEN KOMPONENTEN
        - image:
            id: info_moon_icon
            x: 5%
            y: 85%
            src: icon_moon_unknown
            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        - label:
            id: info_moon_text
            x: 14%
            y: 86%
            text: "Mond: ---"
            text_font: roboto_16
            text_color: 0xa0a0a0

    - id: lvgl_page_media
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach links gewischt von lvgl_page_media!"
        - lvgl.page.show:
            id: lvgl_page_settings
            animation: move_left
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach rechts gewischt von lvgl_page_media!"
        - lvgl.page.show:
            id: lvgl_page_backlight
            animation: move_right
            time: 300ms
      on_swipe_bottom:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach rechts gewischt von lvgl_page_media!" # Logger-Text beibehalten
        - lvgl.page.show:
            id: lvgl_page_info
            animation: move_bottom
            time: 300ms
        - switch.turn_off: ha_switch_power
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "MEDIA"

      widgets:
        # 🖼️ ALBUM COVER MIT RAHMEN
        - obj:
            align: TOP_LEFT
            x: "0%"
            y: "32%"
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 2
            border_color: 0xD4AF37
            pad_all: 0
            scrollable: false
            widgets:
              - image:
                  id: lvgl_img_album_art
                  src: img_art_clear
                  align: CENTER

        # 🎵 TRACK INFOS (Nutzen jetzt die volle Breite oberhalb des Covers)
        - label:
            id: lvgl_label_media_title
            align: TOP_LEFT
            x: "4%"
            y: "12%"
            width: "92%" 
            text: "Keine Wiedergabe"
            text_font: roboto_32
            text_align: LEFT
            long_mode: SCROLL

        - label:
            id: lvgl_label_media_artist
            align: TOP_LEFT
            x: "4%"
            y: "22%"
            width: "92%"
            text: "---"
            text_font: roboto_20
            text_color: 0xBBBBBB
            text_align: LEFT
            long_mode: SCROLL_CIRCULAR

        # Albumname (Rechts neben dem vergrößerten Cover platziert)
        - label:
            id: lvgl_label_media_album
            align: TOP_LEFT
            x: "44%"
            y: "34%"
            width: "56%"
            text: "---"
            text_font: roboto_20
            text_color: 0xBB4477
            text_align: LEFT
            long_mode: SCROLL_CIRCULAR

        # ⏳ COMBINIERTE ZEITLEISTE (Dauer & Fortschritt links/rechts)
        - obj:
            align: TOP_LEFT
            x: "44%"
            y: "50%"
            width: "52%"
            height: 45        
            bg_opa: TRANSP
            border_width: 2
            border_color: 0xff007f
            pad_all: 4        
            layout:
              type: FLEX
              flex_flow: COLUMN              # Elemente untereinander
              flex_align_main: SPACE_BETWEEN # Zeitleiste oben, Balken unten
              flex_align_cross: CENTER       # Korrigierter Fallback für die Kreuzachse
            widgets:
            
              # ⏱️ Obere Zeile für die Zeitangaben
              - obj:
                  width: 100%                # Explizit auf volle Breite der Hauptbox gezwungen
                  height: 20
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: FLEX
                    flex_flow: ROW           
                    flex_align_main: SPACE_BETWEEN 
                    flex_align_cross: CENTER
                  widgets:
                    # Aktueller Fortschritt (Links)
                    - label:
                        id: lvgl_label_progress
                        text: ""
                        text_color: 0x00FFD2

                    # Gesamtlänge (Rechts)
                    - label:
                        id: lvgl_label_duration
                        text: ""
                        text_color: 0xaaaaaa

              # 📊 Integrierte FORTSCHRITTSLEISTE
              - bar:
                  id: track_progress_bar
                  width: 100%                # Verhindert das Schrumpfen, füllt die Box voll aus
                  height: 4
                  bg_color: 0x804020


        # 🎛️ BUTTONBAR UNTEN (Dank Flexbox extrem dankbar beim Skalieren!)
        - obj:
            align: BOTTOM_MID
            x: 0
            y: 0
            width: "100%"
            height: 40
            bg_color: 0x606060
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: ROW             
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER   
            widgets:
              # 📌 BUTTON: PREVIOUS
              - button:
                  id: lvgl_button_prev
                  width: "24%"
                  height: 32
                  widgets:
                    - label:
                        text: "<<"
                        align: CENTER
                  group: encoder_group                  
                  on_focus:
                    then:
                      - lambda: 'ESP_LOGD(__FILE__, "PREV: on_focus");'
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                  on_click:
                    then:
                      - logger.log: "prev via GUI"
                      - media_player.previous: sendspin_player
                      
              # 📌 BUTTON: PLAY
              - button:
                  id: lvgl_button_play_stop
                  width: "34%"
                  height: 32
                  widgets:
                    - label:
                        id: lvgl_button_play_stop_label
                        text: "Wait..."
                        align: CENTER
                  group: encoder_group                  
                  on_focus:
                    then:
                      - lambda: 'ESP_LOGD(__FILE__, "PLAY: on_focus");'
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                  on_click:
                    then:
                      - logger.log: "play via GUI"
                      - media_player.toggle: sendspin_player

              # 📌 BUTTON: NEXT
              - button:
                  id: lvgl_button_next
                  width: "24%"
                  height: 32
                  widgets:
                    - label:
                        text: ">>"
                        align: CENTER
                  group: encoder_group                  
                  on_focus:
                    then:
                      - lambda: 'ESP_LOGD(__FILE__, "NEXT: on_focus");'
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                  on_click:
                    then:
                      - logger.log: "next via GUI"
                      - media_player.next: sendspin_player

    - id: lvgl_page_settings
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach links gewischt von lvgl_page_settings!"
        - lvgl.page.show:
            id: lvgl_page_backlight
            animation: move_left
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach rechts gewischt von lvgl_page_settings!"
        - lvgl.page.show:
            id: lvgl_page_media
            animation: move_right
            time: 300ms
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "SETTINGS"

      widgets:
        # 🔊 DIGITALE LAUTSTÄRKEANZEIGE
        - label:
            id: lvgl_label_volume
            align: TOP_MID
            x: 0
            y: 15%
            text: "50 %"
            text_font: roboto_24
            text_color: 0x00FFD2
            text_align: CENTER
        # 🎚️ VOLUME-SLIDER
        - slider:
            id: lvgl_slider_volume
            align: TOP_MID
            x: 0
            y: 25%
            height: 20
            width: 85%
            min_value: 0
            max_value: 20
            value: 8
            group: encoder_group                  
            on_focus:
              then:
                - lambda: 'ESP_LOGD(__FILE__, "VOL: on_focus");'
                - script.execute:
                    id: show_page
                    page: lvgl_page_settings
            on_change:
              then:
                - media_player.volume_set:
                    id: audio_player
                    volume: !lambda 'return x / 20.0f;'

        # ☀️ DIGITALE HELLIGKEITSANZEIGE (Groß und zentriert)
        - label:
            id: lvgl_label_brightness
            align: TOP_MID
            x: 0
            y: 50%
            text: "50 %"
            text_font: roboto_24 
            text_color: 0x00FFD2
            text_align: CENTER
        # 🎚️ HELLIGKEITS-SLIDER 
        - slider:
            id: lvgl_slider_brightness
            align: TOP_MID
            x: 0
            y: 60%
            width: 85%
            height: 20
            min_value: 5
            max_value: 20           # 20 Einzelschritte (5% pro Raste)
            value: 15               # Startwert 75%
            group: encoder_group                  
            on_focus:
              then:
                - lambda: 'ESP_LOGD(__FILE__, "BRIGHT: on_focus");'
                - script.execute:
                    id: show_page
                    page: lvgl_page_settings
            on_change:
              then:
                - light.turn_on:
                    id: display_backlight
                    # x (0-20) geteilt durch 20.0f ergibt den benötigten Float-Bereich (0.0 bis 1.0)
                    brightness: !lambda |-
                      return x / 20.0f;

    - id: lvgl_page_backlight
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach links gewischt von lvgl_page_backlight!"
        - lvgl.page.show:
            id: lvgl_page_media
            animation: move_left
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Nach rechts gewischt von lvgl_page_backlight!"
        - lvgl.page.show:
            id: lvgl_page_settings
            animation: move_right
            time: 300ms
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "BRIGHTNESS"

                    
script:
  - id: update_states
    mode: single
    then: 
      - logger.log: "script: update_states"
      - logger.log:
          format: "Blocked: %s | Power: %s | Player-Status: %s"
          args:
            - 'id(is_blocked) ? "Yes" : "No"'
            - 'id(ha_switch_power).state ? "On" : "Off"'
            - 'media_player::media_player_state_to_string(id(sendspin_player).state)' 

      - if:
          condition:
            lambda: 'return !id(is_blocked);'
          then:
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_boot
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "BOOT");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_info
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "INFO");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_media
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "MEDIA");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_settings
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "VOLUME");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_backlight
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "BACKLIGHT");'



            # SCHRITT 0: Wenn power off -> INFO; sonmst MEDIA
            - if: 
                condition: 
                  lambda: "return !id(ha_switch_power).state;"
                then: 
                  - lambda: 'ESP_LOGD(__FILE__, "update states: power off");'
                  - media_player.stop: sendspin_player
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "INFO");'
                  - lvgl.page.show: lvgl_page_info
                  # - lambda: 'id(backlight_pwm).set_level(0.15f);'

                else: 
                  - lambda: 'ESP_LOGD(__FILE__, "update states: power on");'
                  - if:
                      condition:
                        or:
                          - lvgl.page.is_showing: lvgl_page_boot
                          - lvgl.page.is_showing: lvgl_page_info
                      then:
                        - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "MEDIA");'
                        - lvgl.page.show: lvgl_page_media
                        - lvgl.widget.focus: lvgl_button_play_stop
                  # - lambda: |-
                  #     float ha_brightness = id(display_backlight).remote_values.get_brightness();
                  #     id(backlight_pwm).set_level(ha_brightness);

                  # SCHRITT 1: Wenn offline (NONE) -> Beide Buttons sperren (Disabled)
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_NONE;"
                      then: 
                        - lvgl.widget.disable: lvgl_button_play_stop

                  # SCHRITT 2: Wenn online -> Beide Buttons freigeben (Enabled)
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state != media_player::MEDIA_PLAYER_STATE_NONE;"
                      then: 
                        - lvgl.widget.enable: lvgl_button_play_stop

                  # SCHRITT 3: Wenn Musik läuft (PLAYING) -> Play verstecken, Stop anzeigen
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;"
                      then: 
                        - lvgl.label.update:
                            id: lvgl_button_play_stop_label
                            text: "Pause"

                  # SCHRITT 4: Wenn Musik pausiert/leerläuft (IDLE/PAUSED) -> Play anzeigen, Stop verstecken
                  - if: 
                      condition: 
                        lambda: |-
                          return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_IDLE || 
                                id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
                      then: 
                        - lvgl.label.update:
                            id: lvgl_button_play_stop_label
                            text: "Play"
      - logger.log: "LVGL Display-Updates beendet."

  - id: show_page
    parameters: 
      page: lvgl::LvPageType*
    mode: single
    then: 
      - lambda: |-
          ESP_LOGD(__FILE__, "script: show_page");
          if (page != nullptr) {
            if (id(is_blocked)) {
              ESP_LOGE(__FILE__, "show_page blocked! pageidx: %d", page->index);
              return;
            }  
            ESP_LOGD(__FILE__, "show_page pageidx: %d", page->index);
            page->get_parent()->show_page(page->index, LV_SCREEN_LOAD_ANIM_FADE_ON, 300);
          } else {
              ESP_LOGE(__FILE__, "show_page aufgerufen, aber page ist ein nullptr!");
          }
