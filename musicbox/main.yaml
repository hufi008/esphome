# musicbox/main.yaml

esphome:
  project:
    name: "hufi.musicbox"
    version: "0.0.3"
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(is_blocked) = true;
        - lvgl.page.show:
            id: lvgl_page_idle
            animation: FADE_IN
            time: 500ms

esp32:
  framework:
    # Das begrenzt den RAM-Verbrauch des WLAN-Stacks auf dem alten ESP32 massiv
    sdkconfig_options:
      CONFIG_LWIP_MAX_ACTIVE_TCP_CONNECTIONS: "5"
      CONFIG_LWIP_MAX_SOCKETS: "7"

logger:
  level: DEBUG


### Bedienung ###
# Pages: Konstanten als Substitution, niemals die int verwenden
# PAGE_BOOT:      0
# PAGE_IDLE:      1
# PAGE_MEDIA:     2
# PAGE_VOLUME:    3
# PAGE_LIGHT:     4
# PAGE_SETTINGS:  5
# PAGE_SHUTDOWN:  99
#
# Rotary:
# Wheel: Wechsel zwischen den Pages 1..5
# Click: Page aktivieren
# nach 15 sec Inaktivität wird die Seite PAGE_IDLE/PAGE_MEDIA aktiviert, je nachdem ob der media_player läuft
# 
# Page aktiviert:
# PAGE_BOOT: geht nicht, verschwindet, wenn time_sync erreicht
# PAGE_IDLE: Wechsel der Subpages "Time,Date,Weekday", "Weather forecast", "Sunrise/set", "Moonphase"
# Page_MEDIA: Play/Pause, Stop, FR/FF, Next/Previous Track
# Page_VOLUME: Volume up/down, Mute
# Page_LIGHT: Auswahl des Light effects
# Page_SETTINGS: Auswahl der Subpages "Light brightness" "Backlight brightness"






binary_sensor:
  - platform: gpio
    pin:
      number: ${rotary_btn_pin}
      mode: INPUT
      inverted: true
    id: rotary_button
    on_press:
      then:
        - logger.log: "Rotary Press"
    on_click:
      min_length: 2s
      max_length: 5s
      then:
        - logger.log: "Rotary long Click"

sensor:
  - platform: rotary_encoder
    id: rotary_pulses
    pin_a: ${rotary_a_pin}
    pin_b: ${rotary_b_pin}
    publish_initial_value: true
    on_clockwise:
      then:
        - logger.log: "Rotary Clockwise"
    on_anticlockwise:
      then: 
        - logger.log: "Rotary Anticlockwise"




  # Wifi Signalstärke
  - platform: wifi_signal
    id: wifi_rssi
    name: "Signalstärke"
    update_interval: 15s
    on_value:
      then:
        # Ausgezeichnetes Signal
        - if:
            condition:
              lambda: 'return x >= -50.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi # <-- Hier angepasst
                  src: img_wifi_4
                  
        # Gutes Signal
        - if:
            condition:
              lambda: 'return x < -50.0f && x >= -65.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_3

        # Normales Signal
        - if:
            condition:
              lambda: 'return x < -65.0f && x >= -75.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_2

        # Schlechtes Signal
        - if:
            condition:
              lambda: 'return x < -75.0f && x >= -85.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_1

        # Kein/Sehr schlechtes Signal (oder Offline)
        - if:
            condition:
              lambda: 'return x < -85.0f || isnan(x);'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_0

  - platform: homeassistant
    id: media_player_volume
    entity_id: media_player.smart_speaker_2_audio_player_2
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: lvgl_slider_volume
          value: !lambda return (x * 20);
      - lvgl.label.update:
          id: lvgl_label_volume_pct
          text: !lambda |-
            // {:.0f} formatiert den float-Wert x als Ganzzahl ohne Nachkommastellen
            return esphome::str_sprintf("%.0f %%", x * 100.0f);

time:
  - platform: homeassistant
    id: esptime
    on_time_sync:
      - lambda: |-
          ESP_LOGI("time", "on_time_time_sync");

          if (id(is_blocked)) {
            ESP_LOGI("time", "Systemstart abgeschlossen");
            id(is_blocked) = false;
          }
      - lvgl.page.show:
          id: lvgl_page_volume # <-- Hier ebenfalls korrigiert
          animation: FADE_OUT
          time: 500ms

    # Aktualisiert die Anzeige jede Sekunde
    on_time:
      - seconds: /1
        then:
          - lambda: |-
              // ESP_LOGI("time", "on_time_time");
          - lvgl.label.update:
              id: lvgl_label_time
              text: !lambda |-
                return id(esptime).now().strftime("%H:%M:%S");
          - lvgl.label.update:
              id: lvgl_label_date
              text: !lambda |-
                return id(esptime).now().strftime("%d.%m.%Y");
          - lvgl.label.update:
              id: lvgl_label_weekday
              text: !lambda |-
                const char* days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
                return days[id(esptime).now().day_of_week - 1];

text_sensor:
  - platform: homeassistant
    id: player_title
    entity_id: media_player.smart_speaker_2_audio_player_2
    attribute: media_title
    on_value:
      then:
        - logger.log:
            format: "title %s"
            args: 'x.c_str()'
        - lvgl.label.update:
            id: lvgl_label_title
            text: !lambda |-
              return x.c_str();

  - platform: homeassistant
    id: player_artist
    entity_id: media_player.smart_speaker_2_audio_player_2
    attribute: media_artist
    on_value:
      then:
        - logger.log:
            format: "artist %s"
            args: 'x.c_str()'
        - lvgl.label.update:
            id: lvgl_label_artist
            text: !lambda |-
              return x.c_str();

  - platform: homeassistant
    id: player_album_name
    entity_id: media_player.smart_speaker_2_audio_player_2
    attribute: media_album_name
    on_value:
      then:
        - logger.log:
            format: "album_name %s"
            args: 'x.c_str()'
        - lvgl.label.update:
            id: lvgl_label_album
            text: !lambda |-
              return x.c_str();

  - platform: homeassistant
    id: player_album_art
    entity_id: media_player.smart_speaker_2_audio_player_2
    attribute: entity_picture
    on_value:
      then:
        - logger.log:
            format: "album_art %s"
            args: 'x.c_str()'
        # Wir nutzen ein allgemeines Lambda statt der fertigen 'set_url'-Aktion
        - lambda: |-
            // 1. Wenn die URL leer ist, brechen wir das Lambda sofort ab.
            // Es wird KEIN Download-Befehl an die Komponente gesendet!
            if (x.empty() || x == "null") {
              ESP_LOGD("custom", "URL ist leer. Überspringe HTTP-Client-Initialisierung.");
              return;
            }

            // 2. Pfade prüfen
            bool is_local_ip = (x.rfind("http://192.168.", 0) == 0);
            bool is_local_path = (x.rfind("/api/", 0) == 0);

            std::string final_url;
            if (is_local_ip || is_local_path) {
              ESP_LOGD("custom", "Lokales Bild erkannt. Lade direkt.");
              final_url = x;
            } else {
              ESP_LOGD("custom", "Externes Bild erkannt. Nutze wsrv.nl Proxy.");
              final_url = "https://wsrv.nl?url=" + x + "&w=100&h=100&fit=cover&output=jpg";
            }

            // 3. Hier steuern wir das Online-Image direkt über seine C++ Instanz an.
            // Das entspricht exakt der YAML-Aktion, aber absolut sicher gekapselt.
            id(cover_image).set_url(final_url);
            id(cover_image).update();

http_request:
  timeout: 10s
  useragent: esphome/musicbox
  # Korrekte ESPHome-Variablen zur RAM-Begrenzung:
  buffer_size_rx: 512
  buffer_size_tx: 256

image:
  - platform: online_image
    url: "https://wsrv.nl"
    id: cover_image
    format: JPG
    type: RGB565
    on_download_finished:
        - lvgl.image.update:
            id: widget_cover_image
            src: cover_image
        - lambda: |-
            if (cached) {
              ESP_LOGD("online_image", "Cache hit: using cached image");
            } else {
              ESP_LOGD("online_image", "Cache miss: fresh download");
            }
    on_error:
        - lambda: |-
            ESP_LOGE("cover", "Download error");

    resize: 100x100
  - platform: file
    file: "mdi:music-box-outline"
    id: img_boot_logo
    type: BINARY
    resize: 64x64
  - platform: file
    file: "mdi:wifi-strength-outline"
    id: img_wifi_0
    type: BINARY
    resize: 32x32
  - platform: file
    file: "mdi:wifi-strength-1"
    id: img_wifi_1
    type: BINARY
    resize: 32x32
  - platform: file
    file: "mdi:wifi-strength-2"
    id: img_wifi_2
    type: BINARY
    resize: 32x32
  - platform: file
    file: "mdi:wifi-strength-3"
    id: img_wifi_3
    type: BINARY
    resize: 32x32
  - platform: file
    file: "mdi:wifi-strength-4"
    id: img_wifi_4
    type: BINARY
    resize: 32x32


# Backlight (PWM)
output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz # Angenehme Frequenz, um kein hörbares Spulenfiepen zu erzeugen
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lvgl.slider.update:
          id: lvgl_slider_backlight
          value: !lambda 'return (id(display_backlight).remote_values.get_brightness() * 20);'
      - lvgl.label.update:
          id: lvgl_label_backlight_pct
          text: !lambda |-
            // {:.0f} formatiert den float-Wert x als Ganzzahl ohne Nachkommastellen
            return esphome::str_sprintf("%.0f %%", id(display_backlight).remote_values.get_brightness() * 100.0f);



# Gemeinsamer SPI-Bus für Display & Touch
spi:
  id: bus_spi
  clk_pin: ${display_sck_pin}
  mosi_pin: ${display_mosi_pin}
  miso_pin: ${display_miso_pin}

# TFT Display
font:
  - file: "gfonts://Roboto"
    id: roboto_font_small
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_font
    size: 30
  - file: "gfonts://Roboto"
    id: roboto_font_large
    size: 40
  - file: "gfonts://Roboto"
    id: roboto_font_huge
    size: 50

display:
  - platform: ili9xxx
    model: ILI9341
    id: tft_display
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_rst_pin}
    invert_colors: false
    auto_clear_enabled: false
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    dimensions:
      height: 240
      width: 320

lvgl:
  id: my_lvgl
  displays:
    - tft_display
  buffer_size: 10% 

  theme:
    dark_mode: true

  style_definitions:
    # Sil für normalen Modus
    - id: lvgl_styledef_normal
      bg_color: 0x000000
      bg_opa: COVER
    
    # Stil für aktiven Modus
    - id: lvgl_styledef_active
      bg_color: 0x001f3f
      bg_opa: COVER

  encoders:
    - id: lvgl_encoder_device
      sensor: rotary_pulses
      enter_button: rotary_button
      group: main_group
      

  # Der Top Layer ist auf allen Pages sichtbar
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 100%
          height: 40
          bg_color: 0x222222
          text_color: "0xFFFF00"
          text_font: roboto_font_small
          widgets:
            - label:
                id: lvgl_lvgl_label_title
                align: LEFT_MID
                x: 0
                width: 200
                text: "TIILE"
            - image:
                id: lvgl_icon_wifi
                src: img_wifi_0
                align: RIGHT_MID
                x: -10
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                recolor: 0xFFFFFF
                recolor_opa: 100%
  pages:
    - id: lvgl_page_boot
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "BOOT"
      widgets:
        # 1. Das zentrale Musik-Logo
        - image:
            id: boot_logo
            src: img_boot_logo
            align: CENTER
            y: -20 # Leicht nach oben versetzt
            recolor: 0xFFFFFF # Weiß einfärben
            recolor_opa: 100%

        # 2. Ein animierter Ladekreis (Spinner) um das Logo herum
        - spinner:
            id: lvgl_spinner_boot
            align: CENTER
            y: -20
            width: 110
            height: 110
            spin_time: 1000ms
            arc_length: 60
            
        # 3. Der Statustext darunter
        - label:
            id: lvgl_label_boot_status
            align: CENTER
            y: 70
            text_color: "0xFFFFFF"
            text_font: montserrat_12
            text_align: CENTER
            text: "System startet..."

        # 4. Systeminfos ganz unten (nebeneinander oder untereinander)
        - label:
            id: lvgl_label_version_proj
            align: CENTER
            y: 90
            text_color: "0x7f7fFF"
            text_font: montserrat_12
            text_align: CENTER
            text: !lambda |-
              return "App: " + std::string(ESPHOME_PROJECT_NAME) + " v" + std::string(ESPHOME_PROJECT_VERSION);

        - label:
            id: lvgl_label_version_sys
            align: CENTER
            y: 110
            text_color: "0x7f7fFF"
            text_font: montserrat_12
            text_align: CENTER
            text: !lambda |-
              return "ESPHome: " + std::string(ESPHOME_VERSION);


    - id: lvgl_page_idle
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "IDLE"
      widgets:
        # Große Uhrzeit in der Mitte
        - label:
            id: lvgl_label_time
            text: "--:--:--"
            x: 10
            y: 60
            width: 300
            text_color: "0xFFFFFF"
            text_font: montserrat_48
            text_align: CENTER
            group: main_group
            on_focus:
              - lvgl.page.show:
                  id: lvgl_page_idle
                  animation: FADE_IN
                  time: 300ms
        # Datum unter der Uhrzeit
        - label:
            id: lvgl_label_date
            text: "--.--.----"
            x: 10
            y: 150
            width: 300
            text_color: "0xAAAAAA" # Graue Schrift
            text_font: montserrat_30
            text_align: CENTER  

        # Wochentag unter dem Datum
        - label:
            id: lvgl_label_weekday
            text: "Wochentag"
            x: 10
            y: 180          # Platziert unter dem Datum
            width: 300
            text_color: "0xAAAAAA" # Graue Schrift
            text_font: montserrat_30
            text_align: CENTER            


    - id: lvgl_page_media
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "MEDIA"
      widgets:
        # Text-Label für den Album/Station (Über dem Songtitel)
        - label:
            id: lvgl_label_album
            text: "-"
            x: 10
            y: 40
            width: 300
            long_mode: SCROLL
            text_color: "0xFFFF00" # Gelbe Schrift
            text_font: montserrat_18
            text_align: CENTER

        # Text-Label für den Songtitel (Rechts neben dem Bild)
        - label:
            id: lvgl_label_title
            text: "Keine Wiedergabe"
            x: 10
            y: 60
            width: 300
            long_mode: SCROLL
            text_color: "0xFFFFFF" # Weiße Schrift
            text_font: montserrat_32
            text_align: CENTER
            group: main_group
            on_focus:
              - lvgl.page.show:
                  id: lvgl_page_media
                  animation: FADE_IN
                  time: 300ms                  
        # Text-Label für den Interpreten (Unter dem Songtitel)
        - label:
            id: lvgl_label_artist
            text: "-"
            x: 10
            y: 90
            width: 300
            long_mode: SCROLL
            text_color: "0xAAAAAA" # Graue Schrift für besseren Kontrast
            text_font: montserrat_28
            text_align: CENTER
        - image:
            id: widget_cover_image
            src: cover_image
            x: 100
            y: 140
            width: 100
            height: 100

    - id: lvgl_page_volume
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "VOLUME"
      widgets:

        # Große Prozentanzeige in der Mitte
        - label:
            id: lvgl_label_volume_pct
            text: "0 %"
            x: 10
            y: 120
            width: 300
            text_color: "0x0000FF" # Gelb
            text_font: montserrat_30
            text_align: CENTER

        # Visueller Slider / Fortschrittsbalken
        - slider:
            id: lvgl_slider_volume
            x: 35
            y: 180
            width: 250
            height: 20
            min_value: 0
            max_value: 20
            value: 42
            group: main_group
            on_focus:
              - lvgl.page.show:
                  id: lvgl_page_volume
                  animation: FADE_IN
                  time: 300ms
            on_value:
              then:
                - logger.log:
                    format: "set Volume %.0f %%"
                    args: [ 'x * 5.0f' ]
                - homeassistant.service:
                    action: media_player.volume_set
                    data:
                      entity_id: media_player.smart_speaker_2_audio_player_2
                      volume_level: !lambda 'return (x / 20.0f);'
                    on_success:
                      - logger.log: "OK"
                    on_error:
                      - logger.log: "Error"


    - id: lvgl_page_backlight
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "BACKLIGHT"
      widgets:

        # Große Prozentanzeige in der Mitte
        - label:
            id: lvgl_label_backlight_pct
            text: "0 %"
            x: 10
            y: 120
            width: 300
            text_color: "0xFF0000"
            text_font: montserrat_30
            text_align: CENTER

        # Visueller Slider / Fortschrittsbalken
        - slider:
            id: lvgl_slider_backlight
            x: 35
            y: 180
            width: 250
            height: 20
            min_value: 5
            max_value: 20
            value: 42
            group: main_group
            on_focus:
              - lvgl.page.show:
                  id: lvgl_page_backlight
                  animation: FADE_IN
                  time: 300ms
            on_value:
              then:
                - logger.log:
                    format: "set Backlight %.0f %%"
                    args: [ 'x * 5.0f' ]
                - lambda: |-
                    // 1. Berechne den Ziel-Helligkeitswert (0.0 bis 1.0) aus dem Slider (0 bis 20)
                    float target_brightness = x / 20.0f;
                    
                    // 2. Hole den aktuellen Ist-Wert des Lichts ab
                    float current_brightness = id(display_backlight).remote_values.get_brightness();
                    
                    // 3. Prüfe mathematisch (mit minimaler Toleranz für Rundungsfehler), ob sich der Wert REAL geändert hat
                    if (std::abs(target_brightness - current_brightness) > 0.02f) {
                      
                      // Nur wenn sich der Wert geändert hat, loggen wir und aktualisieren das Licht
                      ESP_LOGD("main", "set Backlight %.0f %%", x * 5.0f);
                      
                      auto call = id(display_backlight).make_call();
                      call.set_brightness(target_brightness);
                      call.perform();
                    }

    - id: lvgl_page_settings
      on_load:
        - lvgl.label.update:
            id: lvgl_lvgl_label_title
            text: "SETTINGS"
      widgets:
        - obj:
            id: lvgl_list_settings
            x: 5
            y: 45
            width: 310
            height: 190
            layout: VERTICAL
            scrollbar_mode: AUTO
            widgets:
              - button:
                  id: lvgl_button_settings_backlight
                  text: "Helligkeit Display"
                  group: main_group
                  on_focus:
                    - lvgl.page.show:
                        id: lvgl_page_settings
                        animation: FADE_IN
                        time: 300ms
              - button:
                  id: lvgl_button_settings_ledstrip
                  text: "Helligkeit LED"
                  group: main_group
                  on_focus:
                    - lvgl.page.show:
                        id: lvgl_page_settings
                        animation: FADE_IN
                        time: 300ms
              - button:
                  id: lvgl_button_settings_restart
                  text: "Neustart"
                  group: main_group
                  on_focus:
                    - lvgl.page.show:
                        id: lvgl_page_settings
                        animation: FADE_IN
                        time: 300ms
              - button:
                  id: lvgl_button_settings_power
                  text: "Zurück"
                  group: main_group
                  on_focus:
                    - lvgl.page.show:
                        id: lvgl_page_settings
                        animation: FADE_IN
                        time: 300ms

    - id: lvgl_page_shutdown






substitutions:
  PAGE_BOOT:      0
  PAGE_IDLE:      1
  PAGE_MEDIA:     2
  PAGE_VOLUME:    3
  PAGE_LIGHT:     4
  PAGE_SETTINGS:  5
  PAGE_SHUTDOWN:  6



globals:
  # im Boot/Shutdownvorgang true
  - id: is_blocked
    type: bool
    restore_value: no
    initial_value: 'false' 
