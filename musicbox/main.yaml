# musicbox/main.yaml

esphome:
  min_version: 2026.7.3
  project:
    name: "hufi.musicbox"
    version: 0.2.0
  on_boot:
    priority: -100
    then:
      - logger.log: "esphome: on_boot"
      - globals.set:
          id: is_blocked
          value: 'true'
      - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "BOOT");'
      - lvgl.page.show:
          id: lvgl_page_boot


substitutions:

globals:
  - id: is_blocked
    type: bool
    restore_value: no
    initial_value: 'true'


time:
  - id: !extend ha_time
    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "on_time_time_sync");
      - if:
          condition:
            lambda: 'return id(is_blocked);'
          then:
            - globals.set:
                id: is_blocked
                value: 'false'
            - script.execute: update_states

    on_time:
      - seconds: /30
        then:
          # # - logger.log: "[Interval] 30s-Takt:"
          - if:
              condition:
                lambda: 'return !id(my_lvgl).is_ready();'
              then:
                # - logger.log: "LVGL noch nicht bereit – Update übersprungen!"
              else:
                # - logger.log: "LVGL ist bereit, führe Display-Updates aus."

                - lambda: |-
                    ESP_LOGI("time_trigger", "Läuft alle 30 Sekunden!");

                # 1. UHRZEIT AKTUALISIEREN (Ohne Sekunden)
                - lvgl.label.update:
                    id: info_clock
                    text: !lambda |-
                      auto t = id(ha_time).now();
                      return str_sprintf("%02d:%02d", t.hour, t.minute);

                # 2. DATUM & WOCHENTAG AKTUALISIEREN
                - lvgl.label.update:
                    id: info_date
                    text: !lambda |-
                      auto t = id(ha_time).now();
                      const char* weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
                      return str_sprintf("%s, %02d.%02d.%04d", weekdays[t.day_of_week % 7], t.day_of_month, t.month, t.year);

                # 3. WETTER-TEXT AKTUALISIEREN
                - lvgl.label.update:
                    id: info_weather
                    text: !lambda |-
                      std::string w = id(ha_weather).state;
                      if (w == "partlycloudy") return "Leicht bewölkt";
                      if (w == "clear_night" || w == "sunny") return "Klar";
                      if (w == "cloudy") return "Bewölkt";
                      if (w == "rainy") return "Regen";
                      if (w == "pouring") return "Starker Regen";
                      if (w == "fog") return "Nebel";
                      return w;

                # 4. WETTER-ICON AKTUALISIEREN
                - lvgl.image.update:
                    id: info_weather_icon
                    src: !lambda |-
                      static const std::map<std::string, const esphome::image::Image*> weather_icon_map = {
                        {"sunny",           id(icon_weather_sunny)},
                        {"clear-night",     id(icon_weather_clear_night)},
                        {"partlycloudy",    id(icon_weather_partlycloudy)},
                        {"cloudy",          id(icon_weather_cloudy)},
                        {"fog",             id(icon_weather_fog)},
                        {"pouring",         id(icon_weather_pouring)},
                        {"rainy",           id(icon_weather_rainy)},
                        {"hail",            id(icon_weather_hail)},
                        {"snowy",           id(icon_weather_snowy)},
                        {"snowy-rainy",     id(icon_weather_snowy_rainy)},
                        {"lightning",       id(icon_weather_lightning)},
                        {"lightning-rainy", id(icon_weather_lightning_rainy)},
                        {"windy",           id(icon_weather_windy)},
                        {"windy-variant",   id(icon_weather_windy)}
                      };
                      std::string current_weather = id(ha_weather).state;
                      auto it = weather_icon_map.find(current_weather);
                      if (it != weather_icon_map.end()) {
                          return const_cast<esphome::image::Image*>(it->second);
                      }
                      return id(icon_weather_exceptional);

                # 5. LOKALE SONNENZEITEN AKTUALISIEREN
                - lvgl.label.update:
                    id: info_sun
                    text: !lambda |-
                      std::string sunrise = id(ha_sunrise).state;
                      std::string sunset = id(ha_sunset).state;
                      if (sunrise.empty() || sunset.empty()) return "Aufgang: --:--  •  Untergang: --:--";
                      return str_sprintf("Sonne %s  •  %s", sunrise.c_str(), sunset.c_str());

                # 6. MOND-TEXT AKTUALISIEREN (Korrektur: [] und = hinzugefügt)
                - lvgl.label.update:
                    id: info_moon_text
                    text: !lambda |-
                      static const std::string moon_keys[] = {
                        "unknown",
                        "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                        "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
                      };
                      static const std::string moon_texts[] = {
                        "Unbekannt",
                        "Neumond", "1/4 Mond »", "Halbmond »", "3/4 Mond »", "Vollmond", "3/4 Mond «", "Halbmond «", "1/4 Mond «"
                      };
                      std::string phase = id(ha_moonphase).state;
                      int index = 0;
                      for (int i = 1; i < 9; i++) {
                          if (moon_keys[i] == phase) { index = i; break; }
                      }
                      return str_sprintf("Mond (%d/8): %s", index, moon_texts[index].c_str());

                # 7. MOND-ICON AKTUALISIEREN (Korrektur: [] und = hinzugefügt)
                - lvgl.image.update:
                    id: info_moon_icon
                    src: !lambda |-
                      static const std::string moon_keys[] = {
                        "unknown",
                        "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                        "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
                      };
                      static const esphome::image::Image* moon_icons[] = {
                        id(icon_moon_unknown),
                        id(icon_moon_new_moon), id(icon_moon_waxing_crescent), id(icon_moon_first_quarter), id(icon_moon_waxing_gibbous),
                        id(icon_moon_full_moon), id(icon_moon_waning_gibbous), id(icon_moon_last_quarter), id(icon_moon_waning_crescent)
                      };
                      std::string phase = id(ha_moonphase).state;
                      int index = 0;
                      for (int i = 1; i < 9; i++) {
                          if (moon_keys[i] == phase) { index = i; break; }
                      }
                      return const_cast<esphome::image::Image*>(moon_icons[index]);
                # 8. LUFTDRUCK AKTUALISIEREN
                - lvgl.label.update:
                    id: info_barometer
                    text: !lambda |-
                      if (std::isnan(id(weather_pressure).state)) return std::string("---");
                      return str_sprintf("%.0f hPa", id(weather_pressure).state);

                # 9. LUFTFEUCHTIGKEIT AKTUALISIEREN (Nutzt deine ID 'info_rain_prob')
                - lvgl.label.update:
                    id: info_rain_prob
                    text: !lambda |-
                      if (std::isnan(id(weather_humidity).state)) return std::string("---");
                      return str_sprintf("%.0f%%", id(weather_humidity).state);

                # 10. WINDGESCHWINDIGKEIT AKTUALISIEREN
                - lvgl.label.update:
                    id: info_wind
                    text: !lambda |-
                      if (std::isnan(id(weather_wind_speed).state)) return std::string("---");
                      return str_sprintf("%.1f km/h", id(weather_wind_speed).state);

                # - logger.log: "[Interval] 30s-Takt: ...beendet"


switch:
  - id: !extend ha_switch_power
    
    on_turn_on:
      then:
        - logger.log: "HA: Power ON empfangen"
        - light.turn_on:
            id: onboard_led
            effect: "Rainbow"
        - script.execute: update_states

    on_turn_off:
      then:
        - logger.log: "HA: Power OFF empfangen"
        - light.turn_off:
            id: onboard_led
        - script.execute: update_states


light:
# Display Backlight (PWM)
  - id: !extend display_backlight

    on_state:
      then:
        - lvgl.slider.update:
            id: lvgl_slider_brightness
            value: !lambda |-
              // Holt den Helligkeits-Float über .remote_values und rechnet ihn auf die 20er-Skala um
              return (int)(id(display_backlight).remote_values.get_brightness() * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_brightness
            text: !lambda |-
              // Aktualisiert den Text direkt im 100%-Format
              return str_sprintf("%0.0f %%", id(display_backlight).remote_values.get_brightness() * 100.0f);



# 5. Der finale Mediaplayer, der den Netzwerkstream an den Speaker schickt
media_player:
  - id: !extend sendspin_player

    on_state:
      then:
        - logger.log:
            format: "SendSpin Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(sendspin_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "SendSpin: on_play"
        - switch.turn_on: ha_switch_power
    on_pause:
      then:
        - logger.log: "SendSpin: on_pause"
    on_turn_on:
      then:
        - logger.log: "SendSpin: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "SendSpin: on_turn_off"
    on_idle:
      then:
        - logger.log: "SendSpin: on_idle"

  - id: !extend audio_player

    on_state:
      then:
        - logger.log:
            format: "Physischer Audio Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(audio_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "AudioPlayer: on_play"
    on_pause:
      then:
        - logger.log: "AudioPlayer: on_pause"
    on_idle:
      then:
        - logger.log: "AudioPlayer: on_idle"
    on_mute:
      then:
        - logger.log: "AudioPlayer: on_mute"
    on_unmute:
      then:
        - logger.log: "AudioPlayer: on_unmute"
    on_volume:
      then:
        - logger.log: "AudioPlayer: on_volume"
        - lvgl.slider.update:
            id: lvgl_slider_volume
            value: !lambda |-
              return (int)(id(audio_player).volume * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_volume
            text: !lambda |-
              return str_sprintf("%0.0f %%", id(audio_player).volume * 100.0f);        
    on_turn_on:
      then:
        - logger.log: "AudioPlayer: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "AudioPlayer: on_turn_off"

# -------------------------------------------------------------------
# Sendspin Text-Sensoren
# -------------------------------------------------------------------
text_sensor:
  - platform: sendspin
    type: title
    name: Track Title
    on_value:
      then:
        - logger.log:
            format: "Track Title: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_title
            text: !lambda 'return x;'
  - platform: sendspin
    type: artist
    name: Artist
    on_value:
      then:
        - logger.log:
            format: "Artist: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_artist
            text: !lambda 'return x;'
  - platform: sendspin
    type: album
    name: Album
    on_value:
      then:
        - logger.log:
            format: "Album: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_album
            text: !lambda 'return x;'
  

# -------------------------------------------------------------------
# Wifi und Sensoren
# -------------------------------------------------------------------
sensor:
  - platform: sendspin
    type: track_progress
    name: "SendSpin Track Progress"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              # - logger.log:
              #     format: "SendSpin Fortschritt: %02d:%02d:%02d"
              #     args:
              #       - '(int)(x / 1000) / 3600'
              #       - '((int)(x / 1000) % 3600) / 60'
              #       - '(int)(x / 1000) % 60'
              - lambda: |-
                  static unsigned long last_log_time = 0;
                  unsigned long now = millis();

                  // Trigger every 30 real-time seconds (30,000 milliseconds)
                  if (now - last_log_time >= 30000) {
                    last_log_time = now;

                    int total_seconds = x / 1000;
                    ESP_LOGD("custom", "SendSpin Fortschritt: %02d:%02d:%02d", 
                            total_seconds / 3600, 
                            (total_seconds % 3600) / 60, 
                            total_seconds % 60);
                  }

              - lvgl.label.update:
                  id: lvgl_label_progress
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: track_duration
    name: "SendSpin Track Duration"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              - logger.log:
                  format: "SendSpin Gesamtlänge: %02d:%02d:%02d"
                  args:
                    - '(int)(x / 1000) / 3600'
                    - '((int)(x / 1000) % 3600) / 60'
                    - '(int)(x / 1000) % 60'
              - lvgl.label.update:
                  id: lvgl_label_duration
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  min_value: 0
                  max_value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: year
    name: "SendSpin Year"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Year: %.0f"
            args: [ 'x' ]
  - platform: sendspin
    type: track
    name: "SendSpin Track"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Track: %.0f"
            args: [ 'x' ]
  - platform: wifi_signal
    id: wifi_rssi
    name: "Signalstärke"
    update_interval: 15s
    on_value:
      then:
        # Ausgezeichnetes Signal
        - if:
            condition:
              lambda: 'return x >= -50.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_4
                  
        # Gutes Signal
        - if:
            condition:
              lambda: 'return x < -50.0f && x >= -65.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_3

        # Normales Signal
        - if:
            condition:
              lambda: 'return x < -65.0f && x >= -75.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_2

        # Schlechtes Signal
        - if:
            condition:
              lambda: 'return x < -75.0f && x >= -85.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_1

        # Kein/Sehr schlechtes Signal (oder Offline)
        - if:
            condition:
              lambda: 'return x < -85.0f || isnan(x);'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_0
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_forecast_id}
    attribute: temperature
    unit_of_measurement: "°C"
  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_forecast_id}
    attribute: humidity
    unit_of_measurement: "%"
  - platform: homeassistant
    id: weather_pressure
    entity_id: ${weather_forecast_id}
    attribute: pressure
    unit_of_measurement: "hPa"
  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_speed
    unit_of_measurement: "km/h"
  - platform: homeassistant
    id: weather_wind_bearing
    entity_id: ${weather_forecast_id}
    attribute: wind_bearing
    unit_of_measurement: "°"
  - platform: homeassistant
    id: weather_wind_gust_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_gust_speed
  - platform: homeassistant
    id: weather_uv_index
    entity_id: ${weather_forecast_id}
    attribute: uv_index

  - id: !extend my_encoder_pulse
    on_value:
      - logger.log:
          format: "on_rotary_encoder_pulse %.0f"
          args: [ 'x' ]
    on_clockwise:
      - logger.log: "Turned Clockwise"
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"        


binary_sensor:
  - id: !extend my_encoder_button
    on_press:
      then:
        - logger.log: "on_rotary_encoder_press"
    on_release:
      then:
        - logger.log: "on_rotary_encoder_release"
    on_click:
      then:
        - logger.log: "on_rotary_encoder_click"
    on_multi_click:
      - timing:    
          - ON for at most 2s
        then:
          - logger.log: "on_rotary_encoder_long_click"
          # - switch.toggle: ha_switch_power










