            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        - label:
            id: info_weather
            x: 50                   
            y: 115
            text: "Wetter: Lade..."
            text_font: roboto_16

        # 📊 NEUE EXTRA-INFO LEISTE (Kompakt im unteren Bereich platziert)
        # 🧪 Luftdruck (Ganz links)
        - label:
            id: info_barometer
            x: 10
            y: 140
            text: "Luft: ---- hPa"
            text_font: roboto_16    # Kleinere Schriftart für die Statusleiste
            text_color: 0x888888

        # 💧 Regenwahrscheinlichkeit (Mittig versetzt)
        - label:
            id: info_rain_prob
            x: 110
            y: 140
            text: "Regen: --%"
            text_font: roboto_16
            text_color: 0x3498DB   # Dezentes Blau für Regen

        # 💨 Windgeschwindigkeit (Ganz rechts versetzt)
        - label:
            id: info_wind
            x: 210
            y: 140
            text: "Wind: -- km/h"
            text_font: roboto_16
            text_color: 0x2ECC71   # Dezentes Grün für Wind

        - image:
            id: info_sun_icon
            x: 10
            y: 170
            src: icon_sun
            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        # ☀️ SONNENZEITEN (Unter dem Wetter)
        - label:
            id: info_sun
            x: 50
            y: 175
            text: "Auf: --:--  •  Unter: --:--"
            text_font: roboto_16
            text_color: 0x888888

        # 🌙 MONDPHASEN KOMPONENTEN
        - image:
            id: info_moon_icon
            x: 10
            y: 205
            src: icon_moon_unknown
            recolor: "0xFFFFFF"
            recolor_opa: 100% 

        - label:
            id: info_moon_text
            x: 50                   
            y: 210
            text: "Mond: ---"
            text_font: roboto_16
            text_color: 0x666666






    - id: lvgl_page_media
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "MEDIA"

      widgets:
        # 🎵 TRACK INFOS (Aus dem vorherigen Schritt)
        - label:
            id: lvgl_label_media_title
            x: 10
            y: 35
            width: 90%
            text: "Keine Wiedergabe"
            text_font: roboto_24
            align: TOP_MID
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR

        - label:
            id: lvgl_label_media_artist
            x: 10
            y: 65
            width: 90%
            text: "---  •  ---"
            text_font: roboto_16
            text_color: 0xAAAAAA
            align: TOP_MID
            text_align: CENTER
            long_mode: DOT

        - label:
            id: lvgl_label_media_album
            x: 10
            y: 85
            width: 90%
            text: "---"
            text_font: roboto_16
            text_color: 0x777777   # Etwas dunkleres Grau für die Album-Information
            align: TOP_MID
            text_align: CENTER
            long_mode: DOT

        # ⏳ NEU: KOMBINIERTE ZEITLEISTE (Dauer & Fortschritt links/rechts)
        - obj:
            x: 0
            y: 110
            width: 90%
            height: 25
            align: TOP_MID
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN # Drückt Progress nach links und Length nach rechts
              flex_align_cross: CENTER
            widgets:
              # Aktueller Fortschritt (Links)
              - label:
                  id: lvgl_label_progress
                  text: "00:00:00"
                  text_color: 0x00FFD2

              # Gesamtlänge (Rechts - füttert deinen track_duration Sensor!)
              - label:
                  id: lvgl_label_duration
                  text: "00:00:00"
                  text_color: 0x888888 # Dezent gedimmtes Grau für die Gesamtlänge

        # 📊 FORTSCHRITTSLEISTE (Direkt darunter bei y: 125)
        - bar:
            id: track_progress_bar
            x: 0
            y: 135
            width: 90%
            height: 5
            align: TOP_MID
            bg_color: 0x222222

        # 🎛️ BUTTONBAR UNTEN (Der bündige Container am unteren Rand)
        - obj:
            align: BOTTOM_MID
            x: 0
            y: -5
            width: 95%
            height: 44
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: ROW             
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER   
            widgets:
              # 📌 BUTTON: PREVIOUS
              - button:
                  id: lvgl_button_prev
                  width: 22%
                  height: 34
                  text: "<<"
                  group: encoder_group                  
                  on_focus:
                    then:
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                      # - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "MEDIA");'
                      # - lvgl.page.show:
                      #     id: lvgl_page_media
                      #     animation: OVER_BOTTOM
                      #     time: 300ms
                  on_click:
                    then:
                      - logger.log: "prev via GUI"
                      - media_player.previous: sendspin_player
              # 📌 BUTTON: PLAY
              - button:
                  id: lvgl_button_play_stop
                  width: 32%
                  height: 34
                  widgets:
                    - label:
                        id: lvgl_button_play_stop_label
                        text: "Wait..."
                        align: CENTER
                  group: encoder_group                  
                  on_focus:
                    then:
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                      # - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "MEDIA");'
                      # - lvgl.page.show:
                      #     id: lvgl_page_media
                      #     animation: FADE_IN
                      #     time: 300ms
                  on_click:
                    then:
                      - logger.log: "play via GUI"
                      - media_player.toggle: sendspin_player

              # 📌 BUTTON: NEXT
              - button:
                  id: lvgl_button_next
                  width: 22%
                  height: 34
                  text: ">>"
                  group: encoder_group                  
                  on_focus:
                    then:
                      - script.execute:
                          id: show_page
                          page: lvgl_page_media
                      # - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "MEDIA");'
                      # - lvgl.page.show:
                      #     id: lvgl_page_media
                      #     animation: FADE_IN
                      #     time: 300ms
                  on_click:
                    then:
                      - logger.log: "next via GUI"
                      - media_player.next: sendspin_player


    - id: lvgl_page_volume
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "VOLUME"

      widgets:
        # 🔊 DIGITALE LAUTSTÄRKEANZEIGE (Groß und zentriert im oberen Drittel)
        - label:
            id: lvgl_label_volume
            x: 0
            y: 50
            text: "50 %"
            text_font: roboto_24    # Ausnahme: Große Schrift für den Wert
            text_color: 0x00FFD2   # Aqua-Akzentfarbe passend zur Timeline
            align: TOP_MID
            text_align: CENTER

        # 🎚️ INTEGRATIVER VOLUME-SLIDER (Elegant zentriert im unteren Drittel)
        - slider:
            id: lvgl_slider_volume
            x: 0
            y: 110
            width: 85%
            height: 16
            align: TOP_MID
            min_value: 0
            max_value: 20
            value: 8
            group: encoder_group                  
            on_focus:
              then:
                - script.execute:
                    id: show_page
                    page: lvgl_page_volume
                # - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "VOLUME");'
                # - lvgl.page.show:
                #     id: lvgl_page_volume
                #     animation: FADE_IN
                #     time: 300ms

            on_change:
              then:
                - lvgl.label.update:
                    id: lvgl_label_volume
                    text: !lambda 'return str_sprintf("%0.0f %%", x * 5.0f);'
                - media_player.volume_set:
                    id: audio_player
                    volume: !lambda 'return x / 20.0f;'

    - id: lvgl_page_backlight
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "BRIGHTNESS"

      widgets:
        # ☀️ DIGITALE HELLIGKEITSANZEIGE (Groß und zentriert)
        - label:
            id: lvgl_label_brightness
            x: 0
            y: 50
            text: "50 %"
            text_font: roboto_24    # Ausnahme: Große Schrift für den Wert
            text_color: 0x00FFD2   # Aqua-Akzentfarbe passend zur Timeline
            align: TOP_MID
            text_align: CENTER

        # 🎚️ HELLIGKEITS-SLIDER (20 Rasten für flottes Drehen)
        - slider:
            id: lvgl_slider_brightness
            x: 0
            y: 110
            width: 85%
            height: 16
            align: TOP_MID
            min_value: 5
            max_value: 20           # 20 Einzelschritte (5% pro Raste)
            value: 15               # Startwert 75%
            group: encoder_group                  
            on_focus:
              then:
                - script.execute:
                    id: show_page
                    page: lvgl_page_backlight
                # - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "BACKLIGHT");'
                # - lvgl.page.show:
                #     id: lvgl_page_backlight
                #     animation: FADE_IN
                #     time: 300ms

            # Event beim manuellen Drehen am KY-040
            on_change:
              then:
                # 1. Prozentanzeige aktualisieren (x * 5)
                - lvgl.label.update:
                    id: lvgl_label_brightness
                    text: !lambda |-
                      return str_sprintf("%0.0f %%", x * 5.0f);
                
                # 2. Helligkeit an die monochromatic Light-Komponente übergeben
                - light.turn_on:
                    id: display_backlight
                    # x (0-20) geteilt durch 20.0f ergibt den benötigten Float-Bereich (0.0 bis 1.0)
                    brightness: !lambda |-
                      return x / 20.0f;



                    
script:
  - id: update_states
    mode: single
    then: 
      - logger.log: "script: update_states"
      - logger.log:
          format: "Blocked: %s | Power: %s | Player-Status: %s"
          args:
            - 'id(is_blocked) ? "Yes" : "No"'
            - 'id(ha_switch_power) ? "On" : "Off"'
            - 'media_player::media_player_state_to_string(id(sendspin_player).state)' 

      - if:
          condition:
            lambda: 'return !id(is_blocked);'
          then:
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_boot
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "BOOT");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_info
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "INFO");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_media
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "MEDIA");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_volume
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "VOLUME");'
            - if:
                condition:
                  - lvgl.page.is_showing: lvgl_page_backlight
                then:
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_is_showing %s", "BACKLIGHT");'



            # SCHRITT 0: Wenn power off -> INFO; sonmst MEDIA
            - if: 
                condition: 
                  lambda: "return !id(ha_switch_power).state;"
                then: 
                  - media_player.stop: sendspin_player
                  - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "INFO");'
                  - lvgl.page.show: lvgl_page_info
                  # - lambda: 'id(backlight_pwm).set_level(0.15f);'

                else: 
                  - if:
                      condition:
                        or:
                          - lvgl.page.is_showing: lvgl_page_boot
                          - lvgl.page.is_showing: lvgl_page_info
                      then:
                        - lambda: 'ESP_LOGD(__FILE__, "lvgl: page_show %s", "MEDIA");'
                        - lvgl.page.show: lvgl_page_media
                        - lvgl.widget.focus: lvgl_button_play_stop
                  # - lambda: |-
                  #     float ha_brightness = id(display_backlight).remote_values.get_brightness();
                  #     id(backlight_pwm).set_level(ha_brightness);

                  # SCHRITT 1: Wenn offline (NONE) -> Beide Buttons sperren (Disabled)
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_NONE;"
                      then: 
                        - lvgl.widget.disable: lvgl_button_play_stop

                  # SCHRITT 2: Wenn online -> Beide Buttons freigeben (Enabled)
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state != media_player::MEDIA_PLAYER_STATE_NONE;"
                      then: 
                        - lvgl.widget.enable: lvgl_button_play_stop

                  # SCHRITT 3: Wenn Musik läuft (PLAYING) -> Play verstecken, Stop anzeigen
                  - if: 
                      condition: 
                        lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;"
                      then: 
                        - lvgl.label.update:
                            id: lvgl_button_play_stop_label
                            text: "Pause"

                  # SCHRITT 4: Wenn Musik pausiert/leerläuft (IDLE/PAUSED) -> Play anzeigen, Stop verstecken
                  - if: 
                      condition: 
                        lambda: |-
                          return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_IDLE || 
                                id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
                      then: 
                        - lvgl.label.update:
                            id: lvgl_button_play_stop_label
                            text: "Play"
      - logger.log: "LVGL Display-Updates beendet."


  # - lvgl.page.show: lvgl_page_media

  - id: show_page
    parameters: 
      page: lvgl::LvPageType*
    mode: single
    then: 
      - logger.log: "script: show_page"
      - lambda: |-
          if (id(is_blocked)) return;

          if (page != nullptr) {
              // get_parent() holt die übergeordnete LVGL-Komponente.
              // show_page wechselt dann die Seite anhand des seiteninternen Index.
              page->get_parent()->show_page(page->index, LV_SCREEN_LOAD_ANIM_FADE_ON, 300);
          } else {
              ESP_LOGE("main", "show_page aufgerufen, aber page ist ein nullptr!");
          }
