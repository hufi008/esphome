            x: 0
            y: 40
            text: "Musicbox"
            text_font: roboto_24
            text_color: 0x00D2FF
            align: TOP_MID

        - spinner:
            x: 0
            y: 0
            width: 100
            height: 100
            arc_length: 60deg
            arc_width: 4
            indicator:
              arc_color: 0x0000ff
              arc_width: 4
            align: CENTER

        - image:
            x: 0
            y: 0
            width: 64
            height: 64
            src: img_boot_logo
            align: CENTER
            recolor: 0x0000FF
            recolor_opa: 100% 

        - label:          
            x: 0
            y: -20
            text_font: roboto_12
            text_color: 0x00D2FF
            align: BOTTOM_MID
            text: !lambda |-
              return str_sprintf("PROJ %s | IDF: %s | ESP: %s", 
