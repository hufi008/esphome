# musicbox_1.yaml

substitutions:
  device_name: "esphome-web-47a1fc"
  friendly_name: "MusicBox 1"
  media_player_entity_id: "media_player.${ friendly_name | lower | replace(' ', '_') }"
  weather_forecast_id: weather.forecast_home

  # ========================================================
  # --- LINKE SEITE: (3V3) ILI9341/TOUCH, Drehimpulsgeber --
  # ========================================================
  # --- ILI9341 Block ---
  # 3V3                      # -> VCC  (ggf. J1 trennen)
  # GND                      # -> GND
  pin_display_cs:    GPIO4   # -> CS (Display)
  pin_display_reset: GPIO5   # -> RESET (Display)
  pin_display_dc:    GPIO6   # -> D/C (Display)
  pin_spi_mosi:      GPIO7   # -> SDI(MOSI)         und   ---+
  pin_spi_clk:       GPIO15  # -> SCK               und      |  -> T_CLK
  pin_touch_cs:      GPIO16  # -> nix (SDO/MISO blind!)      |  -> T_CS
  pin_display_led:   GPIO17  # -> LED               und quer +---> T_DN
  pin_spi_miso:      GPIO18  # -> nix                           -> T_OUT
  pin_touch_irq:     GPIO8   # -> nix                           -> T_IRQ

  # --- KY-040 Drehgeber Block ---
  pin_encoder_clk:   GPIO12   # -> CLK
  pin_encoder_dt:    GPIO13   # -> DT
  pin_encoder_sw:    GPIO14  # -> SW
  # 3V3 !!!                  # -> +
  # GND                      # -> GND

  # ========================================================
  # --- RECHTE SEITE (5V): AUDIO, LED  ---
  # ========================================================

  # --- WS2812 RGB-LED ---
  # 5V                       # -> +5V
  pin_ws2812_din:    GPIO01  # -> DIN
  # GND                      # -> GND

  # --- MAX98357 I2S Audio Block ---
  pin_max98357_lrc:  GPIO41  # -> LRC
  pin_max98357_bclk: GPIO40  # -> BCLK
  pin_max98357_din:  GPIO39  # -> DIN
  # 100kOhm gegen GND        # -> GAIN
  # frei für stereo          # -> SD
  # GND                      # -> GND
  # 5V                       # -> VIN


esphome:

wifi:
  power_save_mode: NONE
  output_power: 19.5dBm

logger:
  level: DEBUG
  logs:
    xpt2046: INFO
    esp-idf.httpd: ERROR
    sendspin.player: ERROR    

packages:
  # Holt die Grundfunktionen (WLAN, API, etc.)
  base: !include common/base-s3_devkitc_1.yaml
  display: !include common/ILI9341TSXPT2046.yaml
  sound: !include common/MediaPlayerSendspin.yaml
  light: !include common/LedStripOnboard.yaml
  hardware: !include musicbox/hardware.yaml
  functions: !include musicbox/main.yaml
