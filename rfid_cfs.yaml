substitutions:
  device_name: "esphome-web-6c88b4"
  friendly_name: "RFID CFS"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

# Das offizielle, moderne System zum Laden lokaler Komponenten
external_components:
  - source:
      type: local
      path: my_components

api:
  id: api_id
  encryption:
    key: !secret api_encryption_key
  services:
    - service: write_filament_tag
      variables:
        payload: string
      then:
        - lambda: |-
            id(my_cfs_rfid).write_cfs_data(payload);

ota:
- platform: esphome
  allow_partition_access: true
  password: !secret ota_password

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: 
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

esp32:
  board: esp32dev
  framework:
    type: arduino

i2c:
  id: bus_internal
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100khz

logger:
  level: DEBUG

# Aktivierung der soeben erstellten externen Komponente
cfs_rfid:
  id: my_cfs_rfid
  update_interval: 2s
