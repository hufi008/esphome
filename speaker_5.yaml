# -------------------------------------------------------------------
# Wifi und KY-040 Drehgeber Sensoren
# -------------------------------------------------------------------
sensor:
  - platform: sendspin
    type: track_progress
    name: "SendSpin Track Progress"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              # - logger.log:
              #     format: "SendSpin Fortschritt: %02d:%02d:%02d"
              #     args:
              #       - '(int)(x / 1000) / 3600'
              #       - '((int)(x / 1000) % 3600) / 60'
              #       - '(int)(x / 1000) % 60'
              - lambda: |-
                  static unsigned long last_log_time = 0;
                  unsigned long now = millis();

                  // Trigger every 30 real-time seconds (30,000 milliseconds)
                  if (now - last_log_time >= 30000) {
                    last_log_time = now;

                    int total_seconds = x / 1000;
                    ESP_LOGD("custom", "SendSpin Fortschritt: %02d:%02d:%02d", 
                            total_seconds / 3600, 
                            (total_seconds % 3600) / 60, 
                            total_seconds % 60);
                  }

              - lvgl.label.update:
                  id: lvgl_label_progress
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: track_duration
    name: "SendSpin Track Duration"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              - logger.log:
                  format: "SendSpin Gesamtlänge: %02d:%02d:%02d"
                  args:
                    - '(int)(x / 1000) / 3600'
                    - '((int)(x / 1000) % 3600) / 60'
                    - '(int)(x / 1000) % 60'
              - lvgl.label.update:
                  id: lvgl_label_duration
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  min_value: 0
                  max_value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: year
    name: "SendSpin Year"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Year: %.0f"
            args: [ 'x' ]

  - platform: sendspin
    type: track
    name: "SendSpin Track"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Track: %.0f"
            args: [ 'x' ]

  - platform: wifi_signal
    id: wifi_rssi
    name: "Signalstärke"
    update_interval: 15s
    on_value:
      then:
        # Ausgezeichnetes Signal
        - if:
            condition:
              lambda: 'return x >= -50.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_4
                  
        # Gutes Signal
        - if:
            condition:
              lambda: 'return x < -50.0f && x >= -65.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_3

        # Normales Signal
        - if:
            condition:
              lambda: 'return x < -65.0f && x >= -75.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_2

        # Schlechtes Signal
        - if:
            condition:
              lambda: 'return x < -75.0f && x >= -85.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_1

        # Kein/Sehr schlechtes Signal (oder Offline)
        - if:
            condition:
              lambda: 'return x < -85.0f || isnan(x);'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_0

  - platform: rotary_encoder
    id: my_encoder_pulse
    pin_a:
      number: ${pin_encoder_clk}
      mode: INPUT_PULLUP
    pin_b:
      number: ${pin_encoder_dt}
      mode: INPUT_PULLUP
    resolution: 1
    publish_initial_value: true
    on_value:
      - logger.log:
          format: "on_rotary_encoder_pulse %.0f"
          args: [ 'x' ]
    on_clockwise:
      - logger.log: "Turned Clockwise"
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"        


binary_sensor:
  - platform: gpio
    id: my_encoder_button
    pin:
      number: ${pin_encoder_sw}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 20ms      
    on_press:
      then:
        - logger.log: "on_rotary_encoder_press"
    on_release:
      then:
        - logger.log: "on_rotary_encoder_release"
    on_click:
      then:
        - logger.log: "on_rotary_encoder_click"










