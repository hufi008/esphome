# speaker_5.yaml

substitutions:
  device_name: "esphome-web-46406c"
  friendly_name: "Smart Speaker 5"
  media_player_entity_id: "media_player.${ friendly_name | lower | replace(' ', '_') }_audio_player"

  # ========================================================
  # --- LINKE SEITE: (3V3) ILI9341/TOUCH, Drehimpulsgeber --
  # ========================================================
  # --- ILI9341 Block ---
  # 3V3                      # -> VCC  (ggf. J1 trennen)
  # GND                      # -> GND
  pin_ili9341_cs:    GPIO4   # -> CS (Display)
  pin_ili9341_reset: GPIO5   # -> RESET (Display)
  pin_ili9341_dc:    GPIO6   # -> D/C (Display)
  pin_spi_mosi:      GPIO7   # -> SDI(MOSI)         und   ---+
  pin_spi_clk:       GPIO15  # -> SCK               und      |  -> T_CLK
  pin_touch_cs:      GPIO16  # -> nix (SDO/MISO blind!)      |  -> T_CS
  pin_ili9341_led:   GPIO17  # -> LED               und quer +---> T_DN
  pin_spi_miso:      GPIO18  # -> nix                           -> T_OUT
  pin_touch_irq:     GPIO8   # -> nix                           -> T_IRQ

  # --- KY-040 Drehgeber Block ---
  pin_encoder_clk:   GPIO12   # -> CLK
  pin_encoder_dt:    GPIO13   # -> DT
  pin_encoder_sw:    GPIO14  # -> SW
  # 3V3 !!!                  # -> +
  # GND                      # -> GND

  # ========================================================
  # --- RECHTE SEITE (5V): AUDIO, LED  ---
  # ========================================================

  # --- WS2812 RGB-LED ---
  # 5V                       # -> +5V
  pin_ws2812_din:    GPIO01  # -> DIN
  # GND                      # -> GND

  # --- MAX98357 I2S Audio Block ---
  pin_max98357_lrc:  GPIO41  # -> LRC
  pin_max98357_bclk: GPIO40  # -> BCLK
  pin_max98357_din:  GPIO39  # -> DIN
  # 100kOhm gegen GND        # -> GAIN
  # frei für stereo          # -> SD
  # GND                      # -> GND
  # 5V                       # -> VIN
  

  

logger:
  level: DEBUG
  logs:
    xpt2046: INFO

psram:
  mode: octal
  speed: 80MHz


packages:
  # Holt die Grundfunktionen (WLAN, API, etc.)
  base: !include common/base-s3_devkitc_1.yaml


esphome:
  min_version: 2026.7.3
  project:
    name: "hufi.musicbox"
    version: 0.0.2
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: onboard_led
          effect: "Rainbow"




time:
  - id: esptime
    platform: homeassistant
    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "on_time_time_sync");
    on_time:
      - seconds: /30
        then:
          # - lambda: |-
          #     ESP_LOGI("time_trigger", "Läuft jede Sekunde!");      
          - lvgl.label.update:
              id: info_clock
              text: !lambda |-
                auto time_obj = id(esptime).now();
                // str_sprintf erzeugt direkt einen sicheren std::string
                return str_sprintf("%02d:%02d:%02d", time_obj.hour, time_obj.minute, time_obj.second);

          - lvgl.label.update:
              id: info_date
              text: !lambda |-
                auto time_obj = id(esptime).now();
                return str_sprintf("%02d.%02d.%04d", time_obj.day_of_month, time_obj.month, time_obj.year);
                                
button:
  - platform: restart
    name: "Restart"
    on_press:
      then:
        - safe_mode.mark_successful


switch:
  - platform: template
    name: "Eingeschaltet"
    icon: mdi:power
    id: ha_power_switch
    optimistic: true
    # Startzustand beim Booten festlegen
    restore_mode: RESTORE_DEFAULT_ON
    
    on_turn_on:
      then:
        - logger.log: "HA: Power ON empfangen"
        - script.execute: update_states

    on_turn_off:
      then:
        - logger.log: "HA: Power OFF empfangen"
        # - media_player.stop: sendspin_player
        - script.execute: update_states

# -------------------------------------------------------------------
# Lighting
# -------------------------------------------------------------------
# Onboard WS2812 LED
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Onboard RGB"
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    effects:
      - addressable_rainbow:
          id: effect_rainbow
          name: "Rainbow"
          speed: 10           

# Display Backlight (PWM)
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      then:
        - lvgl.slider.update:
            id: lvgl_slider_brightness
            value: !lambda |-
              // Holt den Helligkeits-Float über .remote_values und rechnet ihn auf die 20er-Skala um
              return (int)(id(display_backlight).remote_values.get_brightness() * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_brightness
            text: !lambda |-
              // Aktualisiert den Text direkt im 100%-Format
              return str_sprintf("%0.0f %%", id(display_backlight).remote_values.get_brightness() * 100.0f);
              
output:
  - platform: ledc
    pin: ${pin_ili9341_led}
    id: backlight_pwm
    frequency: 1000Hz # Angenehme Frequenz, um kein hörbares Spulenfiepen zu erzeugen



# -------------------------------------------------------------------
# SENDSPIN MULTIROOM AUDIO ENGINE
# -------------------------------------------------------------------
# 1. Der grundlegende I2S-Taktgeber für deinen MAX98357 (Nutzt die Variablen)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_max98357_lrc}
    i2s_bclk_pin: ${pin_max98357_bclk}

# 2. Definition des physischen Ausgangs am I2S-Bus
speaker:
  - platform: i2s_audio
    id: my_speaker
    dac_type: external
    i2s_dout_pin: ${pin_max98357_din}
    i2s_audio_id: i2s_out
    sample_rate: 48000
    channel: mono
    timeout: never
    buffer_duration: 100ms


# 3. Der zentrale Sendspin Netzwerk-Hub
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# 4. Quelle, die den synchronisierten Netzwerk-Audiostream puffert
media_source:
  - platform: sendspin
    id: sendspin_media_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: 200000

# 5. Der finale Mediaplayer, der den Netzwerkstream an den Speaker schickt
media_player:
  - platform: sendspin
    id: sendspin_player
    name: "Group"
    disabled_by_default: true

    on_state:
      then:
        - logger.log:
            format: "SendSpin Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(sendspin_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "SendSpin: on_play"
    on_pause:
      then:
        - logger.log: "SendSpin: on_pause"
    on_turn_on:
      then:
        - logger.log: "SendSpin: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "SendSpin: on_turn_off"
    on_idle:
      then:
        - logger.log: "SendSpin: on_idle"

  - platform: speaker_source
    id: audio_player
    name: "Audio Player"
    media_pipeline:
      speaker: my_speaker
      sources:
        - sendspin_media_source
    disabled_by_default: true
    on_state:
      then:
        - logger.log:
            format: "Physischer Audio Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(audio_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "AudioPlayer: on_play"
    on_pause:
      then:
        - logger.log: "AudioPlayer: on_pause"
    on_idle:
      then:
        - logger.log: "AudioPlayer: on_idle"
    on_mute:
      then:
        - logger.log: "AudioPlayer: on_mute"
    on_unmute:
      then:
        - logger.log: "AudioPlayer: on_unmute"
    on_volume:
      then:
        - logger.log: "AudioPlayer: on_volume"
        - lvgl.slider.update:
            id: lvgl_slider_volume
            value: !lambda |-
              return (int)(id(audio_player).volume * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_volume
            text: !lambda |-
              return str_sprintf("%0.0f %%", id(audio_player).volume * 100.0f);        
    on_turn_on:
      then:
        - logger.log: "AudioPlayer: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "AudioPlayer: on_turn_off"



