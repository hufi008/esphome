    dc_pin: ${pin_ili9341_dc}
    reset_pin: ${pin_ili9341_reset}
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    dimensions:
      height: 240
      width: 320

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: ${pin_touch_cs}
    interrupt_pin: ${pin_touch_irq}
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 270
      x_max: 3700
      y_min: 450
      y_max: 3900

