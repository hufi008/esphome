spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}

display:
  - platform: mipi_spi
    model: ILI9341
    id: my_display
    spi_mode: MODE0
    cs_pin: ${pin_ili9341_cs}
    dc_pin: ${pin_ili9341_dc}
    reset_pin: ${pin_ili9341_reset}
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    dimensions:
      height: 240
      width: 320

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: ${pin_touch_cs}
    interrupt_pin: ${pin_touch_irq}
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 270
      x_max: 3700
      y_min: 450
      y_max: 3900

# -------------------------------------------------------------------
# GUI
# -------------------------------------------------------------------
lvgl:
  id: my_lvgl
  displays:
    - my_display
  touchscreens:
    - my_touch

  encoders:
    - sensor: my_encoder_pulse
      enter_button: my_encoder_button
      initial_focus: lvgl_button_play_stop 

  on_boot:
    then:
      - lvgl.page.show: lvgl_page_info
      # - lvgl.widget.focus: lvgl_button_play_stop
      - script.execute: update_states
      - logger.log: "[LVGL Boot]"


  theme:
    dark_mode: true  

    # 🎛️ Globale Stile für Basis-Container (obj)
    obj:
      main:
        bg_color: 0x141414
        bg_opa: COVER
        border_width: 0
        radius: 8

    label:
      main:
        text_color: 0xFFFFFF
        text_font: roboto_20    # Globaler Standard für Text-Widgets!

    # 🔘 Globale Button-Stile (Gilt für ALLE Buttons)
    button:
      main:
        bg_color: 0x1E1E1E
        bg_opa: COVER
        radius: 6
        border_width: 0
        text_color: 0xFFFFFF
        text_font: roboto_20    # Globaler Standard für die Buttonbeschriftung!

      pressed:
        bg_color: 0x2C3E50  
        bg_opa: COVER
        text_color: 0x3498DB 

      focused:
        border_color: 0xD35400 
        border_opa: COVER   
        text_color: 0x14487B
        border_width: 3     


  # Statusbar
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 100%
          height: 30
          bg_color: 0x222222
          border_width: 0
          text_color: 0xFFFF00
          text_font: roboto_20
          
          # Die eigentlichen Elemente werden JETZT als Kinder in den Balken gelegt:
          widgets:
            - label:
                id: lvgl_label_status_title
                text: "TITLE"
                align: LEFT_MID
                x: 10
                y: 0 

            - image:
                id: lvgl_icon_wifi
                src: img_wifi_0
                align: RIGHT_MID
                x: -10
                y: 0 
                recolor: "0xFFFFFF"
                recolor_opa: 100% 

  # Die GUI-Elemente
  pages:
    - id: lvgl_page_info
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "INFO"

      widgets:
        # 🕒 GROSSE DIGITALUHR (Zentriert im oberen Drittel)
        - label:
            id: info_clock
            x: 0
            y: 35
            text: "00:00:00"
            text_font: roboto_24
            text_color: 0x00FFD2   # Aqua-Akzentfarbe für die Uhr
            align: TOP_MID

        # 📅 DATUM & WOCHENTAG
        - label:
            id: info_date
            x: 0
            y: 65
            text: "---"
            text_font: roboto_16
            text_color: 0xAAAAAA
            align: TOP_MID

    - id: lvgl_page_media
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "MEDIA"

      widgets:
        # 🎵 TRACK INFOS (Aus dem vorherigen Schritt)
        - label:
            id: lvgl_label_media_title
            x: 10
            y: 35
            width: 90%
            text: "Keine Wiedergabe"
            text_font: roboto_24
            align: TOP_MID
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR

        - label:
            id: lvgl_label_media_artist
            x: 10
            y: 65
            width: 90%
            text: "---  •  ---"
            text_font: roboto_16
            text_color: 0xAAAAAA
            align: TOP_MID
            text_align: CENTER
            long_mode: DOT

        - label:
            id: lvgl_label_media_album
            x: 10
            y: 85
            width: 90%
            text: "---"
            text_font: roboto_16
            text_color: 0x777777   # Etwas dunkleres Grau für die Album-Information
            align: TOP_MID
            text_align: CENTER
            long_mode: DOT

        # ⏳ NEU: KOMBINIERTE ZEITLEISTE (Dauer & Fortschritt links/rechts)
        - obj:
            x: 0
            y: 110
            width: 90%
            height: 25
            align: TOP_MID
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN # Drückt Progress nach links und Length nach rechts
              flex_align_cross: CENTER
            widgets:
              # Aktueller Fortschritt (Links)
              - label:
                  id: lvgl_label_progress
                  text: "00:00:00"
                  text_color: 0x00FFD2

              # Gesamtlänge (Rechts - füttert deinen track_duration Sensor!)
              - label:
                  id: lvgl_label_duration
                  text: "00:00:00"
                  text_color: 0x888888 # Dezent gedimmtes Grau für die Gesamtlänge

        # 📊 FORTSCHRITTSLEISTE (Direkt darunter bei y: 125)
        - bar:
            id: track_progress_bar
            x: 0
            y: 135
            width: 90%
            height: 5
            align: TOP_MID
            bg_color: 0x222222

        # 🎛️ BUTTONBAR UNTEN (Der bündige Container am unteren Rand)
        - obj:
            align: BOTTOM_MID
            x: 0
            y: -5
            width: 95%
            height: 44
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: ROW             
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER   
            widgets:
              # 📌 BUTTON: PREVIOUS
              - button:
                  id: lvgl_button_prev
                  width: 22%
                  height: 34
                  text: "<<"
                  # on_focus:
                  #   then:
                  #     - lvgl.page.show:
                  #         id: lvgl_page_media
                  #         animation: OVER_BOTTOM
                  #         time: 300ms
                  on_click:
                    then:
                      - logger.log: "prev via GUI"
                      - media_player.previous: sendspin_player
              # 📌 BUTTON: PLAY
              - button:
                  id: lvgl_button_play_stop
                  width: 32%
                  height: 34
                  widgets:
                    - label:
                        id: lvgl_button_play_stop_label
                        text: "Wait..."
                        align: CENTER
                  # on_focus:
                  #   then:
                  #     - lvgl.page.show:
                  #         id: lvgl_page_media
                  #         animation: FADE_IN
                  #         time: 300ms
                  on_click:
                    then:
                      - logger.log: "play via GUI"
                      - media_player.toggle: sendspin_player

              # 📌 BUTTON: NEXT
