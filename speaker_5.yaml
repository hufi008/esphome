              id: lvgl_label_status_title
              text: "VOLUME"

      widgets:
        # 🔊 DIGITALE LAUTSTÄRKEANZEIGE (Groß und zentriert im oberen Drittel)
        - label:
            id: lvgl_label_volume
            x: 0
            y: 50
            text: "50 %"
            text_font: roboto_24    # Ausnahme: Große Schrift für den Wert
            text_color: 0x00FFD2   # Aqua-Akzentfarbe passend zur Timeline
            align: TOP_MID
            text_align: CENTER

        # 🎚️ INTEGRATIVER VOLUME-SLIDER (Elegant zentriert im unteren Drittel)
        - slider:
            id: lvgl_slider_volume
            x: 0
            y: 110
            width: 85%
            height: 16
            align: TOP_MID
            min_value: 0
            max_value: 20
            value: 8
            
            # on_focus:
            #   then:
            #     - lvgl.page.show:
            #         id: lvgl_page_volume
            #         animation: FADE_IN
            #         time: 300ms

            on_change:
              then:
                - lvgl.label.update:
                    id: lvgl_label_volume
                    text: !lambda 'return str_sprintf("%0.0f %%", x * 5.0f);'
                - media_player.volume_set:
                    id: audio_player
                    volume: !lambda 'return x / 20.0f;'

    - id: lvgl_page_backlight
      on_load:
        then:
          - lvgl.label.update:
              id: lvgl_label_status_title
              text: "BRIGHTNESS"

      widgets:
        # ☀️ DIGITALE HELLIGKEITSANZEIGE (Groß und zentriert)
        - label:
            id: lvgl_label_brightness
            x: 0
            y: 50
            text: "50 %"
            text_font: roboto_24    # Ausnahme: Große Schrift für den Wert
            text_color: 0x00FFD2   # Aqua-Akzentfarbe passend zur Timeline
            align: TOP_MID
            text_align: CENTER

        # 🎚️ HELLIGKEITS-SLIDER (20 Rasten für flottes Drehen)
        - slider:
            id: lvgl_slider_brightness
            x: 0
            y: 110
            width: 85%
            height: 16
            align: TOP_MID
            min_value: 5
            max_value: 20           # 20 Einzelschritte (5% pro Raste)
            value: 15               # Startwert 75%
            
            # Seiten-Scrollen beim Fokuswechsel auf die korrekte neue ID
            # on_focus:
            #   then:
            #     - lvgl.page.show: lvgl_page_backlight
            #         animation: FADE_IN
            #         time: 300ms

            # Event beim manuellen Drehen am KY-040
            on_change:
              then:
                # 1. Prozentanzeige aktualisieren (x * 5)
                - lvgl.label.update:
                    id: lvgl_label_brightness
                    text: !lambda |-
                      return str_sprintf("%0.0f %%", x * 5.0f);
                
                # 2. Helligkeit an die monochromatic Light-Komponente übergeben
                - light.turn_on:
                    id: display_backlight
                    # x (0-20) geteilt durch 20.0f ergibt den benötigten Float-Bereich (0.0 bis 1.0)
                    brightness: !lambda |-
                      return x / 20.0f;



                    
script:
  - id: update_states
    mode: single
    then: 
      - if:
          condition:
            lambda: 'return !id(is_blocked);'
          then:

            # SCHRITT 0: Wenn power_off
            - if: 
                condition: 
                  lambda: 'return id(ha_power_switch).state == false;'
                then: 
                  - logger.log: "[Script-Pfad] Schalter ist AUS. Initialisiere Info-Standby..."
                  # - lvgl.page.show: lvgl_page_info
                  - lvgl.page.show:
                      id: lvgl_page_info
                      animation: OVER_BOTTOM
                      time: 300ms
                  - lambda: 'id(backlight_pwm).set_level(0.05f);'

                else:
                  - logger.log: "[Script-Pfad] Schalter ist AN. Initialisiere Media-Standby..."
                  # - lvgl.page.show: lvgl_page_media
                  - lvgl.page.show:
                      id: lvgl_page_media
                      animation: OVER_TOP
                      time: 300ms
                  - lambda: |-
                      float ha_brightness = id(display_backlight).remote_values.get_brightness();
                      id(backlight_pwm).set_level(ha_brightness);


            # SCHRITT 1: Wenn offline (NONE) -> Beide Buttons sperren (Disabled)
            - if: 
                condition: 
                  lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_NONE;"
                then: 
                  - lvgl.widget.disable: lvgl_button_play_stop

            # SCHRITT 2: Wenn online -> Beide Buttons freigeben (Enabled)
            - if: 
                condition: 
                  lambda: "return id(sendspin_player).state != media_player::MEDIA_PLAYER_STATE_NONE;"
                then: 
                  - lvgl.widget.enable: lvgl_button_play_stop

            # SCHRITT 3: Wenn Musik läuft (PLAYING) -> Play verstecken, Stop anzeigen
            - if: 
                condition: 
                  lambda: "return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;"
                then: 
                  - lvgl.label.update:
                      id: lvgl_button_play_stop_label
                      text: "Pause"

            # SCHRITT 4: Wenn Musik pausiert/leerläuft (IDLE/PAUSED) -> Play anzeigen, Stop verstecken
            - if: 
                condition: 
                  lambda: |-
                    return id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_IDLE || 
                          id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
                then: 
                  - lvgl.label.update:
                      id: lvgl_button_play_stop_label
                      text: "Play"
            - logger.log: "LVGL Display-Updates beendet."
