# speaker_5.yaml

substitutions:
  device_name: "esphome-web-46406c"
  friendly_name: "Smart Speaker 5"
  media_player_entity_id: "media_player.${ friendly_name | lower | replace(' ', '_') }_audio_player"
  weather_forecast_id: weather.forecast_home

  # ========================================================
  # --- LINKE SEITE: (3V3) ILI9341/TOUCH, Drehimpulsgeber --
  # ========================================================
  # --- ILI9341 Block ---
  # 3V3                      # -> VCC  (ggf. J1 trennen)
  # GND                      # -> GND
  pin_ili9341_cs:    GPIO4   # -> CS (Display)
  pin_ili9341_reset: GPIO5   # -> RESET (Display)
  pin_ili9341_dc:    GPIO6   # -> D/C (Display)
  pin_spi_mosi:      GPIO7   # -> SDI(MOSI)         und   ---+
  pin_spi_clk:       GPIO15  # -> SCK               und      |  -> T_CLK
  pin_touch_cs:      GPIO16  # -> nix (SDO/MISO blind!)      |  -> T_CS
  pin_ili9341_led:   GPIO17  # -> LED               und quer +---> T_DN
  pin_spi_miso:      GPIO18  # -> nix                           -> T_OUT
  pin_touch_irq:     GPIO8   # -> nix                           -> T_IRQ

  # --- KY-040 Drehgeber Block ---
  pin_encoder_clk:   GPIO12   # -> CLK
  pin_encoder_dt:    GPIO13   # -> DT
  pin_encoder_sw:    GPIO14  # -> SW
  # 3V3 !!!                  # -> +
  # GND                      # -> GND

  # ========================================================
  # --- RECHTE SEITE (5V): AUDIO, LED  ---
  # ========================================================

  # --- WS2812 RGB-LED ---
  # 5V                       # -> +5V
  pin_ws2812_din:    GPIO01  # -> DIN
  # GND                      # -> GND

  # --- MAX98357 I2S Audio Block ---
  pin_max98357_lrc:  GPIO41  # -> LRC
  pin_max98357_bclk: GPIO40  # -> BCLK
  pin_max98357_din:  GPIO39  # -> DIN
  # 100kOhm gegen GND        # -> GAIN
  # frei für stereo          # -> SD
  # GND                      # -> GND
  # 5V                       # -> VIN
  

  

logger:
  level: DEBUG
  logs:
    xpt2046: INFO

psram:
  mode: octal
  speed: 80MHz


packages:
  # Holt die Grundfunktionen (WLAN, API, etc.)
  base: !include common/base-s3_devkitc_1.yaml


esphome:
  min_version: 2026.7.3
  project:
    name: "hufi.musicbox"
    version: 0.1.3
  on_boot:
    priority: -100
    then:
      - globals.set:
          id: is_blocked
          value: 'true'
      - lvgl.page.show:
          id: lvgl_page_boot

globals:
  - id: is_blocked
    type: bool
    restore_value: no
    initial_value: 'true'


time:
  - id: esptime
    platform: homeassistant

    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "on_time_time_sync");
      - if:
          condition:
            lambda: 'return id(is_blocked);'
          then:
            - globals.set:
                id: is_blocked
                value: 'false'
            - script.execute: update_states

    on_time:
      - seconds: /30
        then:
          - if:
              condition:
                lambda: 'return !id(my_lvgl).is_ready();'
              then:
                - logger.log: "LVGL noch nicht bereit – Update übersprungen!"
              else:
                - logger.log: "LVGL ist bereit, führe Display-Updates aus."

                - lambda: |-
                    ESP_LOGI("time_trigger", "Läuft alle 30 Sekunden!");

                # 1. UHRZEIT AKTUALISIEREN (Ohne Sekunden)
                - lvgl.label.update:
                    id: info_clock
                    text: !lambda |-
                      auto t = id(esptime).now();
                      return str_sprintf("%02d:%02d", t.hour, t.minute);

                # 2. DATUM & WOCHENTAG AKTUALISIEREN
                - lvgl.label.update:
                    id: info_date
                    text: !lambda |-
                      auto t = id(esptime).now();
                      const char* weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
                      return str_sprintf("%s, %02d.%02d.%04d", weekdays[t.day_of_week % 7], t.day_of_month, t.month, t.year);

                # 3. WETTER-TEXT AKTUALISIEREN
                - lvgl.label.update:
                    id: info_weather
                    text: !lambda |-
                      std::string w = id(ha_weather).state;
                      if (w == "partlycloudy") return "Leicht bewölkt";
                      if (w == "clear_night" || w == "sunny") return "Klar";
                      if (w == "cloudy") return "Bewölkt";
                      if (w == "rainy") return "Regen";
                      if (w == "pouring") return "Starker Regen";
                      if (w == "fog") return "Nebel";
                      return w;

                # 4. WETTER-ICON AKTUALISIEREN
                - lvgl.image.update:
                    id: info_weather_icon
                    src: !lambda |-
                      static const std::map<std::string, const esphome::image::Image*> weather_icon_map = {
                        {"sunny",           id(icon_weather_sunny)},
                        {"clear-night",     id(icon_weather_clear_night)},
                        {"partlycloudy",    id(icon_weather_partlycloudy)},
                        {"cloudy",          id(icon_weather_cloudy)},
                        {"fog",             id(icon_weather_fog)},
                        {"pouring",         id(icon_weather_pouring)},
                        {"rainy",           id(icon_weather_rainy)},
                        {"hail",            id(icon_weather_hail)},
                        {"snowy",           id(icon_weather_snowy)},
                        {"snowy-rainy",     id(icon_weather_snowy_rainy)},
                        {"lightning",       id(icon_weather_lightning)},
                        {"lightning-rainy", id(icon_weather_lightning_rainy)},
                        {"windy",           id(icon_weather_windy)},
                        {"windy-variant",   id(icon_weather_windy)}
                      };
                      std::string current_weather = id(ha_weather).state;
                      auto it = weather_icon_map.find(current_weather);
                      if (it != weather_icon_map.end()) {
                          return const_cast<esphome::image::Image*>(it->second);
                      }
                      return id(icon_weather_exceptional);

                # 5. LOKALE SONNENZEITEN AKTUALISIEREN
                - lvgl.label.update:
                    id: info_sun
                    text: !lambda |-
                      std::string sunrise = id(sunrise_id).state;
                      std::string sunset = id(sunset_id).state;
                      if (sunrise.empty() || sunset.empty()) return "Aufgang: --:--  •  Untergang: --:--";
                      return str_sprintf("Sonne %s  •  %s", sunrise.c_str(), sunset.c_str());

                # 6. MOND-TEXT AKTUALISIEREN (Korrektur: [] und = hinzugefügt)
                - lvgl.label.update:
                    id: info_moon_text
                    text: !lambda |-
                      static const std::string moon_keys[] = {
                        "unknown",
                        "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                        "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
                      };
                      static const std::string moon_texts[] = {
                        "Unbekannt",
                        "Neumond", "1/4 Mond »", "Halbmond »", "3/4 Mond »", "Vollmond", "3/4 Mond «", "Halbmond «", "1/4 Mond «"
                      };
                      std::string phase = id(ha_moonphase).state;
                      int index = 0;
                      for (int i = 1; i < 9; i++) {
                          if (moon_keys[i] == phase) { index = i; break; }
                      }
                      return str_sprintf("Mond (%d/8): %s", index, moon_texts[index].c_str());

                # 7. MOND-ICON AKTUALISIEREN (Korrektur: [] und = hinzugefügt)
                - lvgl.image.update:
                    id: info_moon_icon
                    src: !lambda |-
                      static const std::string moon_keys[] = {
                        "unknown",
                        "new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous",
                        "full_moon", "waning_gibbous", "last_quarter", "waning_crescent"
                      };
                      static const esphome::image::Image* moon_icons[] = {
                        id(icon_moon_unknown),
                        id(icon_moon_new_moon), id(icon_moon_waxing_crescent), id(icon_moon_first_quarter), id(icon_moon_waxing_gibbous),
                        id(icon_moon_full_moon), id(icon_moon_waning_gibbous), id(icon_moon_last_quarter), id(icon_moon_waning_crescent)
                      };
                      std::string phase = id(ha_moonphase).state;
                      int index = 0;
                      for (int i = 1; i < 9; i++) {
                          if (moon_keys[i] == phase) { index = i; break; }
                      }
                      return const_cast<esphome::image::Image*>(moon_icons[index]);
                # 8. LUFTDRUCK AKTUALISIEREN
                - lvgl.label.update:
                    id: info_barometer
                    text: !lambda |-
                      if (std::isnan(id(weather_pressure).state)) return std::string("---");
                      return str_sprintf("%.0f hPa", id(weather_pressure).state);

                # 9. LUFTFEUCHTIGKEIT AKTUALISIEREN (Nutzt deine ID 'info_rain_prob')
                - lvgl.label.update:
                    id: info_rain_prob
                    text: !lambda |-
                      if (std::isnan(id(weather_humidity).state)) return std::string("---");
                      return str_sprintf("%.0f%%", id(weather_humidity).state);

                # 10. WINDGESCHWINDIGKEIT AKTUALISIEREN
                - lvgl.label.update:
                    id: info_wind
                    text: !lambda |-
                      if (std::isnan(id(weather_wind_speed).state)) return std::string("---");
                      return str_sprintf("%.1f km/h", id(weather_wind_speed).state);

                - logger.log: "[Interval] 30s-Takt: ...beendet"
button:
  - platform: restart
    name: "Restart"
    on_press:
      then:
        - safe_mode.mark_successful


switch:
  - platform: template
    name: "Eingeschaltet"
    icon: mdi:power
    id: ha_power_switch
    optimistic: true
    # Startzustand beim Booten festlegen
    restore_mode: RESTORE_DEFAULT_ON
    
    on_turn_on:
      then:
        - logger.log: "HA: Power ON empfangen"
        - light.turn_on:
            id: onboard_led
            effect: "Rainbow"
        - lvgl.resume:
        - script.execute: update_states

    on_turn_off:
      then:
        - logger.log: "HA: Power OFF empfangen"
        - media_player.stop: sendspin_player
        - light.turn_off:
            id: onboard_led
        - script.execute: update_states
        - lvgl.pause:
             show_snow: false

# -------------------------------------------------------------------
# Lighting
# -------------------------------------------------------------------
# Onboard WS2812 LED
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Onboard RGB"
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    effects:
      - addressable_rainbow:
          id: effect_rainbow
          name: "Rainbow"
          speed: 10           

# Display Backlight (PWM)
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      then:
        - lvgl.slider.update:
            id: lvgl_slider_brightness
            value: !lambda |-
              // Holt den Helligkeits-Float über .remote_values und rechnet ihn auf die 20er-Skala um
              return (int)(id(display_backlight).remote_values.get_brightness() * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_brightness
            text: !lambda |-
              // Aktualisiert den Text direkt im 100%-Format
              return str_sprintf("%0.0f %%", id(display_backlight).remote_values.get_brightness() * 100.0f);
              
output:
  - platform: ledc
    pin: ${pin_ili9341_led}
    id: backlight_pwm
    min_power: 0%
    max_power: 80%
    frequency: 1000Hz # Angenehme Frequenz, um kein hörbares Spulenfiepen zu erzeugen



# -------------------------------------------------------------------
# SENDSPIN MULTIROOM AUDIO ENGINE
# -------------------------------------------------------------------
# 1. Der grundlegende I2S-Taktgeber für deinen MAX98357 (Nutzt die Variablen)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_max98357_lrc}
    i2s_bclk_pin: ${pin_max98357_bclk}

# 2. Definition des physischen Ausgangs am I2S-Bus
speaker:
  - platform: i2s_audio
    id: my_speaker
    dac_type: external
    i2s_dout_pin: ${pin_max98357_din}
    i2s_audio_id: i2s_out
    sample_rate: 48000
    channel: mono
    timeout: never
    buffer_duration: 100ms


# 3. Der zentrale Sendspin Netzwerk-Hub
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# 4. Quelle, die den synchronisierten Netzwerk-Audiostream puffert
media_source:
  - platform: sendspin
    id: sendspin_media_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: 200000

# 5. Der finale Mediaplayer, der den Netzwerkstream an den Speaker schickt
media_player:
  - platform: sendspin
    id: sendspin_player
    name: "Group"
    disabled_by_default: true

    on_state:
      then:
        - logger.log:
            format: "SendSpin Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(sendspin_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "SendSpin: on_play"
        - switch.turn_on: ha_power_switch
    on_pause:
      then:
        - logger.log: "SendSpin: on_pause"
    on_turn_on:
      then:
        - logger.log: "SendSpin: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "SendSpin: on_turn_off"
    on_idle:
      then:
        - logger.log: "SendSpin: on_idle"

  - platform: speaker_source
    id: audio_player
    name: "Audio Player"
    media_pipeline:
      speaker: my_speaker
      sources:
        - sendspin_media_source
    disabled_by_default: true
    on_state:
      then:
        - logger.log:
            format: "Physischer Audio Player-State geändert: %s"
            args: ['media_player::media_player_state_to_string(id(audio_player).state)']
        - script.execute: update_states
    on_announcement:
      then:
        - logger.log: "SendSpin: on_announcement"
    on_play:
      then:
        - logger.log: "AudioPlayer: on_play"
    on_pause:
      then:
        - logger.log: "AudioPlayer: on_pause"
    on_idle:
      then:
        - logger.log: "AudioPlayer: on_idle"
    on_mute:
      then:
        - logger.log: "AudioPlayer: on_mute"
    on_unmute:
      then:
        - logger.log: "AudioPlayer: on_unmute"
    on_volume:
      then:
        - logger.log: "AudioPlayer: on_volume"
        - lvgl.slider.update:
            id: lvgl_slider_volume
            value: !lambda |-
              return (int)(id(audio_player).volume * 20.0f);
        - lvgl.label.update:
            id: lvgl_label_volume
            text: !lambda |-
              return str_sprintf("%0.0f %%", id(audio_player).volume * 100.0f);        
    on_turn_on:
      then:
        - logger.log: "AudioPlayer: on_turn_on"
    on_turn_off:
      then:
        - logger.log: "AudioPlayer: on_turn_off"

sun:
  id: sun_id
  latitude: !secret latitude
  longitude: !secret longitude

# -------------------------------------------------------------------
# Wifi & Sendspin Text-Sensoren
# -------------------------------------------------------------------
text_sensor:
  # 📡 Spiegelt die Wetter- und Umweltdaten aus deinem Home Assistant
  - platform: homeassistant
    id: ha_weather
    entity_id: weather.home
  - platform: homeassistant
    id: ha_sunrise
    entity_id: sensor.sunrise
  - platform: homeassistant
    id: ha_sunset
    entity_id: sensor.sunset
  - platform: homeassistant
    id: ha_moonphase
    entity_id: sensor.moon_phase

  - platform: sun
    id: sunrise_id
    name: "Sonnenaufgang"
    type: sunrise
    format: "%H:%M"
  - platform: sun
    id: sunset_id
    name: "Sonnenuntergang"
    type: sunset
    format: "%H:%M"

  - platform: wifi_info
    ip_address:
      name: Device IP Address
    #  address_0:
     #    name: Device IP Address 0
    ssid:
      name: Device Connected SSID
 # bssid:
 #   name: Device Connected BSSID
 # mac_address:
 #   name: Device Mac Wifi Address
    scan_results:
      name: Device Latest Scan Results
#  dns_address:
 #   name: Device DNS Address
    power_save_mode:
      name: Device Wifi Power Save Mode

  - platform: sendspin
    type: title
    name: Track Title
    on_value:
      then:
        - logger.log:
            format: "Track Title: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_title
            text: !lambda 'return x;'
  - platform: sendspin
    type: artist
    name: Artist
    on_value:
      then:
        - logger.log:
            format: "Artist: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_artist
            text: !lambda 'return x;'
  - platform: sendspin
    type: album
    name: Album
    on_value:
      then:
        - logger.log:
            format: "Album: %s"
            args: [ 'x.c_str()' ]
        - lvgl.label.update:
            id: lvgl_label_media_album
            text: !lambda 'return x;'
  

# -------------------------------------------------------------------
# Wifi und KY-040 Drehgeber Sensoren
# -------------------------------------------------------------------
sensor:
  - platform: sendspin
    type: track_progress
    name: "SendSpin Track Progress"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              # - logger.log:
              #     format: "SendSpin Fortschritt: %02d:%02d:%02d"
              #     args:
              #       - '(int)(x / 1000) / 3600'
              #       - '((int)(x / 1000) % 3600) / 60'
              #       - '(int)(x / 1000) % 60'
              - lambda: |-
                  static unsigned long last_log_time = 0;
                  unsigned long now = millis();

                  // Trigger every 30 real-time seconds (30,000 milliseconds)
                  if (now - last_log_time >= 30000) {
                    last_log_time = now;

                    int total_seconds = x / 1000;
                    ESP_LOGD("custom", "SendSpin Fortschritt: %02d:%02d:%02d", 
                            total_seconds / 3600, 
                            (total_seconds % 3600) / 60, 
                            total_seconds % 60);
                  }

              - lvgl.label.update:
                  id: lvgl_label_progress
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: track_duration
    name: "SendSpin Track Duration"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'      
            then:
              - logger.log:
                  format: "SendSpin Gesamtlänge: %02d:%02d:%02d"
                  args:
                    - '(int)(x / 1000) / 3600'
                    - '((int)(x / 1000) % 3600) / 60'
                    - '(int)(x / 1000) % 60'
              - lvgl.label.update:
                  id: lvgl_label_duration
                  text: !lambda |-
                    int total_seconds = (int)(x / 1000);
                    int hours = total_seconds / 3600;
                    int minutes = (total_seconds % 3600) / 60;
                    int seconds = total_seconds % 60;
                    return str_sprintf("%02d:%02d:%02d", hours, minutes, seconds);
              - lvgl.bar.update:
                  id: track_progress_bar
                  min_value: 0
                  max_value: !lambda 'return (int)x;'                    
  - platform: sendspin
    type: year
    name: "SendSpin Year"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Year: %.0f"
            args: [ 'x' ]

  - platform: sendspin
    type: track
    name: "SendSpin Track"
    on_value:
      then:
        - logger.log:
            format: "SendSpin Track: %.0f"
            args: [ 'x' ]

  - platform: wifi_signal
    id: wifi_rssi
    name: "Signalstärke"
    update_interval: 15s
    on_value:
      then:
        # Ausgezeichnetes Signal
        - if:
            condition:
              lambda: 'return x >= -50.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_4
                  
        # Gutes Signal
        - if:
            condition:
              lambda: 'return x < -50.0f && x >= -65.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_3

        # Normales Signal
        - if:
            condition:
              lambda: 'return x < -65.0f && x >= -75.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_2

        # Schlechtes Signal
        - if:
            condition:
              lambda: 'return x < -75.0f && x >= -85.0f;'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_1

        # Kein/Sehr schlechtes Signal (oder Offline)
        - if:
            condition:
              lambda: 'return x < -85.0f || isnan(x);'
            then:
              - lvgl.image.update:
                  id: lvgl_icon_wifi
                  src: img_wifi_0

  - platform: rotary_encoder
    id: my_encoder_pulse
    pin_a:
      number: ${pin_encoder_clk}
      mode: INPUT_PULLUP
    pin_b:
      number: ${pin_encoder_dt}
      mode: INPUT_PULLUP
    resolution: 1
    publish_initial_value: true
    on_value:
      - logger.log:
          format: "on_rotary_encoder_pulse %.0f"
          args: [ 'x' ]
    on_clockwise:
      - logger.log: "Turned Clockwise"
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"        

  # Aktuelle Temperatur
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_forecast_id}
    attribute: temperature
    unit_of_measurement: "°C"

  # Relative Luftfeuchtigkeit
  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_forecast_id}
    attribute: humidity
    unit_of_measurement: "%"

  # Luftdruck
  - platform: homeassistant
    id: weather_pressure
    entity_id: ${weather_forecast_id}
    attribute: pressure
    unit_of_measurement: "hPa"

  # Windgeschwindigkeit
  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_speed
    unit_of_measurement: "km/h"

  # Windrichtung (in Grad, z. B. 180° für Süden)
  - platform: homeassistant
    id: weather_wind_bearing
    entity_id: ${weather_forecast_id}
    attribute: wind_bearing
    unit_of_measurement: "°"

  # Ozon-Wert (falls vom Wetterdienst geliefert)
  - platform: homeassistant
    id: weather_wind_gust_speed
    entity_id: ${weather_forecast_id}
    attribute: wind_gust_speed

  # UV-Index (falls vom Wetterdienst geliefert)
  - platform: homeassistant
    id: weather_uv_index
    entity_id: ${weather_forecast_id}
    attribute: uv_index

binary_sensor:
  - platform: gpio
    id: my_encoder_button
    pin:
      number: ${pin_encoder_sw}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 20ms      
    on_press:
      then:
        - logger.log: "on_rotary_encoder_press"
    on_release:
      then:
        - logger.log: "on_rotary_encoder_release"
    on_click:
    - min_length: 50ms
      max_length: 350ms
      then:
        - logger.log: "on_rotary_encoder_click"
    - min_length: 1000ms
      max_length: 2000ms
      then:
        - logger.log: "on_rotary_encoder_long_click"
        - switch.toggle: ha_power_switch










