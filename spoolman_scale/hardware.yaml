# ==============================================================================
# HARDWARE: BUSSE, SENSOREN, EINGABEN & BUTTONS
# ==============================================================================

i2c:
  - id: i2c_bus
    sda: ${pin_i2c_sda}
    scl: ${pin_i2c_scl}
    scan: true
    frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

number:
  - platform: template
    id: tare_offset
    name: "Tara Offset"
    icon: "mdi:scale-balance"
    entity_category: config
    unit_of_measurement: "g"
    min_value: -5000
    max_value: 5000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

sensor:
  - platform: hx711
    id: scale
    name: "Gewicht"
    dout_pin: ${pin_hx711_dout}
    clk_pin: ${pin_hx711_clk}
    gain: 128
    update_interval: 0.5s
    accuracy_decimals: 0
    on_raw_value:
      then:
        - sensor.template.publish:
            id: scale_raw
            state: !lambda 'return x;'
    filters:
      - calibrate_linear:
          - -363675 ->   0.0
          -   -7975 -> 933.0
      - offset: !lambda 'return -id(tare_offset).state;'
      - round_to_multiple_of: 2
      - clamp:
          min_value: 0
      - or:
          - delta: 2
          - throttle: 300s

  - platform: template
    id: scale_raw
    name: "Gewicht Rohwert"
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - delta: 50

text_sensor:
  - platform: template
    id: spool_uid
    name: "Letzte RFID UID"
    icon: "mdi:nfc"

  - platform: template
    id: spool_info
    name: "Aktive Spule"

  - platform: template
    id: spool_name
    name: "Spulenname"

  - platform: template
    id: spool_id
    name: "Spool-ID"
    icon: "mdi:identifier"

text:
  - platform: template
    id: spoolman_url
    name: "Spoolman URL"
    icon: "mdi:link-variant"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "http://jarvis:8000"

binary_sensor:
  - platform: gpio
    id: button1
    name: "Touch Button"
    pin:
      number: ${pin_button}
      mode: INPUT
      allow_other_uses: true
    on_press:
      then:
        - logger.log: "button1.on_click"
        - script.execute: sleep_after_idle
        - script.execute: measure_and_send

button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart
    on_press:
      then:
        - safe_mode.mark_successful

  - platform: factory_reset
    name: "Factory Reset NVS"
