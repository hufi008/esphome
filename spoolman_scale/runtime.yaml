# Deep Sleep, HTTP-Client und Laufzeitvariablen

deep_sleep:
  id: my_deep_sleep
  wakeup_pin:
    number: ${pin_button}
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE
  on_wake:
    - lambda: 'id(woke_from_sleep) = true;'

http_request:
  useragent: esphome/spoolman-scale
  timeout: 5s
  verify_ssl: false

globals:
  - id: woke_from_sleep
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_msg
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: prev_weight
    type: float
    restore_value: no
    initial_value: '0.0'
