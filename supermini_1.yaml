# supermini_1.yaml

substitutions:
  device_name: "esphome-web-d3bc3c"
  friendly_name: "SuperMini 1"

  # GC9A01
  pin_display_reset: GPIO0
  pin_display_cs:    GPIO1
  pin_display_dc:    GPIO2
  pin_spi_mosi:      GPIO3
  pin_spi_clk:       GPIO4

packages:
  base: !include common/base-c3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: VERBOSE

esphome:

font:
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}

display:
  - id: !extend my_display
    update_interval: 250ms
    auto_clear_enabled: false
    lambda: |-
      // Hintergrund nur beim ersten Durchlauf initial schwarz setzen.
      static bool background_initialized = false;
      if (!background_initialized) {
        it.fill(Color::BLACK);
        background_initialized = true;
      }

      // Sinus-Lookup-Tabelle: einmalig berechnen, danach nur Integer-Zugriffe.
      static int8_t sine[256];
      static bool sine_ready = false;

      if (!sine_ready) {
        for (int i = 0; i < 256; i++) {
          sine[i] = (int8_t) (sinf(i * 0.0245436926f) * 127.0f);
        }
        sine_ready = true;
      }

      // Zeitphasen mit unterschiedlichen Geschwindigkeiten.
      const uint32_t t = millis() / 35;
      const int phase1 = t & 255;
      const int phase2 = (t * 2) & 255;
      const int phase3 = (t * 3) & 255;
      const int phase4 = (t / 2) & 255;

      // Ellipse: 240 x 160 Pixel, zentriert.
      // Nur die linke Hälfte berechnen und nach rechts spiegeln.
      for (int y = 40; y < 200; y++) {
        const float dy = ((float)y - 119.5f) / 80.0f;
        const float half_width = 120.0f * sqrtf(1.0f - dy * dy);

        int x_start = (int)ceilf(119.5f - half_width);
        if (x_start < 0) x_start = 0;

        for (int x = x_start; x < 120; x++) {
          // Domain Warping:
          // Langsame, großflächige Wellen verschieben das Koordinatenfeld.
          // Dadurch werden die folgenden Plasma-Wellen gebogen und verwirbelt,
          // statt als gleichmäßige diagonale Streifen durchzulaufen.
          const int wx1 = sine[(x + y * 2 + phase4) & 255];
          const int wx2 = sine[(x * 2 - y + phase2) & 255];
          const int wy1 = sine[(x - y * 2 - phase3) & 255];
          const int wy2 = sine[(x * 2 + y + phase1) & 255];

          const int warped_x = x + (wx1 + wx2) / 12;
          const int warped_y = y + (wy1 + wy2) / 12;

          // Vier Wellen werden im verzerrten Koordinatenfeld überlagert.
          const int p1 = (warped_x * 3 + warped_y * 2 + phase1) & 255;
          const int p2 = (warped_x * 2 - warped_y * 3 - phase2) & 255;
          const int p3 = (warped_x * 4 + warped_y + phase3) & 255;
          const int p4 = (warped_x - warped_y * 4 - phase4) & 255;

          const int wave =
              (int)sine[p1] +
              (int)sine[p2] +
              (int)sine[p3] +
              (int)sine[p4];

          // Kontrast leicht anheben: mehr zusammenhängende heiße Bereiche
          // und dunklere Zwischenräume.
          int v = 128 + wave / 4;
          if (v < 0) v = 0;
          if (v > 255) v = 255;

          // Farbpalette: Schwarz -> Gelb -> Rot.
          // Gelb bleibt auf die hellsten Spitzen konzentriert;
          // der Gesamteindruck soll überwiegend rot sein.
          int r;
          int g;

          if (v < 18) {
            r = (v * 255) / 18;
            g = r;
          } else {
            r = 255;
            g = 255 - ((v - 18) * 255) / 237;
          }

          const Color color(r, g, 0);
          const int mirror_x = 239 - x;

          it.draw_pixel_at(x, y, color);
          it.draw_pixel_at(mirror_x, y, color);
        }
      }
