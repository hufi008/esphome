# supermini_1.yaml

substitutions:
  device_name: "esphome-web-d3bc3c"
  friendly_name: "SuperMini 1"

  # GC9A01
  pin_display_reset: GPIO0
  pin_display_cs:    GPIO1
  pin_display_dc:    GPIO2
  pin_spi_mosi:      GPIO3
  pin_spi_clk:       GPIO4

packages:
  base: !include common/base-c3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: DEBUG

esphome:

font:
  - id: font_large
    file: "gfonts://Roboto"
    size: 24

display:
  - id: !extend my_display
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      it.printf(120, 120, id(font_large), Color(30, 0, 255), TextAlign::CENTER, "Hallo Welt!");
