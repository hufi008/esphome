# supermini_1.yaml

substitutions:
  device_name: "esphome-web-675044"
  friendly_name: "SuperMini 2"

  # GC9A01
  pin_display_reset: GPIO09
  pin_display_cs:    GPIO10
  pin_display_dc:    GPIO11
  pin_spi_mosi:      GPIO12
  pin_spi_clk:       GPIO13

packages:
  base: !include common/base-s3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: DEBUG

esphome:

button:
  - platform: restart
    name: "Restart"

font:
  - id: font_small
    file: "gfonts://Roboto"
    size: ${font_size_small}
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}

display:
  - id: !extend my_display
    update_interval: 100ms
    auto_clear_enabled: false
    lambda: |-
      // Jeder Frame beginnt mit einem schwarzen Hintergrund.
      it.fill(Color::BLACK);

      // Render-Frequenz messen und oben mittig anzeigen.
      static uint32_t last_frame_ms = 0;
      const uint32_t now = millis();
      float fps = 0.0f;
      if (last_frame_ms != 0 && now > last_frame_ms) {
        fps = 1000.0f / (now - last_frame_ms);
      }
      last_frame_ms = now;

      it.filled_rectangle(92, 2, 56, 22, Color::BLACK);
      it.printf(94, 5, id(font_small), Color(255, 255, 255), "FPS %.1f", fps);

      // ---------------------------------------------------------------
      // DOOM FIRE: klassische 2D-Feuersimulation
      // Wärmequelle unten, Ausbreitung nach oben.
      // 120 x 120 Zellen, jede Zelle wird als 2 x 2 Pixel dargestellt.
      // ---------------------------------------------------------------

      static const int FIRE_W = 120;
      static const int FIRE_H = 120;
      static uint8_t fire[FIRE_H][FIRE_W] = {};

      // Reproduzierbarer schneller Pseudozufall.
      static uint32_t rng = 0xA341316Cu;
      auto random8 = [&]() -> uint8_t {
        rng ^= rng << 13;
        rng ^= rng >> 17;
        rng ^= rng << 5;
        return (uint8_t)(rng & 0xFF);
      };

      // 1. Wärmequelle am Boden nur alle drei Frames verändern.
      // Dadurch bleibt die Flammenbasis ruhiger.
      static uint8_t source_frame = 0;
      source_frame++;
      if (source_frame >= 3) {
        source_frame = 0;
        for (int x = 0; x < FIRE_W; x++) {
          const int n = random8();
          if (n < 30) {
            fire[FIRE_H - 1][x] = 0;
          } else if (n < 95) {
            fire[FIRE_H - 1][x] = 115 + (random8() % 90);
          } else {
            fire[FIRE_H - 1][x] = 195 + (random8() % 61);
          }
        }
      }

      // 2. Ausbreitung nur jeden zweiten Display-Frame berechnen.
      // Das beruhigt das Flackern, ohne die Anzeige-FPS zu verändern.
      static bool simulation_tick = false;
      simulation_tick = !simulation_tick;

      if (simulation_tick) {
        for (int y = FIRE_H - 2; y >= 0; y--) {
          for (int x = 0; x < FIRE_W; x++) {
            fire[y][x] = 0;
          }

          for (int x = 0; x < FIRE_W; x++) {
            const int source = fire[y + 1][x];
            if (source == 0) continue;

            // Ein zufälliger Drift verschiebt die ganze Flammenzunge.
            const int drift = (int)(random8() % 3) - 1;
            const int target_x = x + drift;
            if (target_x < 1 || target_x >= FIRE_W - 1) continue;

            // Der Kern bleibt heiß; die Flanken sind unterschiedlich stark.
            const int center_value = source - (2 + (random8() % 4));
            const int left_value = source - (9 + (random8() % 15));
            const int right_value = source - (9 + (random8() % 15));

            if (center_value > 0 && center_value > fire[y][target_x]) {
              fire[y][target_x] = (uint8_t)center_value;
            }
            if (left_value > 0 && random8() < 205 &&
                left_value > fire[y][target_x - 1]) {
              fire[y][target_x - 1] = (uint8_t)left_value;
            }
            if (right_value > 0 && random8() < 205 &&
                right_value > fire[y][target_x + 1]) {
              fire[y][target_x + 1] = (uint8_t)right_value;
            }
          }
        }
      }

      // 3. Temperatur in die klassische Feuerfarbpalette umsetzen.
      for (int y = 0; y < FIRE_H; y++) {
        for (int x = 0; x < FIRE_W; x++) {
          const int v = fire[y][x];

          int r = 0;
          int g = 0;
          int b = 0;

          if (v < 32) {
            r = v * 2;
          } else if (v < 96) {
            r = 64 + (v - 32) * 3;
          } else if (v < 160) {
            r = 255;
            g = (v - 96) * 3;
          } else if (v < 224) {
            r = 255;
            g = 192 + (v - 160);
          } else {
            r = 255;
            g = 255;
            b = v - 224;
          }

          // Zellmitte auf das 240 x 240 Display abbilden.
          const int px = x * 2;
          const int py = y * 2;
          const int dx = px + 1 - 119;
          const int dy = py + 1 - 119;

          // Rundes Display: außerhalb des sichtbaren Kreises schwarz lassen.
          if (dx * dx + dy * dy > 119 * 119) {
            continue;
          }

          if (v > 3) {
            it.filled_rectangle(px, py, 2, 2, Color(r, g, b));
          }
        }
      }
