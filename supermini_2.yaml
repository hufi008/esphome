# supermini_1.yaml

substitutions:
  device_name: "esphome-web-675044"
  friendly_name: "SuperMini 2"

  # GC9A01
  pin_display_reset: GPIO09
  pin_display_cs:    GPIO10
  pin_display_dc:    GPIO11
  pin_spi_mosi:      GPIO12
  pin_spi_clk:       GPIO13

packages:
  base: !include common/base-s3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: DEBUG

esphome:

button:
  - platform: restart
    name: "Restart"

font:
  - id: font_small
    file: "gfonts://Roboto"
    size: ${font_size_small}
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}

display:
  - id: !extend my_display
    update_interval: 50ms
    auto_clear_enabled: false
    lambda: |-
      static bool first_paint = true;
      if (first_paint) {
        it.fill(Color::BLACK);
        first_paint = false;
      }

      // Render-Frequenz messen und oben mittig anzeigen.
      static uint32_t last_frame_ms = 0;
      const uint32_t now = millis();
      float fps = 0.0f;
      if (last_frame_ms != 0 && now > last_frame_ms) {
        fps = 1000.0f / (now - last_frame_ms);
      }
      last_frame_ms = now;

      it.filled_rectangle(92, 2, 56, 22, Color::BLACK);
      it.printf(94, 5, id(font_small), Color(255, 255, 255), "FPS %.1f", fps);

      constexpr int W = 100;
      constexpr int H = 60;
      constexpr int OFFSET_X = 120;
      constexpr int OFFSET_Y = 70;

      // std::array statt C-Array (vermeidet Klammer-Fehler beim Kopieren)
      static const std::array<Color, 37> PALETTE = {
        Color(0, 0, 0),       Color(31, 7, 7),     Color(47, 15, 7),    Color(71, 15, 7),
        Color(87, 23, 7),     Color(103, 31, 7),   Color(119, 31, 7),   Color(143, 39, 7),
        Color(159, 47, 7),    Color(175, 63, 7),   Color(191, 71, 7),   Color(199, 71, 7),
        Color(223, 79, 7),    Color(223, 87, 7),   Color(223, 87, 7),   Color(215, 95, 7),
        Color(215, 95, 7),    Color(215, 103, 15), Color(207, 111, 15), Color(207, 119, 15),
        Color(207, 127, 15),  Color(207, 135, 23), Color(199, 135, 23), Color(199, 143, 23),
        Color(199, 151, 31),  Color(191, 159, 31), Color(191, 159, 31), Color(191, 167, 39),
        Color(191, 167, 39),  Color(191, 175, 47), Color(183, 175, 47), Color(183, 183, 47),
        Color(183, 183, 55),  Color(207, 207, 111),Color(223, 223, 159),Color(239, 239, 199),
        Color(255, 255, 255)
      };

      // 2D-Waermefeld: Die Pupille ist die kontinuierliche Waermequelle.
      // Raster: x = vertikale Augenachse, y = Abstand von der Mittelachse
      // (wird beim Zeichnen nach links und rechts gespiegelt).
      static uint8_t heat_a[W * H] = {0};
      static uint8_t heat_b[W * H] = {0};
      static uint8_t *heat = heat_a;
      static uint8_t *next_heat = heat_b;

      // Schneller lokaler Zufallszahlengenerator fuer Quellenflackern
      // und kleine thermische Unregelmaessigkeiten.
      static uint32_t rng = 0xA341316Cu;
      auto random32 = [&]() -> uint32_t {
        rng ^= rng << 13;
        rng ^= rng >> 17;
        rng ^= rng << 5;
        return rng;
      };

      const int center = W / 2;

      // Waerme diffundiert in alle 8 Nachbarzellen.
      // Der Transport zur horizontalen Augenmittelachse wird verstaerkt.
      for (int y = 0; y < H; y++) {
        for (int x = 0; x < W; x++) {
          const int index = y * W + x;
          const float current = heat[index];
          float sum = 0.0f;
          float weight_sum = 0.0f;

          for (int dy = -1; dy <= 1; dy++) {
            for (int dx = -1; dx <= 1; dx++) {
              if (dx == 0 && dy == 0) continue;

              const int nx = x + dx;
              const int ny = y + dy;
              if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;

              float weight;
              if (dx == 0 || dy == 0) weight = 1.0f;
              else weight = 0.55f;

              // Nachbarn naeher an der Mittelachse erhalten mehr Gewicht.
              if (dx != 0) {
                if (abs(nx - center) < abs(x - center)) weight *= 1.8f;
                else weight *= 0.7f;
              }

              sum += heat[ny * W + nx] * weight;
              weight_sum += weight;
            }
          }

          const float average = (weight_sum > 0.0f) ? sum / weight_sum : current;
          const uint32_t r = random32();

          // Waerme soll deutlich weiter von der Pupille weg diffundieren.
          // Die Abkuehlung bleibt klein, damit die Ausbreitung nicht direkt versiegt.
          const float diffusion = 0.42f + (r & 7) * 0.006f;
          const float cooling = 0.025f + ((r >> 8) & 3) * 0.012f;
          const float flicker = ((int)((r >> 12) & 7) - 3) * 0.22f;

          float value = current + (average - current) * diffusion - cooling + flicker;
          if (value < 0.0f) value = 0.0f;
          if (value > 255.0f) value = 255.0f;
          next_heat[index] = (uint8_t)value;
        }
      }

      // Kontinuierliche, leicht flackernde Waermequelle entlang der Pupille.
      // Die Pupille selbst wird spaeter schwarz darueber gezeichnet.
      for (int x = 21; x <= 79; x++) {
        next_heat[(H - 1) * W + x] = 215 + (random32() % 41);
      }

      // Simulationspuffer tauschen: alle Zellen arbeiten mit dem alten Feld.
      uint8_t *swap = heat;
      heat = next_heat;
      next_heat = swap;

      // 3. Das komplette Waermefeld in jedem Frame neu zeichnen.
      // So werden auch abgekuehlte Pixel und die alte Pupillenform geloescht.
      for (int y = 0; y < H; y++) {
        for (int x = 0; x < W; x++) {
          const int index = y * W + x;
          const uint8_t heat_value = heat[index];
          const uint8_t heat_color = (heat_value * 36 + 127) / 255;

          const Color &color = PALETTE[heat_color];
          const int screen_x_left = OFFSET_X - 2 * H + 2 * y + 1;
          const int screen_x_right = OFFSET_X + 2 * H - 2 * y - 1;
          const int screen_y = OFFSET_Y + x;

          it.filled_rectangle(screen_x_left, screen_y, 2, 1, color);
          it.filled_rectangle(screen_x_right, screen_y, 2, 1, color);
        }
      }

      // 4. Senkrechte Pupille: gelegentliche, sprunghafte Weitenänderung.
      static int pupil_width = 6;
      static uint32_t next_pupil_change = 0;
      if (now >= next_pupil_change) {
        pupil_width = 4 + (random32() % 5) * 2;  // 4, 6, 8, 10 oder 12 Pixel
        next_pupil_change = now + 1200 + (random32() % 2200);
      }

      // Elliptische Pupille mit weich gerundeten Enden.
      constexpr int PUPIL_TOP = 91;
      constexpr int PUPIL_HEIGHT = 58;
      constexpr float PUPIL_RADIUS_Y = (PUPIL_HEIGHT - 1) / 2.0f;
      for (int row = 0; row < PUPIL_HEIGHT; row++) {
        const float dy = (row - PUPIL_RADIUS_Y) / PUPIL_RADIUS_Y;
        const float shape = 1.0f - dy * dy;
        if (shape <= 0.0f) continue;

        int row_width = (int)(pupil_width * sqrtf(shape));
        if (row_width < 1) row_width = 1;

        const int pupil_x = 120 - row_width / 2;
        it.filled_rectangle(pupil_x, PUPIL_TOP + row, row_width, 1, Color::BLACK);
      }
