# supermini_1.yaml

substitutions:
  device_name: "esphome-web-675044"
  friendly_name: "SuperMini 2"

  # GC9A01
  pin_display_reset: GPIO09
  pin_display_cs:    GPIO10
  pin_display_dc:    GPIO11
  pin_spi_mosi:      GPIO12
  pin_spi_clk:       GPIO13

packages:
  base: !include common/base-s3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: DEBUG

esphome:

button:
  - platform: restart
    name: "Restart"

font:
  - id: font_small
    file: "gfonts://Roboto"
    size: ${font_size_small}
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}

display:
  - id: !extend my_display
    update_interval: 50ms
    auto_clear_enabled: false
    lambda: |-
      static bool first_paint = true;
      if (first_paint) {
        it.fill(Color::BLACK);
        first_paint = false;
      }

      // Render-Frequenz messen und oben mittig anzeigen.
      static uint32_t last_frame_ms = 0;
      const uint32_t now = millis();
      float fps = 0.0f;
      if (last_frame_ms != 0 && now > last_frame_ms) {
        fps = 1000.0f / (now - last_frame_ms);
      }
      last_frame_ms = now;

      it.filled_rectangle(92, 2, 56, 22, Color::BLACK);
      it.printf(94, 5, id(font_small), Color(255, 255, 255), "FPS %.1f", fps);

      constexpr int W = 60;
      constexpr int H = 100;
      constexpr int OFFSET_X = 120;
      constexpr int OFFSET_Y = 90;

      // std::array statt C-Array (vermeidet Klammer-Fehler beim Kopieren)
      static const std::array<Color, 37> PALETTE = {
        Color(0, 0, 0),       Color(31, 7, 7),     Color(47, 15, 7),    Color(71, 15, 7),
        Color(87, 23, 7),     Color(103, 31, 7),   Color(119, 31, 7),   Color(143, 39, 7),
        Color(159, 47, 7),    Color(175, 63, 7),   Color(191, 71, 7),   Color(199, 71, 7),
        Color(223, 79, 7),    Color(223, 87, 7),   Color(223, 87, 7),   Color(215, 95, 7),
        Color(215, 95, 7),    Color(215, 103, 15), Color(207, 111, 15), Color(207, 119, 15),
        Color(207, 127, 15),  Color(207, 135, 23), Color(199, 135, 23), Color(199, 143, 23),
        Color(199, 151, 31),  Color(191, 159, 31), Color(191, 159, 31), Color(191, 167, 39),
        Color(191, 167, 39),  Color(191, 175, 47), Color(183, 175, 47), Color(183, 183, 47),
        Color(183, 183, 55),  Color(207, 207, 111),Color(223, 223, 159),Color(239, 239, 199),
        Color(255, 255, 255)
      };

      // Hitze-Buffer im RAM.
      static uint8_t fire[W * H] = {0};

      // Schneller lokaler Zufallszahlengenerator statt esp_random()
      // bei jedem einzelnen Simulationsschritt.
      static uint32_t rng = 0xA341316Cu;
      auto random32 = [&]() -> uint32_t {
        rng ^= rng << 13;
        rng ^= rng >> 17;
        rng ^= rng << 5;
        return rng;
      };

      // 1. Lebendige Glutnester am Boden erzeugen.
      for (int x = 0; x < W; x++) {
        uint32_t r = random32();
        if ((r & 15) == 0) {
          fire[(H - 1) * W + x] = 16;
        } else {
          fire[(H - 1) * W + x] = 30 + (r % 7);
        }
      }

      // 2. Feuer-Ausbreitung mit stärkerem Lodern berechnen
      for (int x = 0; x < W; x++) {
        for (int y = 1; y < H; y++) {
          int src = y * W + x;
          uint8_t heat = fire[src];

          if (heat == 0) {
            fire[src - W] = 0;
          } else {
            uint32_t r = random32();
            
            // Stärkere seitliche Ablenkung (-2 bis +2 Pixel) für züngelnde Spitzen
            int wind = (r % 5) - 2;
            int dstX = x + wind;
            if (dstX < 0) dstX = 0;
            if (dstX >= W) dstX = W - 1;

            // Unregelmäßigere Abkühlung für unterschiedlich hohe Flammenzungen
            int decay = (r >> 4) % 3;
            if (y > 20 && decay == 2) decay = 1;

            int newHeat = heat - decay;
            fire[(y - 1) * W + dstX] = (newHeat > 0) ? newHeat : 0;
          }
        }
      }

      // 3. Feuer ohne Rotation zeichnen: links und rechts gespiegelt.
      // Jede Simulationszelle wird 1 Pixel breit und 2 Pixel hoch dargestellt.
      for (int y = 0; y < H; y++) {
        const int screen_y = OFFSET_Y + y * 2;
        for (int x = 0; x < W; x++) {
          const uint8_t heat = fire[y * W + x];
          const Color color = PALETTE[heat];

          it.filled_rectangle(OFFSET_X + x, screen_y, 1, 2, color);
          it.filled_rectangle(OFFSET_X - 1 - x, screen_y, 1, 2, color);
        }
      }
