# supermini_1.yaml

substitutions:
  device_name: "esphome-web-675044"
  friendly_name: "SuperMini 2"

  # GC9A01
  pin_display_reset: GPIO09
  pin_display_cs:    GPIO10
  pin_display_dc:    GPIO11
  pin_spi_mosi:      GPIO12
  pin_spi_clk:       GPIO13

packages:
  base: !include common/base-s3_supermini.yaml
  display: !include common/GC9A01.yaml

logger:
  level: DEBUG

esphome:

button:
  - platform: restart
    name: "Restart"

font:
  - id: font_small
    file: "gfonts://Roboto"
    size: ${font_size_small}
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}

display:
  - id: !extend my_display
    update_interval: 100ms
    auto_clear_enabled: false
    lambda: |-
      // Jeder Frame beginnt mit einem schwarzen Hintergrund.
      it.fill(Color::BLACK);

      // Render-Frequenz messen und oben mittig anzeigen.
      static uint32_t last_frame_ms = 0;
      const uint32_t now = millis();
      float fps = 0.0f;
      if (last_frame_ms != 0 && now > last_frame_ms) {
        fps = 1000.0f / (now - last_frame_ms);
      }
      last_frame_ms = now;

      it.filled_rectangle(92, 2, 56, 22, Color::BLACK);
      it.printf(94, 5, id(font_small), Color(255, 255, 255), "FPS %.1f", fps);

      // Originale Fire-Propagation, 1 Simulationszelle pro Displaypixel.
      constexpr int W = 240;
      constexpr int H = 240;

      static const std::array<Color, 37> PALETTE = {
        Color(0, 0, 0),       Color(31, 7, 7),     Color(47, 15, 7),    Color(71, 15, 7),
        Color(87, 23, 7),     Color(103, 31, 7),   Color(119, 31, 7),   Color(143, 39, 7),
        Color(159, 47, 7),    Color(175, 63, 7),   Color(191, 71, 7),   Color(199, 71, 7),
        Color(223, 79, 7),    Color(223, 87, 7),   Color(223, 87, 7),   Color(215, 95, 7),
        Color(215, 95, 7),    Color(215, 103, 15), Color(207, 111, 15), Color(207, 119, 15),
        Color(207, 127, 15),  Color(207, 135, 23), Color(199, 135, 23), Color(199, 143, 23),
        Color(199, 151, 31),  Color(191, 159, 31), Color(191, 159, 31), Color(191, 167, 39),
        Color(191, 167, 39),  Color(191, 175, 47), Color(183, 175, 47), Color(183, 183, 47),
        Color(183, 183, 55),  Color(207, 207, 111),Color(223, 223, 159),Color(239, 239, 199),
        Color(255, 255, 255)
      };

      static uint8_t fire[W * H] = {};

      // Glut am unteren Rand erzeugen.
      for (int x = 0; x < W; x++) {
        const uint32_t r = esp_random();
        if ((r & 15) == 0) {
          fire[(H - 1) * W + x] = 16;
        } else {
          fire[(H - 1) * W + x] = 30 + (r % 7);
        }
      }

      // Originale Ausbreitung: zufällige Ablenkung um -2 bis +2 Pixel.
      for (int x = 0; x < W; x++) {
        for (int y = 1; y < H; y++) {
          const int src = y * W + x;
          const uint8_t heat = fire[src];

          if (heat == 0) {
            fire[src - W] = 0;
          } else {
            const uint32_t r = esp_random();
            const int wind = (r % 5) - 2;
            int dst_x = x + wind;
            if (dst_x < 0) dst_x = 0;
            if (dst_x >= W) dst_x = W - 1;

            int decay = (r >> 4) % 3;
            if (y > 40 && decay == 2) decay = 1;

            const int new_heat = heat - decay;
            fire[(y - 1) * W + dst_x] =
              (new_heat > 0) ? (uint8_t)new_heat : 0;
          }
        }
      }

      // Auf das runde Display zeichnen; außerhalb des Kreises bleibt es schwarz.
      for (int y = 0; y < H; y++) {
        for (int x = 0; x < W; x++) {
          const uint8_t heat = fire[y * W + x];
          if (heat == 0) continue;

          const int dx = x - 119;
          const int dy = y - 119;
          if (dx * dx + dy * dy > 119 * 119) continue;

          it.draw_pixel_at(x, y, PALETTE[heat]);
        }
      }
      }

      // 4. Auf das runde 240 x 240 Display zeichnen.
      // Jede Simulationszelle belegt 2 x 2 Pixel.
      for (int y = 0; y < H; y++) {
        for (int x = 0; x < W; x++) {
          const uint8_t heat = fire[y * W + x];
          if (heat == 0) continue;

          const int px = x * 2;
          const int py = y * 2;
          const int dx = px + 1 - 119;
          const int dy = py + 1 - 119;
          if (dx * dx + dy * dy > 119 * 119) continue;

          it.filled_rectangle(px, py, 2, 2, PALETTE[heat]);
        }
      }
