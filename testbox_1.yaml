# testbox_1.yaml

substitutions:
  device_name: "esphome-web-479ce4"
  friendly_name: "MusicBox 2"
  media_player_entity_id: "media_player.${ friendly_name | lower | replace(' ', '_') }"
  weather_forecast_id: weather.forecast_home

  # ========================================================
  # --- LINKE SEITE: (3V3) DISPLAY/TOUCH, Drehimpulsgeber --
  # ========================================================
  # --- ILI9341 Block ---
  # 3V3                      # -> VCC 
  # GND                      # -> GND
  pin_display_cs:    GPIO4   # -> LCD_CS
  pin_display_reset: GPIO5   # -> LCD_RST
  pin_display_dc:    GPIO6   # -> LCD_DS
  pin_spi_mosi:      GPIO7   # -> SDI(MOSI)
  pin_spi_clk:       GPIO15  # -> SCK
  pin_display_led:   GPIO16  # -> LED
  pin_spi_miso:      GPIO17  # -> SDO(MISO) nicht verbinden

  pin_touch_irq:     GPIO18  # -> CTP_INT
  pin_touch_reset:   GPIO08  # -> CTP_RST
  pin_i2c_scl:       GPIO09  # -> CTP_SCL
  pin_i2c_sda:       GPIO10  # -> CTP_SDA

  # --- KY-040 Drehgeber Block ---
  pin_encoder_clk:   GPIO12  # -> CLK
  pin_encoder_dt:    GPIO13  # -> DT
  pin_encoder_sw:    GPIO14  # -> SW
  # 3V3 !!!                  # -> +
  # GND                      # -> GND

  # ========================================================
  # --- RECHTE SEITE (5V): AUDIO, LED  ---
  # ========================================================

  # --- WS2812 RGB-LED ---
  # 5V                       # -> +5V
  pin_ws2812_din:    GPIO01  # -> DIN
  # GND                      # -> GND

  # --- MAX98357 I2S Audio Block ---
  pin_max98357_lrc:  GPIO41  # -> LRC
  pin_max98357_bclk: GPIO40  # -> BCLK
  pin_max98357_din:  GPIO39  # -> DIN
  # 100kOhm gegen GND        # -> GAIN
  # frei für stereo          # -> SD
  # GND                      # -> GND
  # 5V                       # -> VIN


  # Optimierung Pins
  #   # --- BLOCK 1: KY-040 Drehgeber (Ganz oben am ESP32) ---
  # pin_encoder_clk:   GPIO4   # ESP32: J1-4  -> Geht an: KY-040 CLK
  # pin_encoder_dt:    GPIO5   # ESP32: J1-5  -> Geht an: KY-040 DT
  # pin_encoder_sw:    GPIO6   # ESP32: J1-6  -> Geht an: KY-040 SW

  # # --- BLOCK 2: Touch & Display (Spiegelbildlich zum Display-Header) ---
  # # (Hinweis: Display SD_CS lassen wir frei oder legen es auf einen freien Pin)
  # pin_touch_irq:     GPIO7   # ESP32: J1-7  -> Geht an: CTP_INT
  # pin_i2c_sda:       GPIO15  # ESP32: J1-8  -> Geht an: CTP_SDA
  # pin_touch_reset:   GPIO16  # ESP32: J1-9  -> Geht an: CTP_RST
  # pin_i2c_scl:       GPIO17  # ESP32: J1-10 -> Geht an: CTP_SCL

  # # --- BLOCK 3: Hardware-SPI & Display-Steuerung ---
  # pin_spi_miso:      GPIO18  # ESP32: J1-11 -> Geht an: SDO(MISO) (Optional, meist nicht benötigt)
  # pin_display_led:   GPIO8   # ESP32: J1-12 -> Geht an: LED / Backlight
  # # (Hinweis: ESP32 J1-13 [GPIO3] und J1-14 [GPIO46] überspringen wir für perfekte Kabelführung)
  # pin_spi_clk:       GPIO12  # ESP32: J1-18 -> Geht an: SCK    [Standard Hardware-SPI]
  # pin_spi_mosi:      GPIO11  # ESP32: J1-17 -> Geht an: SDI(MOSI) [Standard Hardware-SPI]
  # pin_display_dc:    GPIO9   # ESP32: J1-15 -> Geht an: LCD_RS (DC)
  # pin_display_reset: GPIO10  # ESP32: J1-16 -> Geht an: LCD_RST
  # pin_display_cs:    GPIO13  # ESP32: J1-19 -> Geht an: LCD_CS

  # # (Hinweis: ESP32 J1-20 [GPIO14] bleibt am Ende frei)


esphome:
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - light.turn_on:
          id: display_backlight
          brightness: 40%

logger:
  level: VERY_VERBOSE

packages:
  # Holt die Grundfunktionen (WLAN, API, etc.)
  base: !include common/base-s3_devkitc_1.yaml
  display: !include common/ST7796TSFT6336U.yaml

output:
  - platform: ledc
    pin: ${pin_display_led}
    id: display_led
    frequency: 20000Hz

light:
  - platform: monochromatic
    output: display_led
    id: display_backlight
    restore_mode: ALWAYS_OFF

display:
  - id: !extend my_display
    spi_mode: MODE0
    data_rate: 20MHz
    byte_order: big_endian
    color_order: RGB
    invert_colors: false
    auto_clear_enabled: true
    update_interval: 1000ms
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    lambda: |-
      it.fill(Color(0, 0, 0));

      it.rectangle(0, 0, 479, 319, Color(255, 0, 0));

      it.filled_rectangle(20, 20, 119, 119, Color(255, 0, 0));
      it.filled_rectangle(130, 20, 229, 119, Color(0, 255, 0));
      it.filled_rectangle(240, 20, 339, 119, Color(0, 0, 255));

      it.filled_rectangle(20, 140, 119, 239, Color(255, 255, 255));
      it.filled_rectangle(130, 140, 229, 239, Color(255, 255, 0));
      it.filled_rectangle(240, 140, 339, 239, Color(0, 255, 255));

      it.line(0, 0, 479, 319, Color(255, 255, 255));
      it.line(479, 0, 0, 319, Color(255, 255, 255));