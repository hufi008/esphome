# tryweather.yaml
substitutions:
  device_name: "esphome-web-f407a0"
  friendly_name: "Weather Station"

  ### Pin-Belegung
  # Amp Max98357
  spk_lrc_pin:   "GPIO40"   # LEFT / RIGHT CLOCK
  spk_bclk_pin:  "GPIO39"   # Bit CLOCK
  spk_din_pin:   "GPIO38"   # DATA OUT
  # VCC: 5V
  # GAIN: 100kΩ GND = 15dB, GND = 12dB, nix = 9dB, VCC = 6dB, 100kΩ VCC = 3DB
  # SD: nix = (L+R)/2, 370kΩ VCC = Rechts, 100kΩ = Links
  

  # Microphone INMP441
  mic_ws_pin:    "GPIO06"   # WORD SELECT
  mic_sck_pin:   "GPIO05"   # SERIAL CLOCK
  mic_sd_pin:    "GPIO04"   # SERIAL DATA
  # VCC: 3V3
  # L/R: GND = Links, VCC = Rechts

  # LED Strip WS2812
  led_din_pin:   "GPIO42"    # DATA IN
  led_count:     "10"        # Number of LEDs
  # VCC: 5V
  # din mit Levelshifter auf 5V heben oder mit 100Ω Widerstand an 3V3 lassen (bei kurzen Strip-Längen)

  # I2C Bus
  i2c_sda_pin:   "GPIO17"    # SERIAL DATA
  i2c_scl_pin:   "GPIO18"    # SERIAL CLOCK
  # VCC: 3V3
  
  # Display OLED SSD1306
  ssd_addr:      "0x3C"
  # VCC: 3V3

  # Button TTP221
  btn_1_pin:     "GPIO11"
  btn_2_pin:     "GPIO12"
  btn_3_pin:     "GPIO13"
  btn_4_pin:     "GPIO14"
  # VCC: 3V3

logger:
  level: DEBUG

json:

packages:
  # Holt die Grundfunktionen (WLAN, API, etc.)
  base: !include common/base-esp32.yaml
  # Holt die Funktionalität

globals:
  - id: forcast_repository
    type: JsonDocument
    initial_value: 'JsonDocument()'

time:
  - platform: homeassistant
    id: esptime


interval:
  - interval: 30min
    startup_delay: 5sec      
    then: 
      homeassistant.action:
        action: weather.get_forecasts
        data:
          entity_id: weather.forecast_home
          type: hourly
        capture_response: true
        response_template: >-
          [
            {% for h in response['weather.forecast_home']['forecast'] %}
              {
                "wday": {{ as_datetime(h.datetime).strftime('%w') }},
                "hour": "{{ as_datetime(h.datetime).strftime('%H:%M') }}",
                "cond": "{{ h.condition }}",
                "temp": {{ h.temperature | default(0) }},
                "prec": {{ h.precipitation_probability | default(0) }}
              }{% if not loop.last %},{% endif %}
            {% endfor %}
          ]
        on_success:
          - lambda: |-
              // 1. Tiefe Kopie in die globale Variable
              id(forcast_repository) = response["response"];
              
              // 2. Offizielle Längenabfrage des Arrays im globalen Dokument
              ESP_LOGD("weather", "forcast_repository %zu items received.", id(forcast_repository).size());
              
              // 3. Schreibgeschützte Ansicht für die Schleife generieren
              JsonArrayConst forecast = id(forcast_repository).as<JsonArrayConst>();
              
              // 4. Jedes Item mit den gekürzten Schlüsseln auslesen und loggen
              size_t idx = 0;
              for (JsonObjectConst hour_data : forecast) {
                int wday         = hour_data["wday"].is<int>() ? hour_data["wday"].as<int>() : 0;
                std::string hour = hour_data["hour"].is<std::string>() ? hour_data["hour"].as<std::string>() : "00:00";
                std::string cond = hour_data["cond"].is<std::string>() ? hour_data["cond"].as<std::string>() : "Unbekannt";
                float temp       = hour_data["temp"].is<float>() ? hour_data["temp"].as<float>() : 0.0;
                float prec       = hour_data["prec"].is<float>() ? hour_data["prec"].as<float>() : 0.0;
                
                // Kompakte tabellarische Zeile im ESPHome-Log ausgeben
                ESP_LOGD("weather", "[#%02zu] WDay: %d | Zeit: %s | Cond: %-15s | Temp: %5.1f°C | Regen: %3.0f%%", 
                          idx, wday, hour.c_str(), cond.c_str(), temp, prec);
                idx++;
              }

              ESP_LOGD("weather", "--- Ende Wetter-Forecast ---");

  - interval: 30sec
    startup_delay: 10sec
    then:
      - lambda: |-
          static const char* weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
         
          JsonArrayConst forecast = id(forcast_repository).as<JsonArrayConst>();

          static size_t current_hourly_index = 0;
          if (current_hourly_index >= forecast.size()) { current_hourly_index = 0; }

          JsonObjectConst hour_data = forecast[current_hourly_index].as<JsonObjectConst>();

          int wday = hour_data["wday"].as<int>();
          int today_wday = id(esptime).now().day_of_week - 1; 

          // Differenz der Wochentage berechnen (unter Berücksichtigung des Wochenwechsels)
          int diff_days = (wday - today_wday + 7) % 7;

          std::string day_str = "";
          if (diff_days == 0) {
            day_str = "Heute";
          } else if (diff_days == 1) {
            day_str = "Morgen";
          } else {
            day_str = weekdays[wday];
          }

          std::string hour_str = hour_data["hour"].as<std::string>();
          float temp = hour_data["temp"].as<float>();
          float prec = hour_data["prec"].as<float>();
          
          ESP_LOGD(__FILE__, "%s %s", day_str.c_str(), hour_str.c_str());
          ESP_LOGD(__FILE__, "%.1f°C | %.0f%%", temp, prec);

          current_hourly_index++;
                      