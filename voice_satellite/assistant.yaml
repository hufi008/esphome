# Voice Satellite 1 – Home Assistant Voice Assistant
#

micro_wake_word:
  id: my_micro_wake_word
  microphone:
    microphone: my_microphone
    bits_per_sample: 16
    channels: 0
    gain_factor: 4
  models:
    - model: okay_nabu
      id: my_wake_word_model
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: my_voice_assistant
  microphone:
    - microphone: my_microphone
      channels: 0
    - microphone: my_microphone
      channels: 1
  media_player: my_va_player
  micro_wake_word: my_micro_wake_word
  use_wake_word: false
  auto_gain: 16dBFS
  noise_suppression_level: 1
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_client_connected:
    - lambda: id(play_ui_sound).execute(id(my_snd_connect));
    - delay: 300ms
    - micro_wake_word.start:

  on_client_disconnected:
    - micro_wake_word.stop:
    - lambda: id(play_ui_sound).execute(id(my_snd_disconnect));

  on_listening:
    - lambda: |-
        id(play_ui_sound).execute(id(my_snd_wake));
        id(set_assist_mode).execute(static_cast<int>(AssistMode::LISTEN));

  on_stt_vad_end:
    - lambda: |-
        id(play_ui_sound).execute(id(my_snd_thinking));
        id(set_assist_mode).execute(static_cast<int>(AssistMode::THINK));

  on_tts_start:
    - lambda: |-
        id(play_ui_sound).execute(id(my_snd_success));
        id(set_assist_mode).execute(static_cast<int>(AssistMode::ANNOUNCE));

  on_end:
    - if:
        condition:
          not:
            micro_wake_word.is_running:
        then:
          - micro_wake_word.start:
    # Die kurze Nachlaufzeit lässt die letzte Assistant-Anzeige lesbar.
    - delay: 3s
    - lambda: |-
        id(set_assist_mode).execute(static_cast<int>(AssistMode::IDLE));

  on_error:
    - lambda: |-
        id(play_ui_sound).execute(id(my_snd_error));
        id(set_assist_mode).execute(static_cast<int>(AssistMode::IDLE));
        id(show_error).execute();
    - if:
        condition:
          not:
            micro_wake_word.is_running:
        then:
          - micro_wake_word.start:
