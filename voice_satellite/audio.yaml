# Voice Satellite 1 – Audio
#

audio:
  codecs:
    mp3:
    wav:

audio_file:
  - id: my_snd_boot
    file: "../sounds/boot.wav"
  - id: my_snd_click
    file: "../sounds/click.wav"
  - id: my_snd_wake
    file: "../sounds/wake.wav"
  - id: my_snd_thinking
    file: "../sounds/thinking.wav"
  - id: my_snd_error
    file: "../sounds/error.wav"
  - id: my_snd_success
    file: "../sounds/success.wav"
  - id: my_snd_connect
    file: "../sounds/api_connect.wav"
  - id: my_snd_disconnect
    file: "../sounds/api_disconnect.wav"
  - id: my_snd_timer_alarm
    file: "../sounds/timer_alarm.wav"

speaker:
  # Physischer Stereo-Ausgang
  - platform: i2s_audio
    id: my_hw_speaker
    i2s_audio_id: my_i2s_speaker
    dac_type: external
    i2s_dout_pin: ${spk_din_pin}
    bits_per_sample: 32bit
    sample_rate: 48000
    mclk_multiple: 256
    channel: stereo
    num_channels: 2
    buffer_duration: 200ms
    i2s_mode: primary

  # Gemeinsamer Stereo-Mixer mit zwei unabhängigen Quellen
  - platform: mixer
    id: my_audio_mixer
    output_speaker: my_hw_speaker
    num_channels: 2
    source_speakers:
      - id: my_va_sounds_mixer_input
        timeout: never
      - id: my_va_announcement_mixer_input
        timeout: never

  # UI-Signaltöne: 16 kHz mono -> Mixer / 48 kHz stereo
  - platform: resampler
    id: my_va_sounds_resampler
    output_speaker: my_va_sounds_mixer_input

  # HA-Sprachausgabe: 16 kHz mono -> Mixer / 48 kHz stereo
  - platform: resampler
    id: my_va_announcement_resampler
    output_speaker: my_va_announcement_mixer_input

media_player:
  - platform: speaker
    id: my_va_player
    internal: true
    buffer_size: 25000
    task_stack_in_psram: true

    media_pipeline:
      speaker: my_va_sounds_resampler
      sample_rate: 16000
      num_channels: 1
      format: NONE

    announcement_pipeline:
      speaker: my_va_announcement_resampler
      sample_rate: 16000
      num_channels: 1
      format: NONE

script:
  - id: play_ui_sound
    mode: parallel
    parameters:
      sound_file: "std::add_const_t<esphome::audio::AudioFile>*"
    then:
      - lambda: |-
          std::string file_name = "Unbekannt";
          for (const auto &nf : esphome::audio_file::get_named_audio_files()) {
            if (nf.file == sound_file) {
              file_name = nf.file_id;
              break;
            }
          }
          ESP_LOGD("UI-Sound", "play '%s'", file_name.c_str());
          id(my_va_player).play_file(sound_file, false, true);
