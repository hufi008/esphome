# Voice Satellite 1 – Audiofunktionen
#
# Audio-Hardware, Audio-Dateien und Audio-Pipeline sind in hardware.yaml
# deklariert. Hier liegen die Funktionen, die diese Komponenten verwenden.

script:
  - id: play_ui_sound
    mode: parallel
    parameters:
      sound_file: "std::add_const_t<esphome::audio::AudioFile>*"
    then:
      - lambda: |-
          std::string file_name = "Unbekannt";
          for (const auto &nf : esphome::audio_file::get_named_audio_files()) {
            if (nf.file == sound_file) {
              file_name = nf.file_id;
              break;
            }
          }
          ESP_LOGD("UI-Sound", "play '%s'", file_name.c_str());
          id(my_va_player).play_file(sound_file, false, true);
