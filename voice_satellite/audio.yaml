# Voice Satellite - Audio hardware and playback
#
# Minimal audio path:
#   INMP441 -> 32-bit I2S capture -> 16-bit mono MicrophoneSource
#   UI sounds + Voice Assistant TTS -> separate resamplers -> mixer -> MAX98357A

i2s_audio:
  # INMP441 input
  - id: i2s_bus_in
    i2s_lrclk_pin: ${mic_ws_pin}
    i2s_bclk_pin: ${mic_sck_pin}

  # MAX98357A output
  - id: i2s_bus_out
    i2s_lrclk_pin: ${spk_lrc_pin}
    i2s_bclk_pin: ${spk_bclk_pin}

microphone:
  - platform: i2s_audio
    id: hw_microphone
    i2s_audio_id: i2s_bus_in
    adc_type: external
    i2s_din_pin: ${mic_sd_pin}
    pdm: false
    channel: stereo
    bits_per_sample: 32bit
    sample_rate: 16000
    mclk_multiple: 256
    correct_dc_offset: true
    i2s_mode: primary

speaker:
  # Physical MAX98357A output. Keep the proven hardware format.
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_bus_out
    dac_type: external
    i2s_dout_pin: ${spk_din_pin}
    bits_per_sample: 32bit
    sample_rate: 48000
    mclk_multiple: 256
    channel: stereo
    num_channels: 2
    buffer_duration: 200ms
    i2s_mode: primary

  # Two independent sources: local UI sounds and Voice Assistant TTS.
  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    bits_per_sample: 32
    num_channels: 2
    source_speakers:
      - id: va_sounds_resampler
        timeout: never
      - id: va_announcement_resampler
        timeout: never

  # Local sound effects: 16 kHz mono -> output format.
  - platform: resampler
    id: va_sounds_speaker
    output_speaker: va_sounds_resampler
    sample_rate: 48000
    bits_per_sample: 32

  # Home Assistant speech: 16 kHz mono -> output format.
  - platform: resampler
    id: va_announcement_speaker
    output_speaker: va_announcement_resampler
    sample_rate: 48000
    bits_per_sample: 32

audio_file:
  - id: snd_boot
    file: "../sounds/boot.wav"
  - id: snd_error
    file: "../sounds/error.wav"
  - id: snd_success
    file: "../sounds/success.wav"
  - id: snd_wake
    file: "../sounds/wake.wav"
  - id: snd_thinking
    file: "../sounds/thinking.wav"
  - id: snd_click
    file: "../sounds/click.wav"
  - id: snd_single_click
    file: "../sounds/single_click.wav"
  - id: snd_double_click
    file: "../sounds/double_click.wav"
  - id: snd_long_click
    file: "../sounds/long_click.wav"
  - id: snd_connect
    file: "../sounds/api_connect.wav"
  - id: snd_disconnect
    file: "../sounds/api_disconnect.wav"

media_player:
  # Internal speaker media player: media pipeline is used only for local
  # feedback sounds; announcement pipeline carries Voice Assistant TTS.
  - platform: speaker
    id: va_player_id
    internal: true
    buffer_size: 25000
    task_stack_in_psram: true
    volume_initial: 70%
    volume_min: 0%
    volume_max: 100%

    media_pipeline:
      speaker: va_sounds_speaker
      sample_rate: 16000
      num_channels: 1
      format: WAV

    announcement_pipeline:
      speaker: va_announcement_speaker
      sample_rate: 16000
      num_channels: 1
      format: WAV
