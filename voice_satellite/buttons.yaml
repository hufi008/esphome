# Voice Satellite 1 – Tastenfunktionen
#
# Die GPIO-Binary-Sensoren sind in hardware.yaml deklariert.
# Diese Datei ergänzt ausschließlich die Reaktionen auf Tastendrücke.

binary_sensor:
  - id: !extend my_button_1
    on_press:
      - lambda: id(play_ui_sound).execute(const_cast<esphome::audio::AudioFile *>(id(my_snd_click)));
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
              else:
                - micro_wake_word.stop:
                - delay: 100ms
                - voice_assistant.start:

  - id: !extend my_button_2
    on_press:
      - lambda: id(play_ui_sound).execute(const_cast<esphome::audio::AudioFile *>(id(my_snd_click)));

  - id: !extend my_button_3
    on_press:
      - lambda: id(play_ui_sound).execute(const_cast<esphome::audio::AudioFile *>(id(my_snd_click)));

  - id: !extend my_button_4
    on_press:
      - lambda: id(play_ui_sound).execute(const_cast<esphome::audio::AudioFile *>(id(my_snd_click)));
