external_components:
  - source:
      type: local
      path: ../my_components
    components: [ speaker ]


######################### Configuration

substitutions:
  ### Pin-Belegung
  # Amp Max98357A
  spk_lrc_pin:   "GPIO11"   # LEFT / RIGHT CLOCK
  spk_bclk_pin:  "GPIO10"   # Bit CLOCK
  spk_din_pin:   "GPIO09"   # DATA OUT
  # spk_gain_pin:  100kΩ GND = 15dB, GND = 12dB, nix = 9dB, VCC = 6dB, 100kΩ VCC = 3DB
  # spk_sd_pin:    nix = (L+R)/2, 370kΩ VCC = Rechts, 100kΩ = Links
  # spk_gnd_pin: GND
  # spk_vin_pin: 5V

  # Microphone INMP441
  mic_ws_pin:    "GPIO04"   # WORD SELECT
  mic_sck_pin:   "GPIO05"   # SERIAL CLOCK
  mic_sd_pin:    "GPIO06"   # SERIAL DATA
  # mic_vdd_pin:   3V3
  # mic_gnd_PIN:   GND
  # mic_l/r_pin: GND = Links, VCC = Rechts

  # LED Strip WS2812
  led_din_pin:   "GPIO08"    # DATA IN
  led_count:     "10"        # Number of LEDs
  # VCC: 5V
  # din mit Levelshifter auf 5V heben oder mit 100Ω Widerstand an 3V3 lassen (bei kurzen Strip-Längen)

  # I2C Bus
  i2c_sda_pin:   "GPIO01"    # SERIAL DATA
  i2c_scl_pin:   "GPIO02"    # SERIAL CLOCK
  # i2c_gnd_pin:  GND
  # i2c_vin_pin:  3V3
  
  # Climate
  # der BME/HTU kommt onboard und gibt damit die Reihenfolge von I2C VCC und GND vor.
  # Display OLED SSD1306
  # Beim SSD1306 sind die Versorgungsleitungen umgekeht!!!
  ssd_addr:      "0x3C"
  # ssd_vcc_pin: i2c_vin_pin
  # sdd_gnd_pin: i2s_gnd_pin

  # Button TTP221
  btn_1_pin:     "GPIO15"
  btn_2_pin:     "GPIO16"
  btn_3_pin:     "GPIO17"
  btn_4_pin:     "GPIO18"
  # btn_vcc_pin:   3V3, sonst schrottest du den ESP
  # btn_gnd_pin:   GND

time:
  - platform: homeassistant
    id: esptime

deep_sleep:
  id: deep_sleep_id
  wakeup_pin: 
    number: ${btn_1_pin}
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Shutdown"
    on_press:
      then:
        # Display ausschalten
        - lambda: 'id(display_id).turn_off();'
        - media_player.mute: va_player_id
        - light.turn_off: ledstrip_id
        - wait_until:
              light.is_off: ledstrip_id
        - delay: 100ms
        - deep_sleep.enter: deep_sleep_id

text:
  - platform: template
    name: "Idle Farbe HEX"
    id: idle_color_hex
    optimistic: false
    min_length: 6
    max_length: 7
    initial_value: "000000"
    restore_value: true
    mode: text
    on_value: 
      then:
        - lambda: |-
            unsigned long hex_value = std::strtoul(x.c_str(), nullptr, 16);
                        
            uint8_t r = (hex_value >> 16) & 0xFF;
            uint8_t g = (hex_value >> 8)  & 0xFF;
            uint8_t b = hex_value         & 0xFF;
            
            id(idle_color) = esphome::Color(r, g, b);
            ESP_LOGD("init", "idle_color: RGB: (%d, %d, %d)", r, g, b);
    set_action:
      then:
        - lambda: |-
            std::string hex = x;
            
            if (!hex.empty() && hex[0] == '#') { hex = hex.substr(1); }
            if (hex.length() != 6) {
              id(idle_color_hex).status_set_error(LOG_STR("Use XXXXXX for HEX-Color"));
              return;
            }
            for (char c : hex) { if (!isxdigit(c)) { 
                id(idle_color_hex).status_set_error(LOG_STR("Use XXXXXX for HEX-Color"));
                return; 
            } }
            
            // Eingabe ist valide -> Zustand akzeptieren
            id(idle_color_hex).status_clear_error();
            id(idle_color_hex).publish_state(hex);

binary_sensor:
  - platform: gpio
    id: btn_1_id
    pin:
      number: ${btn_1_pin}
      allow_other_uses: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    id: btn_2_id
    pin:
      number: ${btn_2_pin}
      allow_other_uses: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    id: btn_3_id
    pin:
      number: ${btn_3_pin}
      allow_other_uses: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    id: btn_4_id
    pin:
      number: ${btn_4_pin}
      allow_other_uses: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

light:
  - platform: esp32_rmt_led_strip
    id: ledstrip_id
    name: "LED Status"
    chipset: WS2812
    pin: ${led_din_pin}
    num_leds: ${led_count}
    channel_colors: GRB
    restore_mode: RESTORE_AND_ON
    icon: "mdi:led-strip"
    use_dma: true
    rmt_symbols: 192
    use_psram: true
    effects:
      - addressable_scan:
          name: Scan slow
          move_interval: 0.2s
          scan_width: 3
      - addressable_rainbow:
          speed: 8
          width: 12
          name: Rainbow
      - addressable_twinkle:
          name: Twinkle
          progress_interval: 4ms
          twinkle_probability: 5%
      - addressable_color_wipe:
          name: Color Wipe
          add_led_interval: 0.1s

i2c:
  - id: i2c_bus
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    scan: true
    frequency: 400kHz

sensor:
  # Wifi Informationen
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal dB"
    update_interval: 30s
  - platform: template
    id: wifi_channel
    name: "Channel"
    icon: "mdi:wifi-marker"
    entity_category: diagnostic
    lambda: |-
      if (id(wifi_id).is_connected())
        return id(wifi_id).get_wifi_channel();
      return -1;    
    update_interval: 30s      

  - platform: template
    name: "Mic Left Peak"
    id: sensor_mic_left_peak
    unit_of_measurement: "amp"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "Mic Right Peak"
    id: sensor_mic_right_peak
    unit_of_measurement: "amp"
    accuracy_decimals: 0
    update_interval: never

  # - platform: template
  #   name: "Announcement-Puffer Füllstand"
  #   state_class: measurement
  #   accuracy_decimals: 2
  #   update_interval: 1s
  #   lambda: |-
  #     return id(va_player_id).get_announcement_fill_level();
