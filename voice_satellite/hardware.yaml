    id: media_player_buffer_level
    name: "Media-Puffer Füllstand"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      return id(media_player_id).get_media_fill_level();

text_sensor:
  # Wifi Informationen
  - platform: wifi_info
    id: wifi_info
    ip_address:
      name: "IP"
      icon: "mdi:wifi"
    ssid:
      name: "SSID"
      icon: "mdi:wifi"
    bssid:
      name: "BSSID"
      icon: "mdi:wifi"
    mac_address:
      name: "Mac"
      icon: "mdi:wifi"
    dns_address:
      name: "DNS"
      icon: "mdi:wifi"
    power_save_mode:
      name: "Power Save"
      icon: "mdi:wifi"
    # scan_results:
    #   name: "Scan"
    #   icon: "mdi:wifi"

  # Sender
  - platform: homeassistant
    id: media_content_id
    entity_id: ${media_player_entity_id}_2
    attribute: media_content_id
    on_value:
      then:
        - logger.log:
            format: "media_content_id='%s'"
            args: [ id(media_content_id).state.c_str() ]
        - script.execute: update_data            
  # Titel des aktuellen Tracks
  - platform: homeassistant
    id: media_title
    entity_id: ${media_player_entity_id}_2
    attribute: media_title
    on_value:
      then:
        - logger.log:
            format: "media_title='%s'"
            args: [ id(media_title).state.c_str() ]
        - script.execute: update_data            
  # Interpret
  - platform: homeassistant
    id: media_artist
    entity_id: ${media_player_entity_id}_2
    attribute: media_artist
    on_value:
      then:
        - logger.log:
            format: "media_artist='%s'"
            args: [ id(media_artist).state.c_str() ]
        - script.execute: update_data
  # Albumname
  - platform: homeassistant
    id: media_album_name
    entity_id: ${media_player_entity_id}_2
    attribute: media_album_name
    on_value:
      then:
        - logger.log:
            format: "media_album_name='%s'"
            args: [ id(media_album_name).state.c_str() ]
        - script.execute: update_data

# Icons - look in https://pictogrammers.com/library/mdi/

i2s_audio:
  # Eingang (Stereo INMP441)
  - id: i2s_bus_in
    i2s_lrclk_pin: ${mic_ws_pin}
    i2s_bclk_pin: ${mic_sck_pin}

  # Ausgang (Stereo MAX98357)
  - id: i2s_bus_out
    i2s_lrclk_pin: ${spk_lrc_pin}
    i2s_bclk_pin: ${spk_bclk_pin}
   
# Microphone INMP441

microphone:
  - platform: i2s_audio
    id: hw_microphone
    i2s_audio_id: i2s_bus_in
    adc_type: external
    i2s_din_pin: ${mic_sd_pin}
    pdm: false
    correct_dc_offset: true
    bits_per_sample: 32bit
    sample_rate: 16000
    mclk_multiple: 256
    channel: stereo
    num_channels: 2
    i2s_mode: primary
    on_data:
      - lambda: |-
          if (x.empty()) return;

          size_t total_bytes = x.size();
          int32_t max_l = 0;
          int32_t max_r = 0;

          // Ein kompletter Stereo-Frame (Links 4 Bytes + Rechts 4 Bytes) benötigt genau 8 Bytes.
          for (size_t i = 0; i + 7 < total_bytes; i += 8) {
            
            // Ihr funktionierender Little-Endian-Zusammenbau für den LINKEN Kanal
            int32_t l_val = (int32_t)((x[i + 3] << 24) | (x[i + 2] << 16) | (x[i + 1] << 8) | x[i]);
            
            // Ihr funktionierender Little-Endian-Zusammenbau für den RECHTEN Kanal
            int32_t r_val = (int32_t)((x[i + 7] << 24) | (x[i + 6] << 16) | (x[i + 5] << 8) | x[i + 4]);

            // Absolutwerte für die Peak-Messung
            int32_t abs_l = std::abs(l_val);
            int32_t abs_r = std::abs(r_val);

            if (abs_l > max_l) max_l = abs_l;
            if (abs_r > max_r) max_r = abs_r;
          }

          // Skalierung auf den 16-Bit-Bereich (>> 16) wie in Ihrem Original
          int16_t peak_l_16 = (int16_t)(max_l >> 16);
          int16_t peak_r_16 = (int16_t)(max_r >> 16);

          // Zuweisung an Ihre aktuellen globalen Peak-Speicher
          if (peak_l_16 > id(mic_peak_left))  id(mic_peak_left) = peak_l_16;
          if (peak_r_16 > id(mic_peak_right)) id(mic_peak_right) = peak_r_16;

