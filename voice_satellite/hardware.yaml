    type: binary
    resize: 16x16
  - platform: file
    file: mdi:wifi-strength-4
    id: my_symbol_wifi_4
    type: binary
    resize: 16x16
  - platform: file
    file: mdi:home-assistant
    id: my_symbol_api
    type: binary
    resize: 16x16

