# SSD1306 – die eigentliche Zeichenfunktion wird in info_screen.yaml ergänzt
display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    id: my_display
    i2c_id: my_i2c_display
    address: ${ssd_addr}
    update_interval: never
