audio:
  codecs:
    mp3:
    wav:

# Amplifier MAX 98357

speaker:
  # A) Der physische I2S Hardware-Lautsprecher (Ausgang)
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_bus_out
    dac_type: external
    i2s_dout_pin: ${spk_din_pin}
    bits_per_sample: 32bit
    sample_rate: 48000
    mclk_multiple: 256
    channel: stereo
    num_channels: 2
    buffer_duration: 200ms
    i2s_mode: primary

  # B) Der digitale Audio-Mixer
  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 2
    source_speakers:
      - id: va_sounds_resampler
        timeout: never
      - id: va_announcement_resampler
        timeout: never
      - id: mp_media_resampler
        timeout: never
      - id: mp_announcement_resampler
        timeout: never

  # C) Virtueller Resampler für UI-Sounds
  - platform: resampler
    id: va_sounds_speaker
    output_speaker: va_sounds_resampler

  # D) Virtueller Resampler für Durchsagen (Voice Assistant)
  - platform: resampler
    id: va_announcement_speaker
    output_speaker: va_announcement_resampler

  # E) Virtueller Resampler für Musik-Medien
  - platform: resampler
    id: mp_media_speaker
    output_speaker: mp_media_resampler

  # F) Virtueller Resampler für Durchsagen (Home Assistant)
  - platform: resampler
    id: mp_announcement_speaker
    output_speaker: mp_announcement_resampler

media_player:
  - platform: speaker
    id: media_player_id
    name: "Audio Player"
    icon: "mdi:speaker-message"
    buffer_size: 65536
    task_stack_in_psram: true
    volume_initial: 50%
    volume_increment: 5%
    volume_min: 0%
    volume_max: 100%


    media_pipeline:
      speaker: mp_media_speaker
      num_channels: 2
      sample_rate: 48000
      format: NONE      
    announcement_pipeline:
      speaker: mp_announcement_speaker
      sample_rate: 16000
      num_channels: 1
      format: WAV

    on_idle: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_idle");
    on_announcement: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_announcemant");
    on_pause: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_pause");
    on_play: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_play");
    on_turn_on: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_turn_on");
    on_turn_off: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_turn_off");
    on_mute: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_mute");
    on_unmute: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_unmute");
    on_volume: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_volume");
    on_state: 
      - lambda: |-
          ESP_LOGD(__FILE__, "on_media_player_state: %s", media_player::media_player_state_to_string(id(media_player_id).state));
                                                                        
  - platform: speaker
    id: va_player_id
    buffer_size: 25000
    task_stack_in_psram: true
    internal: true

    media_pipeline:
      speaker: va_sounds_speaker
