# Voice Satellite – Info-Seiten: HTU21D
# Dieses Paket ist alternativ zu info_bme.yaml.

sensor:
  - platform: htu21d
    id: my_htu21
    update_interval: 60s
    address: 0x40
    temperature:
      id: my_room_temp
      name: "Temperature"
      device_class: temperature
      state_class: measurement
    humidity:
      id: my_room_hum
      name: "Humidity"
      device_class: humidity
      state_class: measurement
    heater:
      id: my_room_heater
      name: "Heater"
      state_class: measurement

script:
  - id: my_update_temp
    then:
      - lambda: |-
          ESP_LOGD("info_htu21", "update_temp");
          id(my_display_icon) = &id(my_icon_temperature);
          id(my_display_message1) = str_sprintf("%.1f °C", id(my_room_temp).state);
          id(my_display_message2).clear();
          id(my_display_message3).clear();

  - id: my_update_hum
    then:
      - lambda: |-
          ESP_LOGD("info_htu21", "update_hum");
          id(my_display_icon) = &id(my_icon_humidity);
          id(my_display_message1) = str_sprintf("%.0f%% rF", id(my_room_hum).state);
          id(my_display_message2).clear();
          id(my_display_message3).clear();

esphome:
  on_boot:
    - priority: 250
      then:
        - lambda: |-
            voice_satellite::register_info_screen(
                id(my_idle_updater_scripts), []() { id(my_update_temp).execute(); });
            voice_satellite::register_info_screen(
                id(my_idle_updater_scripts), []() { id(my_update_hum).execute(); });
