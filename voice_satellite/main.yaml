# voice-satellite/main.yaml
######################### Configuration

substitutions:
  # Display Modes
  CONTENT_BOOT:     0
  CONTENT_IDLE:     1
  CONTENT_PLAY:     2
  CONTENT_PAUSE:    3
  CONTENT_LISTEN:   4
  CONTENT_THINK:    5
  CONTENT_ANNOUNCE: 6
  CONTENT_SHUTDOWN: 7

  OVERLAY_NONE:     0
  OVERLAY_VOLUME:   1
  OVERLAY_ERROR:    2
  OVERLAY_ALARM:    3

esphome:
  project:
    name: "hufi.smart_speaker"
    version: "0.9.1"
  on_boot:
    - priority: 250
      then:
        - lambda: |-
            id(set_content_mode).execute(${CONTENT_BOOT});
            id(is_booting) = true;
    - priority: 200
      then:
        - lambda: |-
            id(play_ui_sound).execute(snd_boot);
 
json:


# Enable Home Assistant API
api:
  on_client_connected:
    - lambda: |-
        ESP_LOGI(__FILE__, "on_api_client_connected");
        id(play_ui_sound).execute(snd_connect);
        id(update_data).execute();
  on_client_disconnected:
    - lambda: |-
        ESP_LOGI(__FILE__, "on_api_client_disconnected");
        id(play_ui_sound).execute(snd_disconnect);
        id(update_data).execute();

wifi:
  on_connect:
    - lambda: |-
        ESP_LOGI(__FILE__, "on_wifi_connect");
        id(play_ui_sound).execute(snd_connect);
        id(update_data).execute();
  on_disconnect:
    - lambda: |-
        ESP_LOGI(__FILE__, "on_wifi_disconnect");
        id(play_ui_sound).execute(snd_disconnect);
        id(update_data).execute();

globals:
  - id: is_ducking
    type: bool
    initial_value: "false"
    
  - id: content_mode
    type: int
    initial_value: "0"    
  - id: overlay_mode
    type: int
    initial_value: "0"
  - id: content_mode_text
    type: std::vector<std::string>
    initial_value: '{"BOOT", "IDLE", "PLAY", "PAUSE", "LISTEN", "THINK", "ANNOUNCE", "SHUTDOWN"}'  
  - id: overlay_mode_text
    type: std::vector<std::string>
    initial_value: '{"NONE", "VOLUME", "ERROR", "ALARM"}'  

  - id: command_message
    type: std::string
    initial_value: "\"command\""
  - id: intent_message
    type: std::string
    initial_value: "\"intent\""
  - id: announce_message
    type: std::string
    initial_value: "\"announce\""
  - id: url_message
    type: std::string
    initial_value: "\"url\""
  - id: alarm_message
    type: std::string
    initial_value: "\"alarm\""
  - id: error_code
    type: std::string
    initial_value: "\"code\""
  - id: error_message
    type: std::string
    initial_value: "\"error\""

########################## Components

time:
  - id: !extend esptime
    on_time_sync:
      - lambda: |-
          ESP_LOGI(__FILE__, "on_time_time_sync");

          if (id(is_booting)) {        
            id(is_booting) = false;
            id(set_content_mode).execute(${CONTENT_IDLE});
          }

number:
  - platform: template
    id: content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 7
    step: 1    
    initial_value: "${CONTENT_BOOT}"
    optimistic: True
    set_action:
      - lambda: |-
          id(set_content_mode).execute(x);
  - platform: template
    id: overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: "${OVERLAY_NONE}"
    set_action:
      - lambda: |-
          id(set_overlay_mode).execute(x);

binary_sensor:
  - id: !extend btn_1_id
    on_press:
      - lambda: |-
          ESP_LOGD(__FILE__, "on_btn_1_press");
          id(play_ui_sound).execute(snd_click);
    on_multi_click:
     # --- EINFACHKLICK ---
      - timing:
          - ON for at most 0.5s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_1_single_click");
              id(play_ui_sound).execute(snd_single_click);
          - lambda: |-
              ESP_LOGD(__FILE__, "voice_assist control by button");
          - if:
              condition:
                lambda: 'return id(va).is_running();'
              then:
                - lambda: 'ESP_LOGI(__FILE__, "voice_assist stop");'
                - lambda: 'id(play_ui_sound).execute(snd_success);'
                - voice_assistant.stop:
              else:
                - lambda: 'ESP_LOGI(__FILE__, "voice_assist start");'
                - lambda: 'id(play_ui_sound).execute(snd_wake);'
                - voice_assistant.start:
                    wake_word: "Okay Nabu"
      # --- LANGER KLICK ---
      - timing:
          - ON for at least 1.0s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_1_long_click");
              id(play_ui_sound).execute(snd_long_click);
          - if:
              condition:
                - media_player.is_off: media_player_id
              then:
                - media_player.turn_on: media_player_id
              else:
                - media_player.turn_off: media_player_id

  - id: !extend btn_2_id
    on_press:
      - lambda: |-
          ESP_LOGD(__FILE__, "on_btn_2_press");
          id(play_ui_sound).execute(snd_click);
    on_multi_click:
     # --- EINFACHKLICK ---
      - timing:
          - ON for at most 0.5s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_2_single_click");
              id(play_ui_sound).execute(snd_single_click);
          - homeassistant.action:
              action: media_player.media_play_pause
              data:
                entity_id: ${media_player_entity_id}_2
              on_success:
                - lambda: 'ESP_LOGI(__FILE__, "media_player play_pause OK");'
              on_error:
                - lambda: 'ESP_LOGI(__FILE__, "media_player play_pause ERROR");'

      # --- LANGER KLICK ---
      - timing:
          - ON for at least 1.0s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_2_long_click");
              id(play_ui_sound).execute(snd_long_click);
          - homeassistant.service:
              service: media_player.media_stop
              data:
                entity_id: ${media_player_entity_id}_2              
              on_success:
                - lambda: 'ESP_LOGI(__FILE__, "media_player stop OK");'
              on_error:
                - lambda: 'ESP_LOGI(__FILE__, "media_player stop ERROR");'

  - id: !extend btn_3_id
    on_press:
      - lambda: |-
          ESP_LOGD(__FILE__, "on_btn_3_press");
          id(play_ui_sound).execute(snd_click);
    on_multi_click:
     # --- EINFACHKLICK ---
      - timing:
          - ON for at most 0.5s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_3_single_click");
              id(play_ui_sound).execute(snd_single_click);
          - lambda: 'ESP_LOGI(__FILE__, "media_player VOL-");'
          - media_player.volume_down: media_player_id

      # --- LANGER KLICK ---
      - timing:
          - ON for at least 1.0s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_3_long_click");
              id(play_ui_sound).execute(snd_long_click);
          - if:
              condition:
                media_player.is_muted: media_player_id
              then:
                - lambda: 'ESP_LOGI(__FILE__, "media_player UNMUTE");'
                - media_player.unmute: media_player_id
              else:
                - lambda: 'ESP_LOGI(__FILE__, "media_player MUTE");'
                - media_player.mute: media_player_id
          - script.execute: update_data

  - id: !extend btn_4_id
    on_press:
      - lambda: |-
          ESP_LOGD(__FILE__, "on_btn_4_press");
          id(play_ui_sound).execute(snd_click);
    on_multi_click:
     # --- EINFACHKLICK ---
      - timing:
          - ON for at most 0.5s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_4_single_click");
              id(play_ui_sound).execute(snd_single_click);
          - lambda: 'ESP_LOGI(__FILE__, "media_player VOL+");'
          - media_player.volume_up: media_player_id

      # --- LANGER KLICK ---
      - timing:
          - ON for at least 1.0s
        then:
          - lambda: |-
              ESP_LOGD(__FILE__, "on_btn_4_long_click");
              id(play_ui_sound).execute(snd_long_click);
          - lambda: |-
              if (id(hw_microphone)->get_mute_state()) {
                ESP_LOGI(__FILE__, "microphone UNMUTE");
                id(hw_microphone).set_mute_state(false);
                id(mww).start();                 
              } else {
                ESP_LOGI(__FILE__, "microphone MUTE");
                id(hw_microphone).set_mute_state(true);
                id(mww).stop();                 
              }
          - script.execute: update_data


light:
  - id: !extend ledstrip_id
    effects:
      # Content Mode Effects
      # Effect CONTENT_BOOT
      - addressable_lambda:
          name: "Effect CONTENT_0" # BOOT
          update_interval: 50ms
          lambda: |-
            // Definiert die Geschwindigkeit und zwingt den Wert in eine Endlosschleife von 0 bis 255
            int wave_time = (millis() / 12) % 256;

            for (int i = 0; i < it.size(); i++) {
              // Berechnet den Helligkeitsverlauf basierend auf der LED-Position
              int v = wave_time + abs(i - it.size() / 2.0f) * 16;
              
              // Nutzt Modulo, damit die Welle endlos von außen nach innen "durchläuft"
              v = v % 256; 
              
              it[i] = Color(0, 0, v);
            }

      # Effect CONTENT_IDLE
      - addressable_lambda:
          name: "Effect CONTENT_1" # IDLE
          update_interval: 16ms
          lambda: |-
            auto color = id(idle_color);

            for (int i = 0; i < it.size(); i++) {
              it[i] = color;
            }

      # Effect CONTENT_PLAY
      - addressable_rainbow:
          name: "Effect CONTENT_2" # PLAY
          speed: 16
          width: 12
          
      # Effect CONTENT_PAUSE
      - addressable_lambda:
          name: "Effect CONTENT_3" # PAUSE
          update_interval: 50ms
          lambda: |-
            float t = (sin(millis() / 500.0f) + 1) / 2;  // langsames Atmen
            uint8_t y = 60 + (uint8_t)(t * 120);

            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(y, y, 0);  // Gelb
            }
      # Effect CONTENT_LISTEN
      - addressable_lambda:
          name: "Effect CONTENT_4"  # LISTEN
          update_interval: 20ms
          lambda: |-
            const int count = it.size();
            const float t = millis() / 250.0f;   // Puls-Geschwindigkeit
            const float pulse = (sin(t) + 1.0f) * 0.5f;  // 0..1
      
            const float center = (count - 1) / 2.0f;     // Mitte der LEDs
      
            for (int i = 0; i < count; i++) {
              float d = fabsf(i - center);               // Abstand zur Mitte
              float falloff = 1.0f - (d / center);       // 1.0 in der Mitte, 0.0 außen
              if (falloff < 0.0f) falloff = 0.0f;
      
              int brightness = int( falloff * pulse * 255 );
      
              // Farbe: Cyan-Blau wie dein Listening-Effekt
              it[i] = Color(0, 64, brightness);
            }
      # Effect CONTENT_THINK
      - addressable_lambda:
          name: "Effect CONTENT_5" # THINK
          update_interval: 20ms
          lambda: |-
            int pos = (millis() / 40) % it.size();
            pos = it.size() - pos;
            for (int i = 0; i < it.size(); i++) {
              int d = abs(i - pos);
              int b = max(0, 150 - d * 40);
              it[i] = Color(b, 0, b);
            }
      # Effect CONTENT_ANNOUNCE
      - addressable_lambda:
          name: "Effect CONTENT_6"
          update_interval: 20ms
          lambda: |-
            const int count = it.size();

            // Position des Scans (läuft von 0 bis count-1)
            int pos = (millis() / 40) % count;

            for (int i = 0; i < count; i++) {
              // Abstand zur Scan-Position
              int d = abs(i - pos);

              // Helligkeit abhängig vom Abstand (weicher Abfall)
              int b = max(0, 120 - d * 40);  // 120 = hell, 40 = Abfall pro LED

              it[i] = Color(b+75, b, b+75);  // Cyan-Blau
            }
      
      
      # Overlay Mode Effects
      # Effect OVERLAY_NONE
      - addressable_lambda:
          name: "Effect OVERLAY_0"
          update_interval: 250ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0,0,0);
            }
      # Effect OVERLAY_VOLUME
      - addressable_lambda:
          name: "Effect OVERLAY_1"
          update_interval: 20ms
          lambda: |-
            if (id(media_player_id).is_muted()) {
              float t = (millis() % 800) / 800.0f;
              float fade = (sin(t * 2 * 3.14159f) + 1) / 2;  // 0–1
              for (int i = 0; i < it.size(); i++) {
                it[i] = Color(0, 0, int(128 * fade));
              }
              return;
            }

            float index = id(media_player_id).volume * it.size();

            for (int i = 0; i < it.size(); i++) {
              float fade = std::clamp(index - i, 0.2f, 1.0f);
              // falschrum eingebaut
              it[i] = Color(0, int(127*fade), int(255*fade));
            }
      # Effect OVERLAY_ERROR
      - addressable_lambda:
          name: "Effect OVERLAY_2"
          update_interval: 40ms
          lambda: |-
            float t = (millis() % 800) / 800.0f;
            float b = (sin(t * 2 * 3.14159f) + 1) / 2;  // 0–1
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(int(200 * b), 0, 0);
            }
      # Effect CONTENT_ALARM
      - addressable_lambda:
          name: "Effect OVERLAY_3"
          update_interval: 50ms
          lambda: |-
            float t = (sin(millis() / 250.0f) + 1) / 2;  // langsames Atmen
            uint8_t y = 60 + (uint8_t)(t * 120);

            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, y, 0);  // Rot
            }
      # Effect OVERLAY_ANNOUNCE
      - addressable_lambda:
          name: "Effect OVERLAY_4"
          update_interval: 20ms
          lambda: |-
            const int count = it.size();

            // Position des Scans (läuft von 0 bis count-1)
            int pos = (millis() / 40) % count;

            for (int i = 0; i < count; i++) {
              // Abstand zur Scan-Position
              int d = abs(i - pos);

              // Helligkeit abhängig vom Abstand (weicher Abfall)
              int b = max(0, 120 - d * 40);  // 120 = hell, 40 = Abfall pro LED

              it[i] = Color(b+75, b, b+75);  // Cyan-Blau
            }

