# Voice Satellite 1 – Mode-Steuerung
#
# Die drei Modi werden ausschließlich über ihre Setter-Scripte geändert.
# Die Setter synchronisieren die HA-Debug-Number und aktualisieren Display und LEDs.

globals:
  - id: my_content_mode
    type: ContentMode
    restore_value: no
    initial_value: 'ContentMode::BOOT'

  - id: my_assist_mode
    type: AssistMode
    restore_value: no
    initial_value: 'AssistMode::IDLE'

  - id: my_overlay_mode
    type: OverlayMode
    restore_value: no
    initial_value: 'OverlayMode::NONE'

number:
  - platform: template
    id: my_content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 4
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          ContentMode mode;
          if (content_mode_from_number(x, mode)) {
            id(set_content_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid content mode number: %.1f", x);
          }

  - platform: template
    id: my_assist_mode_select
    name: "Assist Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          AssistMode mode;
          if (assist_mode_from_number(x, mode)) {
            id(set_assist_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid assist mode number: %.1f", x);
          }

  - platform: template
    id: my_overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          OverlayMode mode;
          if (overlay_mode_from_number(x, mode)) {
            id(set_overlay_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid overlay mode number: %.1f", x);
          }

script:
  - id: set_content_mode
    parameters:
      mode: ContentMode
    then:
      - lambda: |-
          int mode_value;
          if (!content_mode_to_number(mode, mode_value)) {
            ESP_LOGW("modes", "Invalid content mode");
            return;
          }
          id(my_content_mode) = mode;
          id(my_content_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "content_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  - id: set_assist_mode
    parameters:
      mode: AssistMode
    then:
      - lambda: |-
          int mode_value;
          if (!assist_mode_to_number(mode, mode_value)) {
            ESP_LOGW("modes", "Invalid assist mode");
            return;
          }
          id(my_assist_mode) = mode;
          id(my_assist_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "assist_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  - id: set_overlay_mode
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          int mode_value;
          if (!overlay_mode_to_number(mode, mode_value)) {
            ESP_LOGW("modes", "Invalid overlay mode");
            return;
          }
          id(my_overlay_mode) = mode;
          id(my_overlay_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "overlay_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  # Generisches, zeitlich begrenztes Overlay (z. B. Lautstärke).
  - id: show_overlay
    mode: restart
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          id(set_overlay_mode).execute(mode);
      - delay: 5s
      - lambda: |-
          if (id(my_overlay_mode) == mode) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }

  - id: show_error
    mode: restart
    then:
      - lambda: |-
          id(show_overlay).execute(OverlayMode::ERROR);

  - id: show_alarm
    mode: restart
    then:
      - lambda: |-
          id(set_overlay_mode).execute(OverlayMode::ALARM);
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          if (id(my_overlay_mode) == OverlayMode::ALARM) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }
