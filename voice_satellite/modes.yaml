# Voice Satellite 1 – Mode-Steuerung
#
# Die drei Modi werden ausschließlich über ihre Setter-Scripte geändert.
# Die Setter synchronisieren die HA-Debug-Number und aktualisieren die Anzeige.

globals:
  - id: my_content_mode
    type: ContentMode
    restore_value: no
    initial_value: 'CONTENT_BOOT'

  - id: my_assist_mode
    type: AssistMode
    restore_value: no
    initial_value: 'ASSIST_IDLE'

  - id: my_overlay_mode
    type: OverlayMode
    restore_value: no
    initial_value: 'OVERLAY_NONE'

number:
  - platform: template
    id: my_content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 4
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_content_mode).execute(x);

  - platform: template
    id: my_assist_mode_select
    name: "Assist Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_assist_mode).execute(x);

  - platform: template
    id: my_overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_overlay_mode).execute(x);

script:
  - id: set_content_mode
    parameters:
      mode: float
    then:
      - lambda: |-
          if (mode == CONTENT_BOOT) {
            id(my_content_mode) = CONTENT_BOOT;
          } else if (mode == CONTENT_IDLE) {
            id(my_content_mode) = CONTENT_IDLE;
          } else if (mode == CONTENT_PLAY) {
            id(my_content_mode) = CONTENT_PLAY;
          } else if (mode == CONTENT_PAUSE) {
            id(my_content_mode) = CONTENT_PAUSE;
          } else if (mode == CONTENT_SHUTDOWN) {
            id(my_content_mode) = CONTENT_SHUTDOWN;
          } else {
            ESP_LOGW("modes", "Invalid content mode: %.2f", mode);
            return;
          }
          id(my_content_mode_select).publish_state(mode);
          ESP_LOGD("modes", "content_mode=%.0f", mode);
      - script.execute: update_display

  - id: set_assist_mode
    parameters:
      mode: float
    then:
      - lambda: |-
          if (mode == ASSIST_IDLE) {
            id(my_assist_mode) = ASSIST_IDLE;
          } else if (mode == ASSIST_LISTEN) {
            id(my_assist_mode) = ASSIST_LISTEN;
          } else if (mode == ASSIST_THINK) {
            id(my_assist_mode) = ASSIST_THINK;
          } else if (mode == ASSIST_ANNOUNCE) {
            id(my_assist_mode) = ASSIST_ANNOUNCE;
          } else {
            ESP_LOGW("modes", "Invalid assist mode: %.2f", mode);
            return;
          }
          id(my_assist_mode_select).publish_state(mode);
          ESP_LOGD("modes", "assist_mode=%.0f", mode);
      - script.execute: update_display

  - id: set_overlay_mode
    parameters:
      mode: float
    then:
      - lambda: |-
          if (mode == OVERLAY_NONE) {
            id(my_overlay_mode) = OVERLAY_NONE;
          } else if (mode == OVERLAY_VOLUME) {
            id(my_overlay_mode) = OVERLAY_VOLUME;
          } else if (mode == OVERLAY_ERROR) {
            id(my_overlay_mode) = OVERLAY_ERROR;
          } else if (mode == OVERLAY_ALARM) {
            id(my_overlay_mode) = OVERLAY_ALARM;
          } else {
            ESP_LOGW("modes", "Invalid overlay mode: %.2f", mode);
            return;
          }
          id(my_overlay_mode_select).publish_state(mode);
          ESP_LOGD("modes", "overlay_mode=%.0f", mode);
      - script.execute: update_display

  # Generisches, zeitlich begrenztes Overlay (z. B. Lautstärke).
  - id: show_overlay
    mode: restart
    parameters:
      mode: float
    then:
      - lambda: |-
          id(set_overlay_mode).execute(mode);
      - delay: 5s
      - lambda: |-
          if (id(my_overlay_mode) == mode) {
            id(set_overlay_mode).execute(OVERLAY_NONE);
          }

  - id: show_error
    mode: restart
    then:
      - lambda: |-
          id(show_overlay).execute(OVERLAY_ERROR);

  - id: show_alarm
    mode: restart
    then:
      - lambda: |-
          id(set_overlay_mode).execute(OVERLAY_ALARM);
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          if (id(my_overlay_mode) == OVERLAY_ALARM) {
            id(set_overlay_mode).execute(OVERLAY_NONE);
          }
