# Voice Satellite 1 – Mode-Steuerung
#
# Die drei Modi werden ausschließlich über ihre Setter-Scripte geändert.
# Die Setter synchronisieren die HA-Debug-Selects und aktualisieren Display und LEDs.

globals:
  - id: my_content_mode
    type: ContentMode
    restore_value: no
    initial_value: 'ContentMode::BOOT'

  - id: my_assist_mode
    type: AssistMode
    restore_value: no
    initial_value: 'AssistMode::NONE'

  - id: my_overlay_mode
    type: OverlayMode
    restore_value: no
    initial_value: 'OverlayMode::NONE'

select:
  - platform: template
    id: my_content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    options:
      - BOOT
      - IDLE
      - PLAY
      - PAUSE
      - SHUTDOWN
    initial_option: BOOT
    optimistic: true
    set_action:
      - lambda: |-
          ContentMode mode;
          if (content_mode_from_string(x.c_str(), mode)) {
            id(set_content_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid content mode: %s", x.c_str());
          }

  - platform: template
    id: my_assist_mode_select
    name: "Assist Mode"
    entity_category: diagnostic
    options:
      - IDLE
      - LISTEN
      - THINK
      - ANNOUNCE
    initial_option: IDLE
    optimistic: true
    set_action:
      - lambda: |-
          AssistMode mode;
          if (assist_mode_from_string(x.c_str(), mode)) {
            id(set_assist_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid assist mode: %s", x.c_str());
          }

  - platform: template
    id: my_overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    options:
      - NONE
      - VOLUME
      - ERROR
      - ALARM
    initial_option: NONE
    optimistic: true
    set_action:
      - lambda: |-
          OverlayMode mode;
          if (overlay_mode_from_string(x.c_str(), mode)) {
            id(set_overlay_mode).execute(mode);
          } else {
            ESP_LOGW("modes", "Invalid overlay mode: %s", x.c_str());
          }

script:
  - id: set_content_mode
    parameters:
      mode: ContentMode
    then:
      - lambda: |-
          const char *mode_name = content_mode_to_string(mode);
          if (mode_name == nullptr) {
            ESP_LOGW("modes", "Invalid content mode");
            return;
          }
          id(my_content_mode) = mode;
          id(my_content_mode_select).publish_state(mode_name);
          ESP_LOGD("modes", "content_mode=%s", mode_name);
      - script.execute: update_content
      - script.execute: update_ledstrip

  - id: set_assist_mode
    parameters:
      mode: AssistMode
    then:
      - lambda: |-
          const char *mode_name = assist_mode_to_string(mode);
          if (mode_name == nullptr) {
            ESP_LOGW("modes", "Invalid assist mode");
            return;
          }
          id(my_assist_mode) = mode;
          id(my_assist_mode_select).publish_state(mode_name);
          ESP_LOGD("modes", "assist_mode=%s", mode_name);
      - script.execute: update_content
      - script.execute: update_ledstrip

  - id: set_overlay_mode
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          const char *mode_name = overlay_mode_to_string(mode);
          if (mode_name == nullptr) {
            ESP_LOGW("modes", "Invalid overlay mode");
            return;
          }
          id(my_overlay_mode) = mode;
          id(my_overlay_mode_select).publish_state(mode_name);
          ESP_LOGD("modes", "overlay_mode=%s", mode_name);
      - script.execute: update_content
      - script.execute: update_ledstrip

  # Generisches, zeitlich begrenztes Overlay (z. B. Lautstärke).
  - id: show_overlay
    mode: restart
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          id(set_overlay_mode).execute(mode);
      - delay: 5s
      - lambda: |-
          if (id(my_overlay_mode) == mode) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }

  - id: show_error
    mode: restart
    then:
      - lambda: |-
          id(show_overlay).execute(OverlayMode::ERROR);

  - id: show_alarm
    mode: restart
    then:
      - lambda: |-
          id(set_overlay_mode).execute(OverlayMode::ALARM);
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          if (id(my_overlay_mode) == OverlayMode::ALARM) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }
