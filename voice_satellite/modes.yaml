# Voice Satellite 1 – Mode-Steuerung
#
# Die drei Modi werden ausschließlich über ihre Setter-Scripte geändert.
# Die Setter synchronisieren die HA-Debug-Number und aktualisieren Display und LEDs.

globals:
  - id: my_content_mode
    type: ContentMode
    restore_value: no
    initial_value: 'ContentMode::BOOT'

  - id: my_assist_mode
    type: AssistMode
    restore_value: no
    initial_value: 'AssistMode::IDLE'

  - id: my_overlay_mode
    type: OverlayMode
    restore_value: no
    initial_value: 'OverlayMode::NONE'

number:
  - platform: template
    id: my_content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 4
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (x == 0) id(set_content_mode).execute(ContentMode::BOOT);
          else if (x == 1) id(set_content_mode).execute(ContentMode::IDLE);
          else if (x == 2) id(set_content_mode).execute(ContentMode::PLAY);
          else if (x == 3) id(set_content_mode).execute(ContentMode::PAUSE);
          else if (x == 4) id(set_content_mode).execute(ContentMode::SHUTDOWN);

  - platform: template
    id: my_assist_mode_select
    name: "Assist Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (x == 0) id(set_assist_mode).execute(AssistMode::IDLE);
          else if (x == 1) id(set_assist_mode).execute(AssistMode::LISTEN);
          else if (x == 2) id(set_assist_mode).execute(AssistMode::THINK);
          else if (x == 3) id(set_assist_mode).execute(AssistMode::ANNOUNCE);

  - platform: template
    id: my_overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (x == 0) id(set_overlay_mode).execute(OverlayMode::NONE);
          else if (x == 1) id(set_overlay_mode).execute(OverlayMode::VOLUME);
          else if (x == 2) id(set_overlay_mode).execute(OverlayMode::ERROR);
          else if (x == 3) id(set_overlay_mode).execute(OverlayMode::ALARM);

script:
  - id: set_content_mode
    parameters:
      mode: ContentMode
    then:
      - lambda: |-
          int mode_value;
          switch (mode) {
            case ContentMode::BOOT: mode_value = 0; break;
            case ContentMode::IDLE: mode_value = 1; break;
            case ContentMode::PLAY: mode_value = 2; break;
            case ContentMode::PAUSE: mode_value = 3; break;
            case ContentMode::SHUTDOWN: mode_value = 4; break;
            default:
              ESP_LOGW("modes", "Invalid content mode");
              return;
          }
          id(my_content_mode) = mode;
          id(my_content_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "content_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  - id: set_assist_mode
    parameters:
      mode: AssistMode
    then:
      - lambda: |-
          int mode_value;
          switch (mode) {
            case AssistMode::IDLE: mode_value = 0; break;
            case AssistMode::LISTEN: mode_value = 1; break;
            case AssistMode::THINK: mode_value = 2; break;
            case AssistMode::ANNOUNCE: mode_value = 3; break;
            default:
              ESP_LOGW("modes", "Invalid assist mode");
              return;
          }
          id(my_assist_mode) = mode;
          id(my_assist_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "assist_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  - id: set_overlay_mode
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          int mode_value;
          switch (mode) {
            case OverlayMode::NONE: mode_value = 0; break;
            case OverlayMode::VOLUME: mode_value = 1; break;
            case OverlayMode::ERROR: mode_value = 2; break;
            case OverlayMode::ALARM: mode_value = 3; break;
            default:
              ESP_LOGW("modes", "Invalid overlay mode");
              return;
          }
          id(my_overlay_mode) = mode;
          id(my_overlay_mode_select).publish_state(mode_value);
          ESP_LOGD("modes", "overlay_mode=%d", mode_value);
      - script.execute: update_display
      - script.execute: update_ledstrip

  # Generisches, zeitlich begrenztes Overlay (z. B. Lautstärke).
  - id: show_overlay
    mode: restart
    parameters:
      mode: OverlayMode
    then:
      - lambda: |-
          id(set_overlay_mode).execute(mode);
      - delay: 5s
      - lambda: |-
          if (id(my_overlay_mode) == mode) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }

  - id: show_error
    mode: restart
    then:
      - lambda: |-
          id(show_overlay).execute(OverlayMode::ERROR);

  - id: show_alarm
    mode: restart
    then:
      - lambda: |-
          id(set_overlay_mode).execute(OverlayMode::ALARM);
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          if (id(my_overlay_mode) == OverlayMode::ALARM) {
            id(set_overlay_mode).execute(OverlayMode::NONE);
          }
