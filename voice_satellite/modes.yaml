# Voice Satellite 1 – Mode-Steuerung
#
# Die drei Modi werden ausschließlich über ihre Setter-Scripte geändert.
# Die Setter synchronisieren die HA-Debug-Number und aktualisieren die Anzeige.

globals:
  - id: my_content_mode
    type: ContentMode
    restore_value: no
    initial_value: 'ContentMode::BOOT'

  - id: my_assist_mode
    type: AssistMode
    restore_value: no
    initial_value: 'AssistMode::IDLE'

  - id: my_overlay_mode
    type: OverlayMode
    restore_value: no
    initial_value: 'OverlayMode::NONE'

number:
  - platform: template
    id: my_content_mode_select
    name: "Content Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 4
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_content_mode).execute(static_cast<int>(x));

  - platform: template
    id: my_assist_mode_select
    name: "Assist Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_assist_mode).execute(static_cast<int>(x));

  - platform: template
    id: my_overlay_mode_select
    name: "Overlay Mode"
    entity_category: diagnostic
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          id(set_overlay_mode).execute(static_cast<int>(x));

script:
  - id: set_content_mode
    parameters:
      mode: int
    then:
      - lambda: |-
          if (mode < static_cast<int>(ContentMode::BOOT) ||
              mode > static_cast<int>(ContentMode::SHUTDOWN)) {
            ESP_LOGW("modes", "Invalid content mode: %d", mode);
            return;
          }
          id(my_content_mode) = static_cast<ContentMode>(mode);
          id(my_content_mode_select).publish_state(mode);
          ESP_LOGD("modes", "content_mode=%d", mode);
      - script.execute: update_display

  - id: set_assist_mode
    parameters:
      mode: int
    then:
      - lambda: |-
          if (mode < static_cast<int>(AssistMode::IDLE) ||
              mode > static_cast<int>(AssistMode::ANNOUNCE)) {
            ESP_LOGW("modes", "Invalid assist mode: %d", mode);
            return;
          }
          id(my_assist_mode) = static_cast<AssistMode>(mode);
          id(my_assist_mode_select).publish_state(mode);
          ESP_LOGD("modes", "assist_mode=%d", mode);
      - script.execute: update_display

  - id: set_overlay_mode
    parameters:
      mode: int
    then:
      - lambda: |-
          if (mode < static_cast<int>(OverlayMode::NONE) ||
              mode > static_cast<int>(OverlayMode::ALARM)) {
            ESP_LOGW("modes", "Invalid overlay mode: %d", mode);
            return;
          }
          id(my_overlay_mode) = static_cast<OverlayMode>(mode);
          id(my_overlay_mode_select).publish_state(mode);
          ESP_LOGD("modes", "overlay_mode=%d", mode);
      - script.execute: update_display

  # Generisches, zeitlich begrenztes Overlay (z. B. Lautstärke).
  - id: show_overlay
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: |-
          id(set_overlay_mode).execute(mode);
      - delay: 5s
      - lambda: |-
          if (id(my_overlay_mode) == static_cast<OverlayMode>(mode)) {
            id(set_overlay_mode).execute(static_cast<int>(OverlayMode::NONE));
          }

  - id: show_error
    mode: restart
    then:
      - lambda: |-
          id(show_overlay).execute(static_cast<int>(OverlayMode::ERROR));

  - id: show_alarm
    mode: restart
    then:
      - lambda: |-
          id(set_overlay_mode).execute(static_cast<int>(OverlayMode::ALARM));
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          id(play_ui_sound).execute(id(my_snd_timer_alarm));
      - delay: 3s
      - lambda: |-
          if (id(my_overlay_mode) == OverlayMode::ALARM) {
            id(set_overlay_mode).execute(static_cast<int>(OverlayMode::NONE));
          }
