# Voice Satellite 1 – Audio
#
# Ausgang unverändert zum funktionierenden speaker_2:
# 48 kHz / 32 Bit / Stereo auf zwei MAX98357A.
# Zwei getrennte Quellen: UI-Signaltöne und Voice-Assistant-Ausgabe.

audio:
  codecs:
    wav:

audio_file:
  - id: my_snd_boot
    file: "../sounds/boot.wav"
  - id: my_snd_click
    file: "../sounds/click.wav"
  - id: my_snd_wake
    file: "../sounds/wake.wav"
  - id: my_snd_thinking
    file: "../sounds/thinking.wav"
  - id: my_snd_error
    file: "../sounds/error.wav"
  - id: my_snd_success
    file: "../sounds/success.wav"
  - id: my_snd_connect
    file: "../sounds/api_connect.wav"
  - id: my_snd_disconnect
    file: "../sounds/api_disconnect.wav"

speaker:
  # Physischer Stereo-Ausgang
  - platform: i2s_audio
    id: my_hw_speaker
    i2s_audio_id: my_i2s_speaker
    dac_type: external
    i2s_dout_pin: ${spk_din_pin}
    bits_per_sample: 32bit
    sample_rate: 48000
    mclk_multiple: 256
    channel: stereo
    num_channels: 2
    buffer_duration: 200ms
    i2s_mode: primary

  # Gemeinsamer Stereo-Mixer mit zwei unabhängigen Quellen
  - platform: mixer
    id: my_audio_mixer
    output_speaker: my_hw_speaker
    num_channels: 2
    source_speakers:
      - id: my_va_sounds_mixer_input
        timeout: never
      - id: my_va_announcement_mixer_input
        timeout: never

  # UI-Signaltöne: 16 kHz mono -> Mixer / 48 kHz stereo
  - platform: resampler
    id: my_va_sounds_resampler
    output_speaker: my_va_sounds_mixer_input

  # HA-Sprachausgabe: 16 kHz mono -> Mixer / 48 kHz stereo
  - platform: resampler
    id: my_va_announcement_resampler
    output_speaker: my_va_announcement_mixer_input

media_player:
  - platform: speaker
    id: my_va_player
    internal: true
    buffer_size: 25000
    task_stack_in_psram: true

    media_pipeline:
      speaker: my_va_sounds_resampler
      sample_rate: 16000
      num_channels: 1
      format: WAV

    announcement_pipeline:
      speaker: my_va_announcement_resampler
      sample_rate: 16000
      num_channels: 1
      format: WAV

script:
  - id: my_play_ui_sound
    mode: parallel
    parameters:
      sound_id: int
    then:
      - lambda: |-
          // Script-Parameter sind auf die von ESPHome unterstützten
          // Basistypen beschränkt. Die Sounddatei wird deshalb per ID gewählt.
          switch (sound_id) {
            case 0:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_click)), false, true);
              break;
            case 1:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_wake)), false, true);
              break;
            case 2:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_thinking)), false, true);
              break;
            case 3:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_error)), false, true);
              break;
            case 4:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_success)), false, true);
              break;
            case 5:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_connect)), false, true);
              break;
            case 6:
              id(my_va_player).play_file(const_cast<audio::AudioFile *>(id(my_snd_disconnect)), false, true);
              break;
            default:
              break;
          }
